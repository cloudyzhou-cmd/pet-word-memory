<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>希希词语家</title>
  <style>
    :root {
      --primary: #007aff;
      --primary-dark: #005ecb;
      --success: #34c759;
      --warning: #ff9500;
      --danger: #ff3b30;
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #151922;
      --text-secondary: #858b98;
      --muted: #aeb4c0;
      --border: #e7eaf0;
      --purple: #7c5cff;
      --shadow: 0 14px 36px rgba(28, 36, 56, .08);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 7% -3%, rgba(0, 122, 255, .13), transparent 27rem),
        radial-gradient(circle at 102% 8%, rgba(124, 92, 255, .10), transparent 23rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    a { color: inherit; text-decoration: none; }
    .app-shell { width: 100%; max-width: 1120px; margin: 0 auto; min-height: 100vh; }
    .screen { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; padding: 20px 18px 112px; }
    .admin-screen { max-width: 1080px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 24px; }
    .brand-lockup { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(145deg, #2d9cff, #6c5ce7); box-shadow: 0 8px 16px rgba(0, 122, 255, .20); font-size: 24px; }
    .brand-title { font-weight: 800; letter-spacing: -.03em; font-size: 19px; line-height: 1.05; }
    .brand-subtitle { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
    .icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 14px; color: var(--text); background: rgba(255,255,255,.82); border: 1px solid rgba(229,231,238,.9); box-shadow: 0 5px 14px rgba(28,36,56,.05); font-size: 20px; }
    .eyebrow { color: var(--primary); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 31px; line-height: 1.12; letter-spacing: -.045em; }
    h2 { font-size: 23px; letter-spacing: -.03em; }
    h3 { font-size: 18px; }
    .muted { color: var(--text-secondary); }
    .small { font-size: 13px; }
    .tiny { font-size: 11px; }
    .stack { display: grid; gap: 16px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .card { background: rgba(255,255,255,.94); border: 1px solid rgba(231,234,240,.88); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-pad { padding: 20px; }
    .hero-card { padding: 22px; background: linear-gradient(145deg, #0c80fa 0%, #386cf0 58%, #6759df 100%); color: white; border: 0; overflow: hidden; position: relative; }
    .hero-card::after { content: ""; width: 170px; height: 170px; position: absolute; right: -46px; top: -66px; border-radius: 50%; border: 24px solid rgba(255,255,255,.10); }
    .hero-card::before { content: ""; width: 80px; height: 80px; position: absolute; right: 74px; bottom: -44px; border-radius: 50%; background: rgba(255,255,255,.10); }
    .hero-card > * { position: relative; z-index: 1; }
    .hero-card .eyebrow { color: rgba(255,255,255,.76); }
    .hero-number { font-size: 48px; line-height: 1; font-weight: 850; letter-spacing: -.06em; margin: 8px 0 4px; }
    .hero-number span { font-size: 18px; font-weight: 700; letter-spacing: 0; opacity: .76; }
    .progress-track { height: 9px; background: rgba(255,255,255,.23); border-radius: 999px; overflow: hidden; margin-top: 18px; }
    .progress-fill { height: 100%; background: #fff; border-radius: inherit; transition: width .35s ease; }
    .progress-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 9px; color: rgba(255,255,255,.76); font-size: 12px; }
    .task-card { padding: 18px; display: grid; gap: 13px; position: relative; overflow: hidden; }
    .task-card.new-task { background: linear-gradient(135deg, #ffffff 0%, #f0f8ff 100%); }
    .task-card.review-task { background: linear-gradient(135deg, #ffffff 0%, #fff7e8 100%); }
    .task-card.locked { filter: saturate(.65); }
    .task-icon { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 16px; font-size: 27px; background: rgba(255,255,255,.78); }
    .task-title { font-size: 19px; font-weight: 800; letter-spacing: -.025em; }
    .task-caption { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
    .word-preview { color: var(--primary-dark); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-status { padding: 6px 10px; border-radius: 999px; background: rgba(52,199,89,.12); color: #1a9c3b; font-size: 12px; font-weight: 800; }
    .task-status.pending { background: rgba(255,149,0,.14); color: #c26d00; }
    .task-status.lock { background: rgba(142,142,147,.13); color: var(--text-secondary); }
    .btn { min-height: 46px; padding: 11px 17px; border-radius: 13px; font-weight: 750; font-size: 16px; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    /* iOS Safari 对 display:none/hidden 的文件输入支持不稳定；让透明输入框直接覆盖按钮。 */
    .file-input-label { position: relative; overflow: hidden; cursor: pointer; }
    .file-input-label input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .001; cursor: pointer; font-size: 100px; }
    .btn:active { transform: scale(.96); }
    .btn-primary { color: #fff; background: var(--primary); box-shadow: 0 8px 16px rgba(0,122,255,.20); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { color: var(--text); background: #f1f3f7; }
    .btn-success { color: #fff; background: var(--success); box-shadow: 0 8px 16px rgba(52,199,89,.20); }
    .btn-warning { color: #fff; background: var(--warning); box-shadow: 0 8px 16px rgba(255,149,0,.20); }
    .btn-danger { color: #fff; background: var(--danger); }
    .btn-ghost { background: transparent; color: var(--primary); padding-left: 8px; padding-right: 8px; }
    .btn-block { width: 100%; }
    .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 560px); padding: 9px 10px calc(9px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(255,255,255,.91); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(224,227,235,.9); z-index: 20; }
    .nav-item { min-height: 52px; color: var(--text-secondary); border-radius: 14px; background: transparent; display: grid; place-items: center; gap: 2px; font-size: 11px; font-weight: 650; }
    .nav-item .nav-icon { font-size: 21px; line-height: 1; }
    .nav-item.active { color: var(--primary); background: rgba(0,122,255,.09); }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 26px 2px 12px; }
    .section-heading h2 { font-size: 20px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 9px; border-radius: 999px; background: #eef1f7; color: var(--text-secondary); font-size: 12px; font-weight: 750; }
    .badge.blue { color: var(--primary-dark); background: #e7f2ff; }
    .badge.green { color: #198c39; background: #e9f9ed; }
    .badge.orange { color: #bc6d00; background: #fff2dd; }
    .empty { text-align: center; padding: 34px 20px; color: var(--text-secondary); }
    .empty-icon { font-size: 44px; margin-bottom: 10px; }
    .streak-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat { background: rgba(255,255,255,.82); border: 1px solid var(--border); border-radius: 16px; padding: 14px 10px; text-align: center; }
    .stat-number { font-size: 24px; font-weight: 850; letter-spacing: -.04em; }
    .stat-label { margin-top: 4px; color: var(--text-secondary); font-size: 11px; }
    .word-list { display: grid; gap: 10px; }
    .course-group { display: grid; gap: 10px; }
    .course-group + .course-group { margin-top: 18px; }
    .course-group-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; color: var(--primary-dark); font-size: 14px; font-weight: 850; }
    .course-group-title span { color: var(--text-secondary); font-size: 12px; font-weight: 650; }
    .extra-study-card { background: linear-gradient(135deg, #fffdf4 0%, #fff7df 100%); border-color: #ffe0a1; }
    .extra-study-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .extra-study-actions .btn { min-width: 0; padding-left: 8px; padding-right: 8px; }
    .word-row { display: grid; grid-template-columns: 45px 1fr auto; align-items: center; gap: 12px; padding: 13px; background: rgba(255,255,255,.9); border: 1px solid var(--border); border-radius: 17px; }
    .word-emoji { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 14px; background: #f3f6fa; font-size: 25px; overflow: hidden; }
    .word-emoji img { width: 100%; height: 100%; object-fit: cover; }
    .image-picker { display: grid; gap: 10px; padding: 14px; border: 1px dashed #b9c4d5; border-radius: 15px; background: #f8fbff; }
    .image-picker-preview { display: flex; align-items: center; gap: 12px; min-height: 72px; }
    .image-picker-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 15px; border: 1px solid var(--border); background: #fff; }
    .image-picker-preview .muted { line-height: 1.55; }
    .word-name { font-size: 17px; font-weight: 800; }
    .word-meaning { color: var(--text-secondary); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 13px 15px 13px 42px; min-height: 48px; border: 1px solid var(--border); border-radius: 15px; outline: 0; background: rgba(255,255,255,.86); }
    .search-box span { position: absolute; left: 15px; top: 13px; color: var(--text-secondary); font-size: 19px; }
    .input, .textarea, .select { width: 100%; min-height: 48px; border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; outline: 0; color: var(--text); background: #fff; transition: border .2s, box-shadow .2s; }
    .textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
    .input:focus, .textarea:focus, .select:focus { border-color: rgba(0,122,255,.65); box-shadow: 0 0 0 4px rgba(0,122,255,.10); }
    label.field { display: grid; gap: 7px; color: var(--text-secondary); font-size: 13px; font-weight: 700; }
    .field-grid { display: grid; gap: 13px; }
    @media (min-width: 720px) { .field-grid.two { grid-template-columns: 1fr 1fr; } .screen { padding-left: 26px; padding-right: 26px; } }
    .switch-line { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .switch-line:last-child { border-bottom: 0; padding-bottom: 0; }
    .switch { width: 52px; height: 32px; padding: 3px; border-radius: 999px; background: #d8dce5; transition: background .2s; }
    .switch i { width: 26px; height: 26px; display: block; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.14); transition: transform .2s; }
    .switch.on { background: var(--success); }
    .switch.on i { transform: translateX(20px); }
    .profile-hero { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 15px; }
    .avatar { width: 70px; height: 70px; display: grid; place-items: center; border-radius: 23px; background: linear-gradient(145deg, #ffe28a, #ffaf61); font-size: 40px; box-shadow: 0 10px 18px rgba(255,149,0,.17); }
    .progress-ring { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--success) var(--ring, 0%), #edf0f4 0); position: relative; }
    .progress-ring::after { content: ""; position: absolute; inset: 5px; background: #fff; border-radius: 50%; }
    .progress-ring span { position: relative; z-index: 1; font-size: 12px; font-weight: 800; }
    .guide-backdrop, .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(17,24,39,.38); display: grid; place-items: center; padding: 18px; }
    .guide { width: min(100%, 410px); overflow: hidden; background: #fff; border-radius: 26px; box-shadow: 0 28px 80px rgba(13,26,56,.22); }
    .guide-visual { min-height: 220px; display: grid; place-items: center; position: relative; background: linear-gradient(145deg, #e8f4ff, #f3efff); font-size: 90px; }
    .guide-visual::before, .guide-visual::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.72); }
    .guide-visual::before { width: 150px; height: 150px; top: -45px; left: -38px; }
    .guide-visual::after { width: 110px; height: 110px; bottom: -34px; right: -20px; }
    .guide-copy { padding: 23px; }
    .guide-copy h2 { margin-bottom: 9px; }
    .guide-copy p { color: var(--text-secondary); line-height: 1.7; font-size: 15px; }
    .dots { display: flex; gap: 6px; margin: 20px 0; }
    .dot { width: 7px; height: 7px; border-radius: 9px; background: #d7dce6; transition: width .2s, background .2s; }
    .dot.active { width: 23px; background: var(--primary); }
    .learn-wrap { min-height: calc(100vh - 40px); display: grid; grid-template-rows: auto 1fr auto; gap: 16px; }
    .learn-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .step-label { color: var(--text-secondary); font-size: 13px; font-weight: 750; }
    .learning-card { display: flex; align-items: center; justify-content: center; perspective: 1200px; min-height: 540px; }
    .flip-card { width: 100%; min-height: 510px; position: relative; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.4,0,.2,1); }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: auto; }
    .flip-front { background: linear-gradient(145deg, #fff, #f0f7ff); border: 1px solid #dfeefd; box-shadow: var(--shadow); }
    .flip-back { transform: rotateY(180deg); align-items: stretch; text-align: left; background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .visual-word { width: 190px; height: 190px; display: grid; place-items: center; border-radius: 52px; background: rgba(255,255,255,.8); box-shadow: 0 15px 35px rgba(43,87,139,.10); font-size: 82px; margin: 42px auto 22px; overflow: hidden; }
    .visual-word img { width: 100%; height: 100%; object-fit: cover; }
    .word-big { font-size: clamp(28px, 8vw, 38px); line-height: 1.12; font-weight: 850; letter-spacing: -.045em; word-break: break-word; }
    .phonetic { color: var(--text-secondary); font-size: 18px; margin-top: 8px; }
    .speak-btn { margin-top: 25px; color: var(--primary); background: rgba(0,122,255,.10); }
    .flip-action { margin-top: auto; padding-top: 24px; color: var(--text-secondary); font-size: 14px; }
    .flip-action .btn { margin-top: 9px; }
    .countdown { color: var(--warning); font-weight: 800; }
    .meaning-large { font-size: 25px; font-weight: 800; margin: 14px 0 18px; }
    .example-en { font-size: 17px; line-height: 1.65; color: #293448; }
    .example-en mark { background: #fff0c4; padding: 0 3px; border-radius: 4px; color: inherit; }
    .example-cn { color: var(--text-secondary); margin-top: 7px; line-height: 1.6; }
    .hint-box { margin-top: 19px; padding: 13px; border-radius: 14px; color: #855b00; background: #fff8e5; font-size: 14px; line-height: 1.55; }
    .flip-back .choice-self { margin-top: auto; padding-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .review-card { min-height: 480px; padding: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(145deg, #fff, #fff7e8); border: 1px solid #ffe5b4; }
    .review-card .visual-word { margin: 16px auto 24px; width: 150px; height: 150px; font-size: 68px; }
    .self-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; width: 100%; margin-top: 30px; }
    .self-grid .btn { min-height: 58px; }
    .quiz-card, .spell-card { padding: 23px; background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 24px; }
    .quiz-visual { display: grid; place-items: center; margin: 22px 0 18px; }
    .quiz-visual .visual-word { width: 125px; height: 125px; margin: 0 0 14px; font-size: 57px; }
    .quiz-word { font-size: 28px; font-weight: 850; letter-spacing: -.04em; }
    .quiz-options { display: grid; gap: 11px; margin-top: 22px; }
    .quiz-option { min-height: 53px; padding: 12px 14px; text-align: left; border-radius: 14px; border: 2px solid var(--border); background: #fff; color: var(--text); font-weight: 650; display: flex; align-items: center; gap: 10px; }
    .quiz-option:hover { border-color: #9fcbff; background: #f8fbff; }
    .quiz-option.correct { color: #197834; border-color: var(--success); background: #eefbf1; }
    .quiz-option.wrong { color: #b92720; border-color: var(--danger); background: #fff1f0; animation: shake .3s ease-in-out; }
    .option-letter { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: #f0f2f6; color: var(--text-secondary); font-size: 13px; flex: 0 0 auto; }
    .quiz-feedback { margin-top: 17px; min-height: 25px; font-weight: 800; }
    .feedback-good { color: #1a9c3b; }
    .feedback-bad { color: #d04a00; }
    .spell-card { min-height: 530px; }
    .spell-prompt { text-align: center; }
    .spell-prompt .meaning-large { margin: 18px 0 7px; }
    .spell-example { color: var(--text-secondary); line-height: 1.55; font-size: 14px; }
    .spell-example strong { color: var(--text); }
    .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; margin: 20px 0 17px; border-radius: 13px; background: #f0f2f6; }
    .mode-btn { min-height: 44px; border-radius: 10px; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 750; }
    .mode-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 7px rgba(0,0,0,.08); }
    .spell-input { min-height: 62px; text-align: center; font-size: 25px; letter-spacing: .18em; font-weight: 750; border: 2px solid #cdd3de; }
    .spell-input.error { border-color: var(--danger); color: var(--danger); background: #fff7f7; animation: shake .3s ease-in-out; }
    .spell-input.success { border-color: var(--success); color: #1a9c3b; background: #f2fff4; }
    .spell-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .compare { margin: 15px 0 0; padding: 13px; background: #fafbfc; border-radius: 13px; text-align: center; letter-spacing: .16em; font-size: 18px; font-weight: 750; word-break: break-all; }
    .compare-label { letter-spacing: 0; font-size: 14px; line-height: 1.7; margin-bottom: 8px; color: var(--text-secondary); }
    .letter-right { color: #1a9c3b; }
    .letter-wrong { color: var(--danger); text-decoration: underline; text-decoration-thickness: 2px; }
    .letter-missing { color: var(--text-secondary); }
    .drag-slots { min-height: 61px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 9px; border-radius: 15px; background: #f8f9fb; }
    .slot { width: 26px; height: 38px; display: grid; place-items: center; border-bottom: 3px solid #bfc5d0; font-size: 22px; font-weight: 800; text-transform: lowercase; }
    .slot.filled { color: var(--primary); border-color: var(--primary); }
    .letter-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 18px 3px 5px; }
    .letter-tile { min-width: 44px; min-height: 44px; padding: 5px 10px; border-radius: 11px; color: var(--text); background: #f0f3f8; border: 1px solid #dfe4ed; font-weight: 850; font-size: 18px; box-shadow: 0 2px 0 #d6dce5; }
    .letter-tile.used { opacity: .34; transform: translateY(2px); box-shadow: none; }
    .spell-success { display: grid; place-items: center; text-align: center; padding: 45px 10px; }
    .success-icon { font-size: 76px; animation: pop .4s cubic-bezier(.175,.885,.32,1.275); }
    .spell-success h2 { color: #1a9c3b; margin: 12px 0 7px; }
    .exit-row { padding-bottom: 4px; }
    .toast { position: fixed; left: 50%; bottom: calc(82px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 80; max-width: calc(100vw - 36px); padding: 12px 16px; color: white; background: rgba(28,32,42,.92); border-radius: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; font-size: 14px; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
    .admin-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin: 0 0 20px; }
    .admin-tab { min-height: 44px; flex: 0 0 auto; padding: 9px 14px; color: var(--text-secondary); border-radius: 12px; background: rgba(255,255,255,.72); font-size: 14px; font-weight: 750; }
    .admin-tab.active { color: #fff; background: var(--primary); }
    .admin-layout { display: grid; gap: 16px; }
    @media (min-width: 820px) { .admin-layout { grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); } }
    .admin-table-wrap { overflow-x: auto; }
    .admin-table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; }
    .admin-table th { color: var(--text-secondary); text-align: left; font-size: 12px; font-weight: 750; padding: 11px 9px; border-bottom: 1px solid var(--border); }
    .admin-table td { padding: 12px 9px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
    .table-actions { display: flex; gap: 6px; }
    .mini-btn { min-width: 44px; min-height: 44px; padding: 6px 9px; border-radius: 10px; background: #f0f3f8; color: var(--text-secondary); font-size: 13px; font-weight: 750; }
    .mini-btn.blue { color: var(--primary-dark); background: #eaf3ff; }
    .mini-btn.red { color: #c52c26; background: #fff0ef; }
    .preview-list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .preview-item { padding: 11px; border: 1px solid var(--border); border-radius: 13px; background: #fafbfc; }
    .preview-item strong { font-size: 15px; }
    .preview-item .muted.small:empty::before { content: '待补充中文释义'; color: var(--warning); }
    .ocr-result { margin-top: 12px; padding: 12px; border: 1px dashed #9fc5f2; border-radius: 14px; background: #f6fbff; }
    .ocr-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .ocr-chip { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 10px; color: var(--primary-dark); background: #e8f3ff; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .ocr-raw { margin-top: 9px; color: var(--text-secondary); font-size: 12px; }
    .ocr-raw pre { max-height: 150px; overflow: auto; margin-top: 7px; padding: 10px; white-space: pre-wrap; word-break: break-word; color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 11px; }
    .preview-item .preview-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; }
    .canvas-wrap { position: relative; height: 220px; }
    .canvas-wrap canvas { width: 100%; height: 100%; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(100%, 390px); padding: 25px; }
    .login-lock { width: 68px; height: 68px; margin: 0 auto 15px; display: grid; place-items: center; border-radius: 22px; background: #e9f3ff; font-size: 35px; }
    .modal { width: min(100%, 430px); max-height: 90vh; overflow: auto; padding: 22px; background: #fff; border-radius: 22px; box-shadow: 0 28px 80px rgba(13,26,56,.22); }
    .modal h2 { margin-bottom: 9px; }
    .import-options { display: grid; gap: 10px; margin-top: 18px; }
    .notice { padding: 13px 14px; color: #5c4a20; background: #fff8e5; border-radius: 13px; font-size: 13px; line-height: 1.6; }
    .privacy-note { color: var(--text-secondary); text-align: center; font-size: 12px; line-height: 1.6; margin-top: 18px; }
    .coin-hero { padding: 22px; color: #fff; background: linear-gradient(145deg, #ffb300, #ff8a00 55%, #ff6b6b); border: 0; overflow: hidden; position: relative; }
    .coin-hero::after { content: "希"; position: absolute; right: 18px; top: -18px; color: rgba(255,255,255,.14); font-size: 118px; font-weight: 900; transform: rotate(12deg); }
    .coin-hero > * { position: relative; z-index: 1; }
    .coin-hero .eyebrow { color: rgba(255,255,255,.82); }
    .coin-number { font-size: 48px; line-height: 1; font-weight: 900; letter-spacing: -.06em; margin: 9px 0 6px; }
    .coin-number span { font-size: 17px; letter-spacing: 0; opacity: .86; }
    .growth-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .growth-stat { padding: 15px; border-radius: 16px; background: linear-gradient(145deg,#fff,#fff8ec); border: 1px solid #ffe8ba; }
    .growth-stat .stat-number { color: #d87800; }
    .growth-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
    .calendar-day { min-height: 68px; display: grid; place-items: center; align-content: center; gap: 3px; border-radius: 13px; background: #f4f6f9; color: var(--text-secondary); font-size: 11px; }
    .calendar-day.today { outline: 2px solid rgba(0,122,255,.45); outline-offset: 1px; }
    .calendar-day.done { color: #a55b00; background: #fff1ce; }
    .calendar-day .calendar-icon { font-size: 21px; line-height: 1; }
    .word-row.clickable { cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
    .word-row.clickable:active { transform: scale(.985); }
    .word-row.clickable:hover { border-color: #a9d2ff; box-shadow: 0 8px 20px rgba(0,122,255,.08); }
    .word-row-actions { display: flex; align-items: center; gap: 5px; }
    .word-row-actions .mini-btn { min-width: 40px; }
    .notebook-bar { display: grid; gap: 7px; padding: 13px 14px; border: 1px solid #dcecff; border-radius: 16px; background: linear-gradient(135deg,#f7fbff,#fff); }
    .notebook-bar label { color: var(--text-secondary); font-size: 12px; font-weight: 750; }
    .notebook-select { min-height: 46px; font-weight: 800; color: var(--primary-dark); background: #fff; }
    .notebook-grid { display: grid; gap: 10px; }
    .notebook-card { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px; padding: 13px; border: 1px solid var(--border); border-radius: 16px; background: #fff; }
    .notebook-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; font-size: 25px; background: #eef6ff; }
    .notebook-card .tiny { line-height: 1.45; }
    .notebook-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .notebook-actions .mini-btn { min-width: 44px; }
    .move-select { min-height: 44px; max-width: 170px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--primary-dark); font-size: 12px; font-weight: 750; }
    .word-card-modal { width: min(100%, 460px); max-height: 90vh; overflow: auto; padding: 22px; background: #fff; border-radius: 24px; box-shadow: 0 28px 80px rgba(13,26,56,.22); }
    .word-card-modal .modal-visual { margin: 12px auto 16px; }
    .word-card-modal .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
    .word-card-modal .modal-actions .btn:last-child { grid-column: 1 / -1; }
    .coin-pop { animation: coinPop .5s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes coinPop { 0% { transform: scale(.7) rotate(-8deg); opacity: .2; } 70% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes pop { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>

aning":"救护车","synonym":"emergency vehicle","exampleEn":"The ambulance arrived quickly at the scene.","exampleCn":"救护车很快到达了现场。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"annoying","phonetic":"[əˈnɔɪɪŋ]","pos":"adj.","meaning":"令人恼怒的","synonym":"irritating","exampleEn":"The constant noise from the construction site is really annoying.","exampleCn":"建筑工地持续的噪音实在令人恼火。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"pour","phonetic":"[pɔː(r)]","pos":"v.","meaning":"雨倾盆而下，倾泻","synonym":"rain","exampleEn":"She poured hot water into the cup carefully.","exampleCn":"她小心翼翼地把热水倒进杯子里。","unit":7,"lesson":1,"label":"","emoji":"🌧️"},{"term":"liquid","phonetic":"[ˈlɪkwɪd]","pos":"n.","meaning":"液体；液态物","synonym":"fluid","exampleEn":"She poured the dark brown liquid down the sink.","exampleCn":"她把深棕色的液体倒进了洗碗槽。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"crossroad","phonetic":"[ˈkrɒsrəʊd]","pos":"n.","meaning":"十字路口","synonym":"intersection","exampleEn":"Turn left at the next crossroad and you'll see the park.","exampleCn":"在下一个十字路口左转，你就会看到公园。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"crash","phonetic":"[kræʃ]","pos":"v.","meaning":"碰撞；坠毁；撞碎","synonym":"collide","exampleEn":"The car crashed into a tree because the driver lost control.","exampleCn":"司机失控，汽车撞到了树上。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"stuck","phonetic":"[stʌk]","pos":"adj.","meaning":"被困的；陷入困境的","synonym":"trapped","exampleEn":"My phone got stuck in the mud and won't turn on.","exampleCn":"我的手机陷进泥里，开不了机了。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"switch off","phonetic":"[swɪtʃ ɒf]","pos":"phr.","meaning":"关闭；关掉","synonym":"turn off","exampleEn":"Don't forget to switch off the lights before leaving the room.","exampleCn":"离开房间前别忘了关灯。","unit":7,"lesson":1,"label":"","emoji":"📌"},{"term":"frozen","phonetic":"[ˈfrəʊzn]","pos":"adj.","meaning":"冻结的；冷冻的","synonym":"icy","exampleEn":"The lake is frozen solid in winter, so people can skate on it.","exampleCn":"冬     /** 轻量本地数据层：优先 IndexedDB，遇到 Safari 隐私模式或数据库异常时自动降级。 */
    class PETDatabase {
      constructor() { this.db = null; this.fallback = false; this.DB_NAME = 'PETWordDB'; this.DB_VERSION = 2; this.fallbackKey = 'PETWordDB_FALLBACK'; }
      async init() {
        if (!('indexedDB' in window)) { this.fallback = true; return this.loadFallback(); }
        try {
          await new Promise((resolve, reject) => {
            const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
            request.onupgradeneeded = () => {
              const db = request.result;
              if (!db.objectStoreNames.contains('words')) { const store = db.createObjectStore('words', { keyPath: 'id', autoIncrement: true }); store.createIndex('word', 'word', { unique: false }); store.createIndex('nextReview', 'nextReview', { unique: false }); }
              if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
              if (!db.objectStoreNames.contains('dailyLog')) { const log = db.createObjectStore('dailyLog', { keyPath: 'id', autoIncrement: true }); log.createIndex('date', 'date', { unique: false }); }
              if (!db.objectStoreNames.contains('notebooks')) { const books = db.createObjectStore('notebooks', { keyPath: 'id', autoIncrement: true }); books.createIndex('name', 'name', { unique: false }); books.createIndex('sortOrder', 'sortOrder', { unique: false }); }
            };
            request.onsuccess = () => { this.db = request.result; resolve(); };
            request.onerror = () => reject(request.error || new Error('IndexedDB unavailable'));
          });
        } catch (error) { this.fallback = true; this.loadFallback(); }
      }
      loadFallback() { try { this.fallbackData = JSON.parse(localStorage.getItem(this.fallbackKey) || '{"words":[],"settings":[],"dailyLog":[],"notebooks":[]}'); } catch { this.fallbackData = { words: [], settings: [], dailyLog: [], notebooks: [] }; } }
      saveFallback() { localStorage.setItem(this.fallbackKey, JSON.stringify(this.fallbackData)); }
      async all(storeName) { if (this.fallback) return [...(this.fallbackData[storeName] || [])]; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); }); }
      async get(storeName, key) { if (this.fallback) return (this.fallbackData[storeName] || []).find(item => item.id === key || item.key === key) || null; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); }); }
      async put(storeName, value) {
        if (this.fallback) {
          const list = this.fallbackData[storeName] || (this.fallbackData[storeName] = []);
          if (storeName === 'words' || storeName === 'dailyLog' || storeName === 'notebooks') {
            if (!value.id) value.id = list.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
          }
          const index = list.findIndex(item => (storeName === 'settings' ? item.key === value.key : item.id === value.id));
          if (index >= 0) list[index] = value; else list.push(value);
          this.saveFallback(); return value;
        }
        /* IndexedDB 的 keyPath 不接受 id: undefined，因此新增记录时移除该属性。 */
        const record = { ...value };
        if (storeName !== 'settings' && record.id === undefined) delete record.id;
        return new Promise((resolve, reject) => {
          const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).put(record);
          req.onsuccess = () => { if (!record.id && storeName !== 'settings') record.id = req.result; Object.assign(value, record); resolve(value); };
          req.onerror = () => reject(req.error);
        });
      }
      async add(storeName, value) { return this.put(storeName, value); }
      async delete(storeName, key) { if (this.fallback) { this.fallbackData[storeName] = (this.fallbackData[storeName] || []).filter(item => item.id !== key && item.key !== key); this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).delete(key); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async clear(storeName) { if (this.fallback) { this.fallbackData[storeName] = []; this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).clear(); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async bulkPut(storeName, values) { for (const value of values) await this.put(storeName, value); }
    }

      const availableNew = State.words.filter(word => word.status === 'new' && !usedNew.has(word.id)).sort((a, b) => a.createdAt - b.createdAt);

      /** 选择本机较自然的本地语音；不同设备可用的声音名称不同，因此保留语言前缀兜底。 */
      voiceFor(lang) {
        const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
        const prefix = lang.toLowerCase().split('-')[0];
        const candidates = voices.filter(voice => voice.lang.toLowerCase().startsWith(prefix));
        const preferred = prefix === 'en'
          ? /samantha|karen|moira|siri|ava|susan|female/i
          : /ting-ting|meijia|sin-ji|siri|female/i;
        return candidates.find(voice => preferred.test(voice.name)) || candidates.find(voice => voice.localService) || candidates[0] || null;
      },
      speak(text, lang = 'en-US', rate = .8, cancel = true) {
        if (!State.settings.soundEnabled || !('speechSynthesis' in window) || !text) return;
        try {
          if (cancel) speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(String(text));

          utterance.rate = rate;

        if (!State.settings.soundEnabled || !('speechSynthesis' in window)) return;
        const queue = items.filter(item => item.text);
        if (!queue.length) return;

          speechSynthesis.cancel();
          const play = (index) => {
            const item = queue[index];
            if (!item) return;
            const utterance = new SpeechSynthesisUtterance(String(item.text));
            utterance.lang = item.lang;
            utterance.rate = rate;
            utterance.pitch = 1;
            const voice = this.voiceFor(item.lang);
            if (voice) utterance.voice = voice;
            utterance.onend = () => setTimeout(() => play(index + 1), 450);
            utterance.onerror = () => {};

          };

        } catch (_) {}
      },

    function weekStats() { const now = new Date(); const day = (now.getDay() + 6) % 7; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day); const keys = []; for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); keys.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); } const logs = State.logs.filter(log => keys.includes(log.date)); return { completed: Math.min(30, unique(logs.flatMap(log => log.wordsStudied || [])).length), days: logs.filter(log => log.completed || ((log.wordsStudied || []).length + (log.wordsReviewed || []).length > 0)).length, keys, logs }; }
    function renderWords() { const query = State.wordSearch.trim().toLowerCase(); const words = State.words.filter(word => !query || word.word.toLowerCase().includes(query) || word.meaning.includes(query)); return `<section class="screen">${pageTop('词库', `${State.words.length} 个单词`)}<div class="stack"><div class="search-box"><span>⌕</span><input class="input" style="padding-left:42px" data-input="word-search" value="${escapeHtml(State.wordSearch)}" placeholder="搜索英文或中文释义" aria-label="搜索词库"></div><div class="row between"><h2>我的单词本</h2><span class="muted small">${words.length} 个结果</span></div><div class="word-list">${words.length ? words.map(word => `<article class="word-row">${wordVisual(word)}<div style="min-width:0"><div class="row" style="gap:7px;flex-wrap:wrap"><span class="word-name">${escapeHtml(word.word)}</span>${statusBadge(word)}</div><div class="word-meaning">${escapeHtml(word.meaning)}${word.phonetic ? ` · ${escapeHtml(word.phonetic)}` : ''}</div></div><button class="icon-btn" data-action="speak" data-id="${word.id}" aria-label="朗读 ${escapeHtml(word.word)}">🔊</button></article>`).join('') : '<div class="card empty"><div class="empty-icon">🔎</div><p>没有找到相关单词</p><p class="small" style="margin-top:6px">试试搜索另一个词吧。</p></div>'}</div></div>${navBar()}</section>`; }

    function renderProfile() { const stats = profileStats(); const weekly = weekStats(); const ring = Math.min(100, Math.round(weekly.completed / 30 * 100)); return `<section class="screen">${pageTop('我的', '看看自己的成长')}

      <section class="card card-pad"><div class="section-heading" style="margin:0 0 4px"><h3>学习偏好</h3><span class="badge blue">本机保存</span></div><div class="switch-line"><div><strong>学习语音</strong><div class="muted tiny" style="margin-top:4px">朗读单词、例句和中文释义</div></div><button class="switch ${State.settings.soundEnabled ? 'on' : ''}" data-action="toggle-sound" aria-label="切换语音"><i></i></button></div><div class="switch-line"><div><strong>朗读速度</strong><div class="muted tiny" style="margin-top:4px">选择适合自己的节奏</div></div><select class="select" style="width:130px;min-height:42px" data-input="speech-rate"><option value="slow" ${State.settings.speechRate === 'slow' ? 'selected' : ''}>慢一点</option><option value="normal" ${State.settings.speechRate === 'normal' ? 'selected' : ''}>正常</option><option value="fast" ${State.settings.speechRate === 'fast' ? 'selected' : ''}>快一点</option></select></div></section>
      <section class="card card-pad"><div class="row between"><div><h3>学习工具</h3><p class="muted small" style="margin-top:6px">录入词库、查看看板和备份数据</p></div><button class="btn btn-secondary" data-action="open-admin-tab" data-tab="overview">打开工具</button></div></section><p class="privacy-note">学习记录保存在这台设备上。在线补全和拍照识别需要联网。</p></div>${navBar()}</section>`; }
    function profileStats() { const mastered = State.words.filter(word => word.status === 'mastered').length; const minutes = State.logs.reduce((sum, log) => sum + (log.durationMinutes || 0), 0); const sorted = State.logs.map(log => log.date).sort().reverse(); let streak = 0; let cursor = new Date(); for (const key of sorted) { const expected = `${cursor.getFullYear()}-${pad(cursor.getMonth()+1)}-${pad(cursor.getDate())}`; if (key !== expected) { if (streak === 0 && key === todayKey()) { streak++; cursor.setDate(cursor.getDate() - 1); continue; } break; } const log = State.logs.find(item => item.date === key); if (log && ((log.completed) || (log.wordsStudied || []).length)) { streak++; cursor.setDate(cursor.getDate() - 1); } else break; } return { mastered, minutes, streak }; }

    /* ==================== 学习流程 ==================== */
    async function startTask(type) {
      const tasks = await getTodayTasks();
      const ids = type === 'new' ? tasks.log.plannedNew : tasks.log.plannedReview;

      const nextId = ids.find(id => !done.includes(id));

    }
    function currentWord() { return State.words.find(word => word.id === State.currentTask?.wordId); }

    function stageName(stage) { return ({ A:'第 1 步 · 认识', R:'复习自评', 'R-card':'完整单词卡', B:'第 2 步 · 选择', C:'第 3 步 · 拼写' })[stage] || ''; }
    function taskProgressText() { const log = currentLog() || {}; const ids = State.currentTask?.type === 'review' ? (log.plannedReview || []) : (log.plannedNew || []); const done = State.currentTask?.type === 'review' ? (log.wordsReviewed || []) : (log.wordsStudied || []); const index = Math.max(0, ids.indexOf(State.currentTask?.wordId)); return `${Math.min(index + 1, ids.length)} / ${ids.length}`; }
    function visualBlock(word, className = 'visual-word') { const fallback = word.emoji || getEmoji(word.meaning, word.word); return word.imageUrl ? `<div class="${className}"><img src="${escapeHtml(word.imageUrl)}" data-fallback="${escapeHtml(fallback)}" alt="${escapeHtml(word.word)}" onerror="handleImageError(this)"></div>` : `<div class="${className}">${escapeHtml(fallback)}</div>`; }

    function highlightWord(sentence = '', word = '') { const safe = escapeHtml(sentence); const escapedWord = escapeHtml(word); return safe.replace(new RegExp(`(${escapedWord})`, 'ig'), '<mark>$1</mark>'); }
    function bindLearningTimers() { if (State.currentTask?.stage === 'A' && !State.stageAFlipped && Date.now() < State.stageAReadyAt) { const tick = () => { if (State.currentTask?.stage !== 'A' || State.stageAFlipped) return; const target = $('[data-countdown]'); if (!target) return; const left = Math.max(0, Math.ceil((State.stageAReadyAt - Date.now()) / 1000)); target.textContent = left ? `${left}秒后可翻转` : '可以翻转啦'; if (left) setTimeout(tick, 250); else renderLearning(); }; tick(); } if (State.currentTask?.stage === 'C' && State.spell?.mode === 'keyboard') setTimeout(() => $('.spell-input')?.focus(), 60); }
    function renderReviewSelf(word) { return `<article class="card review-card"><div class="eyebrow">复习一下</div>${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '')}</div><div class="muted small" style="margin-top:9px">先想一想它是什么意思</div><div class="self-grid"><button class="btn btn-success" data-action="review-self" data-known="true">记得 😊</button><button class="btn btn-warning" data-action="review-self" data-known="false">不太记得 🤔</button></div><button class="btn btn-ghost" style="margin-top:10px" data-action="speak-current">🔊 听一遍</button></article>`; }
    /** 复习自评“不太记得”后先展示完整卡片，再进入拼写，不让孩子直接跳到空白测试。 */
    function renderReviewReveal(word) { return `<article class="card review-card review-reveal"><div class="eyebrow">完整单词卡</div>${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '音标待补充')}</div><div class="meaning-large">${escapeHtml(word.meaning || '中文释义待补充')}</div>${word.exampleEn ? `<div class="example-en">${highlightWord(word.exampleEn, word.word)}</div>` : '<div class="muted">暂无英文例句</div>'}${word.exampleCn ? `<div class="example-cn">${escapeHtml(word.exampleCn)}</div>` : ''}${word.hint ? `<div class="hint-box">💡 <strong>记忆小提示</strong><br>${escapeHtml(word.hint)}</div>` : ''}<button class="btn btn-primary btn-block" style="margin-top:18px" data-action="review-card-continue">看完了，开始拼写 →</button><button class="btn btn-ghost btn-block" style="margin-top:7px" data-action="speak-current">🔊 听一遍</button></article>`; }
    function quizMeaning(word) { const curated = referenceDataFor(word?.word); return looksLikeBadMeaning(word?.meaning) && curated?.meaning ? curated.meaning : String(word?.meaning || ''); }
    function makeQuiz(word) { const answer = quizMeaning(word); const otherMeanings = State.words.filter(item => item.id !== word.id && !looksLikeBadMeaning(item.meaning)).map(item => item.meaning); const fallback = ['广告', '挑战', '贡献', '庆祝', '住处，住宿', '机会', '环境', '决定']; const choices = unique([answer, ...shuffle([...otherMeanings, ...fallback])].filter(Boolean)).slice(0, 4); return shuffle(choices); }
    function shuffle(list) { return list.sort(() => Math.random() - .5); }
    function renderStageB(word) { const answer = quizMeaning(word); if (!State.stageB) State.stageB = { choices: makeQuiz(word), selected: null, correct: null }; const quiz = State.stageB; return `<article class="card quiz-card"><div class="eyebrow">选一选</div><h2 style="margin-top:8px">这个单词是什么意思？</h2><div class="quiz-visual">${visualBlock(word, 'visual-word')}<div class="quiz-word">${escapeHtml(word.word)}</div></div><div class="quiz-options">${quiz.choices.map((choice, index) => { const isCorrect = choice === answer; const cls = quiz.correct === true && isCorrect ? 'correct' : quiz.correct === false && isCorrect ? 'correct' : quiz.selected === choice && quiz.correct === false ? 'wrong' : ''; return `<button class="quiz-option ${cls}" data-action="quiz-answer" data-choice="${escapeHtml(choice)}" ${quiz.correct === true || quiz.correct === false ? 'disabled' : ''}><span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${escapeHtml(choice)}</span>${cls === 'correct' ? '<span style="margin-left:auto">✓</span>' : ''}</button>`; }).join('')}</div><div class="quiz-feedback ${quiz.correct === true ? 'feedback-good' : quiz.correct === false ? 'feedback-bad' : ''}">${quiz.correct === true ? '对了！🎉 进入拼写挑战…' : quiz.correct === false ? '再想想 💡 看看绿色答案，然后继续。' : '选出你认为正确的中文释义'}</div>${quiz.correct === false ? '<button class="btn btn-primary btn-block" style="margin-top:12px" data-action="quiz-continue">继续拼写 →</button>' : ''}</article>`; }
    function renderStageC(word) { const spell = State.spell || (State.spell = { mode: State.currentTask.mode || 'keyboard', value: '', tiles: shuffle(word.word.toLowerCase().split('').map((letter, index) => ({ letter, key: `${index}-${Math.random()}`, used: false }))), error: false, success: false, compare: '' }); if (spell.success) return `<article class="card spell-card spell-success"><div class="success-icon">🌟</div><h2>拼写正确！</h2><p class="muted">${escapeHtml(word.word)} 已经记住啦</p><button class="btn btn-success btn-block" style="margin-top:28px" data-action="next-word">继续下一个 →</button></article>`; return `<article class="card spell-card"><div class="eyebrow">最后一关</div><h2 style="margin-top:8px;text-align:center">请拼写这个单词</h2><div class="spell-prompt"><div class="meaning-large">${escapeHtml(word.meaning)}</div>${word.exampleEn ? `<div class="spell-example">${highlightBlank(word.exampleEn, word.word)}</div>` : ''}<div class="phonetic" style="margin-top:12px">${escapeHtml(word.phonetic || '')}</div></div><div class="mode-toggle"><button class="mode-btn ${spell.mode === 'keyboard' ? 'active' : ''}" data-action="spell-mode" data-mode="keyboard">⌨️ 键盘输入</button><button class="mode-btn ${spell.mode === 'drag' ? 'active' : ''}" data-action="spell-mode" data-mode="drag">🔤 拖拽字母</button></div>${spell.mode === 'keyboard' ? `<input class="input spell-input ${spell.error ? 'error' : ''}" data-input="spell-value" value="${escapeHtml(spell.value)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词" aria-label="拼写答案">` : `<div class="drag-slots">${word.word.split('').map((_, i) => `<span class="slot ${spell.value[i] ? 'filled' : ''}">${escapeHtml(spell.value[i] || '')}</span>`).join('')}</div><div class="letter-bank">${spell.tiles.map(tile => `<button class="letter-tile ${tile.used ? 'used' : ''}" data-action="pick-letter" data-key="${escapeHtml(tile.key)}" ${tile.used ? 'disabled' : ''}>${escapeHtml(tile.letter)}</button>`).join('')}</div>`}<div class="spell-actions"><button class="btn btn-secondary" data-action="spell-hint" ${State.currentTask.hintCount >= 3 ? 'disabled' : ''}>💡 提示 ${State.currentTask.hintCount ? `(${State.currentTask.hintCount}/3)` : ''}</button><button class="btn btn-primary" data-action="check-spell">检查答案</button></div>${spell.error ? `<div class="compare">${compareSpelling(spell.value, word.word)}</div><div class="feedback-bad" style="text-align:center;margin-top:11px;font-weight:800">再试一次 💪 ${State.currentTask.spellAttempts >= 3 ? '这个单词有点难，我们明天再练。' : ''}</div>` : '<div class="muted tiny" style="text-align:center;margin-top:14px">拼写正确才能过关，可以无限次尝试</div>'}</article>`; }

    function readKeyboardSpellValue() { const input = $('[data-input="spell-value"]'); if (input && State.spell) State.spell.value = input.value; return State.spell?.value || ''; }
    async function markSelfKnown(known) { const word = currentWord(); const patch = known ? { lastReview: Date.now() } : { status: 'struggling', errorCount: (word.errorCount || 0) + 1, lastReview: Date.now(), nextReview: tomorrowStart() }; if (!known) await Scheduler.updateWord(word, patch); State.currentTask.selfKnown = known; if (State.currentTask.stage === 'R') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } else { State.currentTask.stage = 'B'; State.stageAFlipped = true; State.stageB = null; renderLearning(); } }
    async function finishWord() { const word = currentWord(); const wasReview = State.currentTask.type === 'review'; let patch = { lastReview: Date.now(), reviewCount: (word.reviewCount || 0) + (wasReview ? 1 : 0), nextReview: Scheduler.calculateNextReview(word, true) }; if (!wasReview) patch = { ...patch, status: word.status === 'struggling' || State.currentTask.spellAttempts >= 3 ? 'struggling' : (State.currentTask.selfKnown ? 'learning' : 'struggling'), nextReview: tomorrowStart() }; else if (word.status === 'struggling') { patch = { ...patch, status: (word.successfulReviewStreak || 0) + 1 >= 2 ? 'learning' : 'struggling', successfulReviewStreak: (word.successfulReviewStreak || 0) + 1 }; } else if (word.status === 'learning') { const correctStreak = (word.correctStreak || 0) + 1; patch = { ...patch, correctStreak, status: correctStreak >= 3 ? 'mastered' : 'learning', nextReview: correctStreak >= 3 ? Date.now() + 3 * 86400000 : tomorrowStart(), masteredInterval: 3 }; } else if (word.status === 'mastered') { patch = { ...patch, status: 'mastered' }; }

    /**
     * 解析批量词库输入：支持“单词 /音标/ 释义”、 “单词 释义”以及只有英文单词的写法。
     * 只有英文单词时先识别出来，但不会凭空生成中文释义，避免孩子学到错误内容。
     */
    function parseBatchInput(text) {
      const lines = String(text || '').split(/\r?\n/);
      const records = [];
      let current = null;
      const makeRecord = (word, phonetic = '', meaning = '') => ({ word, phonetic, meaning, exampleEn: '', exampleCn: '', emoji: '', hint: '' });
      const splitExample = (value) => {
        const input = String(value || '');
        const match = input.match(/[\u3400-\u9fff]/);
        return match ? { en: input.slice(0, match.index).trim(), cn: input.slice(match.index).trim() } : { en: input.trim(), cn: '' };
      };
      const flush = () => {
        if (!current?.word) return;
        current.meaning = current.meaning.trim();
        current.exampleEn = current.exampleEn.trim();
        current.exampleCn = current.exampleCn.trim();
        /* 只有确实有中文释义时才匹配 Emoji；不能在解析阶段先写入 📌，否则在线补全后不会更新。 */
        current.emoji = current.emoji || (current.meaning ? getEmoji(current.meaning, current.word) : '');
        records.push(current);
        current = null;
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        const formal = line.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)\s+(\/[^/]+\/)(?:\s+(.+))?$/);
        if (formal && !line.startsWith('例句:')) {
          flush();
          const rest = formal[3] || '';
          const exampleIndex = rest.indexOf('例句:');
          current = makeRecord(formal[1], formal[2], exampleIndex >= 0 ? rest.slice(0, exampleIndex) : rest);
          if (exampleIndex >= 0) {
            const parsed = splitExample(rest.slice(exampleIndex + 3));
            current.exampleEn = parsed.en;
            current.exampleCn = parsed.cn;
          }
          continue;
        }
        const wordWithChinese = line.match(/^([a-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)\s+(.+[\u3400-\u9fff].*)$/);
        if (wordWithChinese && !line.startsWith('例句:')) {
          flush();
          const rest = wordWithChinese[2];
          const exampleIndex = rest.indexOf('例句:');
          current = makeRecord(wordWithChinese[1], '', exampleIndex >= 0 ? rest.slice(0, exampleIndex) : rest);
          if (exampleIndex >= 0) {
            const parsed = splitExample(rest.slice(exampleIndex + 3));
            current.exampleEn = parsed.en;
            current.exampleCn = parsed.cn;
          }
          continue;
        }
        if (current && (current.exampleEn || current.exampleCn)) {
          const parsed = splitExample(`${current.exampleEn} ${line}`);
          current.exampleEn = parsed.en;
          current.exampleCn = current.exampleCn || parsed.cn;
          continue;
        }
        const wordOnly = line.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)$/);
        if (wordOnly) {
          flush();
          current = makeRecord(wordOnly[1]);
          continue;
        }
        if (!current) continue;
        if (line.startsWith('例句:')) {
          const parsed = splitExample(line.slice(3));
          current.exampleEn = parsed.en;
          current.exampleCn = parsed.cn;
        } else if (current.exampleEn || current.exampleCn) {
          const parsed = splitExample(`${current.exampleEn} ${line}`);
          current.exampleEn = parsed.en;
          current.exampleCn = current.exampleCn || parsed.cn;
        } else {
          current.meaning += ` ${line}`;
        }
      }
      flush();
      return records;
    }

    async function saveBatchInput() {

    /* ==================== 每周五检测 ==================== */
    const DAY_MS = 86400000;
    function isFriday() { return new Date(`${State.today}T12:00:00`).getDay() === 5; }
    /** 取最近已经学习过的 30 个词；周五优先使用上一自然周，不足时再用更早记录补齐。 */
    function getWeeklyTestWords() {
      const today = dateStart(State.today);
      const currentDay = (new Date(`${State.today}T12:00:00`).getDay() + 6) % 7;
      const currentWeekStart = today - currentDay * DAY_MS;
      const previousWeekStart = currentWeekStart - 7 * DAY_MS;
      const previousWeekIds = State.logs.filter(log => { const stamp = dateStart(log.date); return stamp >= previousWeekStart && stamp < currentWeekStart; }).flatMap(log => [...(log.wordsStudied || []), ...(log.wordsReviewed || [])]);
      const olderIds = State.logs.filter(log => dateStart(log.date) < today).sort((a, b) => dateStart(b.date) - dateStart(a.date)).flatMap(log => [...(log.wordsStudied || []), ...(log.wordsReviewed || [])]);
      const ids = unique([...previousWeekIds, ...olderIds]).slice(0, 30);
      return ids.map(id => State.words.find(word => word.id === id)).filter(Boolean);
    }
    function renderWeeklyTestCard(words) {

      if (!words.length) return `<section class="card card-pad"><div class="eyebrow">周五检测</div><h3 style="margin-top:7px">还没有可检测的词</h3><p class="muted small" style="margin-top:6px">先学习一些单词，下周五就可以参加检测啦。</p></section>`;
      return `<section class="card card-pad weekly-test-card"><div class="row between"><div><div class="eyebrow" style="color:var(--warning)">周五检测</div><h3 style="margin-top:7px">检测前面学过的 ${words.length} 个词</h3><p class="muted small" style="margin-top:6px">每个词都要答出中文意思，并完成拼写。</p></div><div style="font-size:38px">📝</div></div><button class="btn btn-warning btn-block" style="margin-top:16px" data-action="start-weekly-test">开始周测 →</button></section>`;
    }
    function weeklyCurrentWord() { return State.words.find(word => word.id === State.weeklyTest?.ids[State.weeklyTest?.index]); }
    function startWeeklyTest() {
      const words = getWeeklyTestWords();
      if (!words.length) { showToast('还没有足够的学习记录'); return; }
      State.weeklyTest = { ids: words.map(word => word.id), index: 0, stage: 'meaning', choices: null, selected: null, correct: null, meaningScore: 0, spellingScore: 0, spellingAttempts: 0, spellValue: '', spellError: false, spellCorrect: false };
      Router.navigate('/test');
    }
    function renderWeeklyTest() {
      const test = State.weeklyTest;
      const word = weeklyCurrentWord();
      if (!test || !word) return `<section class="screen"><div class="card card-pad" style="margin-top:25vh;text-align:center"><div style="font-size:54px">📝</div><h2 style="margin-top:13px">周五单词检测</h2><p class="muted" style="margin-top:9px">请从首页进入本周检测。</p><button class="btn btn-primary btn-block" style="margin-top:18px" data-action="navigate" data-path="/learn">返回首页</button></div></section>`;
      const progress = `${test.index + 1} / ${test.ids.length}`;
      if (test.stage === 'meaning') {
        if (!test.choices) test.choices = makeQuiz(word);

    }

    /* ==================== 在线补全与拍照识别 ==================== */
    const DICTIONARY_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
    const TRANSLATION_API = 'https://api.mymemory.translated.net/get';
    const OCR_API = 'https://api.ocr.space/parse/image';
    const WIKIMEDIA_IMAGE_API = 'https://commons.wikimedia.org/w/api.php';
    const ONLINE_CACHE_KEY = 'PETOnlineLookupCacheV2';
    const CAMBRIDGE_REFERENCE = 'https://dictionary.cambridge.org/dictionary/english/';
    const PET_WORDLIST_URL = 'https://www.cambridgeenglish.org/Images/506887-b1-preliminary-vocabulary-list.pdf';
    // OCR.Space 的公开测试额度只适合个人试用；正式长期使用建议换成自己的服务端代理。
    const OCR_TEST_KEY = 'helloworld';

    function readOnlineCache() { try { return JSON.parse(localStorage.getItem(ONLINE_CACHE_KEY) || '{"translations":{},"dictionary":{}}'); } catch (_) { return { translations: {}, dictionary: {} }; } }
    function writeOnlineCache(cache) { try { localStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify(cache)); } catch (_) {} }
    const ONLINE_CACHE = readOnlineCache();

    /** 给所有在线请求设置上限，避免 iPad 网络不响应时录入一直卡在“补全中”。 */
    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      if (typeof AbortController === 'undefined') return fetch(url, options);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try { return await fetch(url, { ...options, signal: controller.signal }); }
      finally { clearTimeout(timer); }
    }

    /** 调用在线翻译服务并缓存结果，重复录入相同词语时不再重新请求。 */
    async function translateOnline(text) {
      const value = String(text || '').trim();
      if (!value || navigator.onLine === false) return '';
      const cache = ONLINE_CACHE;
      const cacheKey = `en-zh:${value.toLowerCase()}`;
      if (cache.translations?.[cacheKey]) return cache.translations[cacheKey];
      try {
        const response = await fetchWithTimeout(`${TRANSLATION_API}?q=${encodeURIComponent(value)}&langpair=en|zh-CN`, {}, 2200);
        if (!response.ok) return '';
        const payload = await response.json();
        const translated = String(payload?.responseData?.translatedText || '').trim();
        if (translated) { cache.translations = cache.translations || {}; cache.translations[cacheKey] = translated; writeOnlineCache(cache); }
        return translated;
      } catch (_) { return ''; }
    }

    /** 没有可信来源时保持为空，绝不再生成模板例句。 */
    function fallbackExampleEn() { return ''; }
    function fallbackExampleCn() { return ''; }

    /** 从词典读取英文语境资料；中文释义优先翻译词典定义，减少孤立机器翻译造成的歧义。 */
    async function lookupWordOnline(item) {
      const term = String(item.word || '').trim();
      if (!term) return item;
      const phrase = referenceDataFor(term);
      /* PET 常见词组和已核对的测试词先使用本地资料，避免把词组送进单词 API 后得到整句英文。 */
      if (phrase) {
        if (!item.phonetic && phrase.phonetic) item.phonetic = phrase.phonetic;
        if (!item.meaning && phrase.meaning) item.meaning = phrase.meaning;
        if (!item.exampleEn && phrase.en) item.exampleEn = phrase.en;
        if (!item.exampleCn && phrase.cn) item.exampleCn = phrase.cn;
        item.emoji = item.emoji || getEmoji(item.meaning, term);
        item.referenceUrl = `${CAMBRIDGE_REFERENCE}${encodeURIComponent(term.toLowerCase().replace(/\s+/g, '-'))}`;
        return item;
      }
      let entry = null;
      const isSingleWord = /^[A-Za-z]+(?:['-][A-Za-z]+)?$/.test(term);
      if (isSingleWord && navigator.onLine !== false) {
        try {
          const cache = ONLINE_CACHE;
          const cacheKey = term.toLowerCase();
          if (cache.dictionary?.[cacheKey]) entry = cache.dictionary[cacheKey];
          else {
            const response = await fetchWithTimeout(`${DICTIONARY_API}${encodeURIComponent(term)}`, {}, 3200);
            if (response.ok) {
              const payload = await response.json();
              entry = Array.isArray(payload) ? payload[0] : null;
              if (entry) { cache.dictionary = cache.dictionary || {}; cache.dictionary[cacheKey] = entry; writeOnlineCache(cache); }
            }
          }
        } catch (_) {}
      }
      const phonetic = entry?.phonetic || entry?.phonetics?.find(item => item.text)?.text || '';
      const definitions = entry?.meanings?.flatMap(meaning => meaning.definitions || []) || [];
      const definition = definitions.find(item => item.definition)?.definition || '';
      const example = definitions.find(item => item.example)?.example || '';
      if (!item.phonetic && phonetic) item.phonetic = phonetic;
      if (!item.exampleEn && example) item.exampleEn = example;
      if (!item.meaning) item.meaning = definition ? await translateOnline(definition) : await translateOnline(term);
      if (!item.exampleCn && item.exampleEn) item.exampleCn = await translateOnline(item.exampleEn);
      item.emoji = item.emoji || getEmoji(item.meaning, term);
      item.referenceUrl = `${CAMBRIDGE_REFERENCE}${encodeURIComponent(term.toLowerCase().replace(/\s+/g, '-'))}`;
      return item;
    }

    /** 以固定并发数批量查询，避免 17 个词逐个排队等待。 */
    async function mapOnlineWithConcurrency(items, worker, limit = 6) {
      let cursor = 0;
      const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (cursor < items.length) {
          const index = cursor++;
          await worker(items[index], index);
        }
      });
      await Promise.all(workers);
    }

    /** 批量为识别出的单词或词组自动补全资料；缓存加并发后通常可在十秒左右完成一批。 */
    async function lookupBatchOnline() {
      if (!State.batchPreview.length || State.batchLookupRunning) return;
      State.batchLookupRunning = true;
      render();
      const status = $('[data-online-status]');
      if (status) status.textContent = '正在联网补全中文释义、音标和例句，请稍候…';
      let filled = 0;
      try {
        let completed = 0;
        await mapOnlineWithConcurrency(State.batchPreview, async (item) => {
          const before = `${item.meaning}|${item.phonetic}|${item.exampleEn}|${item.exampleCn}`;
          await lookupWordOnline(item);
          if (before !== `${item.meaning}|${item.phonetic}|${item.exampleEn}|${item.exampleCn}`) filled++;
          completed++;
          const progress = $('[data-online-status]');
          if (progress) progress.textContent = `正在补全 ${completed}/${State.batchPreview.length}，完成后可直接确认录入…`;
        }, 6);
        render();
        showToast(filled ? `在线补全完成：更新了 ${filled} 个词` : '暂时没有找到更多资料，请检查网络或手动补充');
      } catch (_) {
        showToast('在线补全失败，请检查网络后重试');
      } finally {
        State.batchLookupRunning = false;
        render();
        const nextStatus = $('[data-online-status]');
        if (nextStatus) nextStatus.textContent = '在线资料仅作辅助，请录入前快速确认释义。';
      }
    }

    /** 为逐条录入表单自动填充资料。 */
    async function lookupFormOnline(form) {
      const wordInput = form?.querySelector('[name="word"]');
      if (!wordInput?.value.trim()) { showToast('请先输入英文单词或词组'); return; }
      const button = form.querySelector('[data-action="lookup-form"]');
      if (button) { button.disabled = true; button.textContent = '正在查找…'; }
      const item = { word: wordInput.value.trim(), phonetic: form.querySelector('[name="phonetic"]')?.value.trim() || '', meaning: form.querySelector('[name="meaning"]')?.value.trim() || '', exampleEn: form.querySelector('[name="exampleEn"]')?.value.trim() || '', exampleCn: form.querySelector('[name="exampleCn"]')?.value.trim() || '', emoji: form.querySelector('[name="emoji"]')?.value.trim() || '', hint: form.querySelector('[name="hint"]')?.value.trim() || '' };
      await lookupWordOnline(item);
      ensureBilingualExample(item);
      /* 再从本地核对资料补一次，确保表单不会漏掉词组音标。 */
      const reference = referenceDataFor(item.word);
      if (reference) {
        item.phonetic = item.phonetic || reference.phonetic || '';
        item.meaning = item.meaning || reference.meaning || '';
        item.exampleEn = item.exampleEn || reference.en || '';
        item.exampleCn = item.exampleCn || reference.cn || '';
        item.emoji = item.emoji || reference.emoji || getEmoji(item.meaning, item.word);
      }
      const fill = () => {
        const activeForm = document.querySelector('#wordForm') || form;
        for (const name of ['phonetic', 'meaning', 'exampleEn', 'exampleCn', 'emoji']) {
          const input = activeForm?.querySelector(`[name="${name}"]`);
          if (input && item[name]) { input.value = item[name]; input.setAttribute('value', item[name]); }
        }
      };
      fill();
      /* iPad Safari 在异步按钮回调后偶尔会恢复输入框旧值，再补一次当前资料。 */
      setTimeout(fill, 0);
      if (button) { button.disabled = false; button.textContent = '🌐 在线补全'; }
      showToast(item.meaning ? '在线资料已填入，请确认后保存' : '没有找到中文释义，请检查拼写');
    }

    /** 将照片上传到 OCR 服务并把识别结果放入批量输入框。上传前必须由使用者确认。 */
    async function recognizeVocabularyPhoto(file) {
      if (!file || !file.type.startsWith('image/')) { showToast('请选择一张图片'); return; }
      if (!confirm('这张照片会上传到在线 OCR 服务，仅用于识别图片中的英文。是否继续？')) return;
      State.ocrStatus = '正在识别照片，请保持网络连接…';
      render();
      try {
        const form = new FormData();
        form.append('file', file, file.name || 'vocabulary.jpg');
        form.append('language', 'eng');
        form.append('OCREngine', '2');
        form.append('isOverlayRequired', 'false');
        const response = await fetchWithTimeout(OCR_API, { method: 'POST', headers: { apikey: OCR_TEST_KEY }, body: form }, 12000);
        if (!response.ok) throw new Error(`OCR ${response.status}`);
        const payload = await response.json();
        const text = (payload?.ParsedResults || []).map(result => result.ParsedText || '').join('\n').replace(/\r/g, '').split('\n').map(line => line.replace(/^\s*(?:\d+[.)、]|[-•])\s*/, '').trim()).filter(Boolean).join('\n');
        if (!text) throw new Error(payload?.ErrorMessage || '没有识别到文字');
        State.batchText = [State.batchText.trim(), text].filter(Boolean).join('\n');
        State.ocrStatus = `已识别 ${text.split(/\s+/).filter(Boolean).length} 个文字片段，请点击“解析并预览”，再自动补全中文资料。`;
        render();
        showToast('照片识别完成');
      } catch (error) {
        State.ocrStatus = '照片识别失败。请换一张清晰、光线均匀的英文词表照片，或使用 iPad 的“实况文本”复制。';
        render();
        showToast('在线 OCR 暂时不可用');
      }
    }

    /** 统一的儿童界面工具页：录入、看板、管理、备份不再有家长密码门槛。 */
    /** 在录入页提供 Cambridge 官方 PET/B1 词表入口，作为备考范围核对来源。 */
    function renderPetReferenceCard() {
      return '<section class="card card-pad pet-reference"><div class="eyebrow">📖 正规参考</div><h3 style="margin-top:7px">Cambridge B1 Preliminary（PET）官方词表</h3><p class="muted small" style="line-height:1.65;margin-top:8px">官方词表用于确认 PET 备考范围；每个词的中文释义和双语例句仍需以词典资料核对，不再自动生成模板句。</p><a class="btn btn-secondary btn-block" style="margin-top:14px" href="' + PET_WORDLIST_URL + '" target="_blank" rel="noopener">打开 / 下载官方词表 ↗</a></section>';
    }

      return `<section class="screen admin-screen"><header class="topbar"><div class="brand-lockup"><div class="brand-mark">🧰</div><div><div class="brand-title">学习工具</div><div class="brand-subtitle">词库、看板和备份 · ${State.words.length} 个词</div></div></div><button class="icon-btn" data-action="navigate" data-path="/learn" aria-label="返回学习">←</button></header><nav class="admin-nav"><button class="admin-tab ${State.adminTab === 'overview' ? 'active' : ''}" data-action="admin-tab" data-tab="overview">📊 数据看板</button><button class="admin-tab ${State.adminTab === 'add' ? 'active' : ''}" data-action="admin-tab" data-tab="add">➕ 录入词库</button><button class="admin-tab ${State.adminTab === 'manage' ? 'active' : ''}" data-action="admin-tab" data-tab="manage">📚 管理词库</button><button class="admin-tab ${State.adminTab === 'backup' ? 'active' : ''}" data-action="admin-tab" data-tab="backup">💾 备份恢复</button></nav>${body}${State.importPayload ? renderImportModal() : ''}${navBar()}</section>`;

    /** 录入页同时支持拍照、批量粘贴和逐条在线补全。 */
    function renderAdminAdd() {

    /** 在线补全后仍检查释义，避免把未翻译成功的词直接加入词库。 */
    async function saveBatchInput() {
      const incomplete = State.batchPreview.filter(item => !item.meaning.trim());
      if (incomplete.length) { showToast(`${incomplete.length} 个词暂时没有中文释义，请先点击在线补全或手动补充`); return; }
      State.batchText = '';
      await saveBatch();
