    .mini-btn.red { color: #c52c26; background: #fff0ef; }
    .preview-list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .preview-item { padding: 11px; border: 1px solid var(--border); border-radius: 13px; background: #fafbfc; }
    .preview-item strong { font-size: 15px; }
    .canvas-wrap { position: relative; height: 220px; }
    .canvas-wrap canvas { width: 100%; height: 100%; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(100%, 390px); padding: 25px; }
    .login-lock { width: 68px; height: 68px; margin: 0 auto 15px; display: grid; place-items: center; border-radius: 22px; background: #e9f3ff; font-size: 35px; }
    .modal { width: min(100%, 430px); max-height: 90vh; overflow: auto; padding: 22px; background: #fff; border-radius: 22px; box-shadow: 0 28px 80px rgba(13,26,56,.22); }
    .modal h2 { margin-bottom: 9px; }
    .import-options { display: grid; gap: 10px; margin-top: 18px; }
    .notice { padding: 13px 14px; color: #5c4a20; background: #fff8e5; border-radius: 13px; font-size: 13px; line-height: 1.6; }
    .privacy-note { color: var(--text-secondary); text-align: center; font-size: 12px; line-height: 1.6; margin-top: 18px; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes pop { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>

<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <canvas id="confetti" class="confetti-canvas" hidden></canvas>
  <div id="toast" class="toast" role="status"></div>

  <script>
    'use strict';

    /* ==================== 数据与工具 ==================== */
    const SAMPLE_WORDS = [
      { word: 'accommodation', phonetic: '/əˌkɒməˈdeɪʃn/', meaning: '住处，住宿', exampleEn: 'The hotel provides accommodation for up to 500 guests.', exampleCn: '这家酒店可为多达500位客人提供住宿。', emoji: '🏨', hint: 'ac-（朝向）+ commod（方便）+ -ation（名词后缀）→ 提供方便之处 → 住处' },
      { word: 'advertisement', phonetic: '/ədˈvɜːtɪsmənt/', meaning: '广告', exampleEn: 'I saw an advertisement for a new smartphone on TV.', exampleCn: '我在电视上看到一则新智能手机的广告。', emoji: '📺', hint: 'ad-（向）+ vert（转）+ -ise（使）+ -ment（名词）→ 使目光转向 → 广告' },
      { word: 'celebrate', phonetic: '/ˈselɪbreɪt/', meaning: '庆祝', exampleEn: 'We celebrate Christmas every year.', exampleCn: '我们每年都庆祝圣诞节。', emoji: '🎉', hint: 'celebr（著名的）+ -ate（使）→ 使著名 → 庆祝' }
    ];
    const DEFAULT_SETTINGS = { key: 'config', adminPassword: 'pet2024', dailyNew: 5, dailyReview: 5, soundEnabled: true, speechRate: 'normal' };
    const EMOJI_MAP = {
      '住':'🏨','房':'🏠','家':'🏡','店':'🏪','宿':'🛏️','吃':'🍽️','食':'🍎','喝':'🥤','餐':'🍽️','饿':'😋','学':'📚','校':'🏫','书':'📖','读':'📖','教':'👨‍🏫','车':'🚗','路':'🛣️','走':'🚶','跑':'🏃','飞':'✈️','说':'💬','话':'🗣️','聊':'💭','讲':'🎤','喊':'📢','钱':'💰','买':'🛒','卖':'🏷️','付':'💳','贵':'💎','乐':'🎉','庆':'🎊','喜':'😊','笑':'😄','哭':'😢','工':'💼','作':'📝','业':'📋','职':'💼','忙':'⏰','医':'🏥','病':'🤒','药':'💊','痛':'😣','健':'💪','旅':'✈️','游':'🏖️','行':'🧳','景':'🏞️','玩':'🎮','爱':'❤️','情':'💕','友':'👫','亲':'👨‍👩‍👧','冷':'❄️','热':'☀️','雨':'🌧️','雪':'❄️','风':'💨','大':'⬆️','小':'⬇️','高':'📈','低':'📉','新':'✨','老':'👴','好':'👍','坏':'👎','美':'💄','丑':'🤡','快':'⚡','慢':'🐢','早':'🌅','晚':'🌙','default':'📌'
    };
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const pad = (n) => String(n).padStart(2, '0');
    const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
    const dateStart = (key = todayKey()) => new Date(`${key}T00:00:00`).getTime();
    const tomorrowStart = () => dateStart() + 86400000;
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const getEmoji = (meaning = '') => { for (const char of meaning.slice(0, 3)) if (EMOJI_MAP[char]) return EMOJI_MAP[char]; return EMOJI_MAP.default; };
    const statusLabel = { new: '未学习', learning: '学习中', mastered: '已掌握', struggling: '需要再练' };
    const statusClass = { new: '', learning: 'blue', mastered: 'green', struggling: 'orange' };
    const normalizeWord = (value = '') => value.trim().toLowerCase().replace(/[^a-z']/g, '');
    const unique = (list) => [...new Set(list)];

    /** 轻量本地数据层：优先 IndexedDB，遇到 Safari 隐私模式或数据库异常时自动降级。 */
    class PETDatabase {
      constructor() { this.db = null; this.fallback = false; this.DB_NAME = 'PETWordDB'; this.DB_VERSION = 1; this.fallbackKey = 'PETWordDB_FALLBACK'; }
      async init() {
        if (!('indexedDB' in window)) { this.fallback = true; return this.loadFallback(); }
        try {
          await new Promise((resolve, reject) => {
            const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
            request.onupgradeneeded = () => {
              const db = request.result;
              if (!db.objectStoreNames.contains('words')) { const store = db.createObjectStore('words', { keyPath: 'id', autoIncrement: true }); store.createIndex('word', 'word', { unique: false }); store.createIndex('nextReview', 'nextReview', { unique: false }); }
              if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
              if (!db.objectStoreNames.contains('dailyLog')) { const log = db.createObjectStore('dailyLog', { keyPath: 'id', autoIncrement: true }); log.createIndex('date', 'date', { unique: false }); }
            };
            request.onsuccess = () => { this.db = request.result; resolve(); };
            request.onerror = () => reject(request.error || new Error('IndexedDB unavailable'));
          });
        } catch (error) { this.fallback = true; this.loadFallback(); }
      }
      loadFallback() { try { this.fallbackData = JSON.parse(localStorage.getItem(this.fallbackKey) || '{"words":[],"settings":[],"dailyLog":[]}'); } catch { this.fallbackData = { words: [], settings: [], dailyLog: [] }; } }
      saveFallback() { localStorage.setItem(this.fallbackKey, JSON.stringify(this.fallbackData)); }
      async all(storeName) { if (this.fallback) return [...(this.fallbackData[storeName] || [])]; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); }); }
      async get(storeName, key) { if (this.fallback) return (this.fallbackData[storeName] || []).find(item => item.id === key || item.key === key) || null; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); }); }
      async put(storeName, value) {
        if (this.fallback) {
          const list = this.fallbackData[storeName] || (this.fallbackData[storeName] = []);
          if (storeName === 'words' || storeName === 'dailyLog') {
            if (!value.id) value.id = list.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
          }
          const index = list.findIndex(item => (storeName === 'settings' ? item.key === value.key : item.id === value.id));
          if (index >= 0) list[index] = value; else list.push(value);
          this.saveFallback(); return value;
        }
        /* IndexedDB 的 keyPath 不接受 id: undefined，因此新增记录时移除该属性。 */
        const record = { ...value };
        if (storeName !== 'settings' && record.id === undefined) delete record.id;
        return new Promise((resolve, reject) => {
          const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).put(record);
          req.onsuccess = () => { if (!record.id && storeName !== 'settings') record.id = req.result; Object.assign(value, record); resolve(value); };
          req.onerror = () => reject(req.error);
        });
      }
      async add(storeName, value) { return this.put(storeName, value); }
      async delete(storeName, key) { if (this.fallback) { this.fallbackData[storeName] = (this.fallbackData[storeName] || []).filter(item => item.id !== key && item.key !== key); this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).delete(key); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async clear(storeName) { if (this.fallback) { this.fallbackData[storeName] = []; this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).clear(); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async bulkPut(storeName, values) { for (const value of values) await this.put(storeName, value); }
    }

    const DB = new PETDatabase();
    const State = {
      route: '/learn', currentUser: 'child', today: todayKey(), settings: { ...DEFAULT_SETTINGS }, words: [], logs: [],
      currentTask: null, guidePage: 0, showGuide: false, stageAReadyAt: 0, stageAFlipped: false, stageB: null, spell: null,
      adminTab: 'overview', adminLoggedIn: false, adminSearch: '', adminPage: 1, editingWordId: null, batchPreview: [], importPayload: null,
      wordSearch: '', toastTimer: null
    };

    /** 读取本地数据，并在首次启动时写入示例词。 */
    async function hydrate() {
      State.words = await DB.all('words');
      if (!State.words.length) {
        const now = Date.now();
        await DB.bulkPut('words', SAMPLE_WORDS.map((word, index) => ({ ...word, status: 'new', reviewCount: 0, lastReview: 0, nextReview: 0, errorCount: 0, createdAt: now + index })));
        State.words = await DB.all('words');
        localStorage.setItem('petWelcomeSeen', 'false');
      }
      const savedSettings = await DB.get('settings', 'config');
      State.settings = { ...DEFAULT_SETTINGS, ...(savedSettings || {}) };
      if (!savedSettings) await DB.put('settings', State.settings);
      State.logs = await DB.all('dailyLog');
      State.showGuide = localStorage.getItem('petWelcomeSeen') !== 'true';
    }

    /** 将日期对应的学习计划固定下来，避免完成一词后任务顺序漂移。 */
    async function ensureDailyLog() {
      let log = State.logs.find(item => item.date === State.today);
      if (log && Array.isArray(log.plannedNew) && Array.isArray(log.plannedReview)) return log;
      const completedNew = log?.wordsStudied || [];
      const completedReview = log?.wordsReviewed || [];
      const tomorrow = dateStart(State.today) + 86400000;
      const newPool = State.words.filter(word => word.status === 'new' && !completedNew.includes(word.id)).sort((a,b) => a.createdAt - b.createdAt);
      const due = State.words.filter(word => word.status !== 'new' && (word.nextReview || 0) <= dateStart(State.today) && !completedReview.includes(word.id))
        .sort((a,b) => (a.status === 'struggling' ? -1 : 1) - (b.status === 'struggling' ? -1 : 1) || (b.errorCount || 0) - (a.errorCount || 0) || (a.nextReview || 0) - (b.nextReview || 0));
      const masteredFallback = State.words.filter(word => word.status === 'mastered' && !due.some(item => item.id === word.id) && !completedReview.includes(word.id)).sort((a,b) => (a.lastReview || 0) - (b.lastReview || 0));
      const plannedNew = log?.plannedNew || newPool.slice(0, State.settings.dailyNew).map(word => word.id);
      const plannedReview = log?.plannedReview || [...due, ...masteredFallback].slice(0, State.settings.dailyReview).map(word => word.id);
      const nextLog = { date: State.today, wordsStudied: completedNew, wordsReviewed: completedReview, durationMinutes: log?.durationMinutes || 0, completed: log?.completed || false, plannedNew, plannedReview };
      if (log?.id !== undefined) nextLog.id = log.id;
      await DB.put('dailyLog', nextLog); State.logs = await DB.all('dailyLog'); return nextLog;
    }

    async function getTodayTasks() {
      const log = await ensureDailyLog();
      return { log, newWords: log.plannedNew.map(id => State.words.find(word => word.id === id)).filter(Boolean), reviewWords: log.plannedReview.map(id => State.words.find(word => word.id === id)).filter(Boolean) };
    }
    function currentLog() { return State.logs.find(item => item.date === State.today); }
    function wordVisual(word, className = '') { return word.imageUrl ? `<div class="${className || 'word-emoji'}"><img src="${escapeHtml(word.imageUrl)}" alt="${escapeHtml(word.word)}"></div>` : `<div class="${className || 'word-emoji'}">${escapeHtml(word.emoji || getEmoji(word.meaning))}</div>`; }
    function statusBadge(word) { return `<span class="badge ${statusClass[word.status] || ''}">${escapeHtml(statusLabel[word.status] || word.status || '未学习')}</span>`; }
    function showToast(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(State.toastTimer); State.toastTimer = setTimeout(() => toast.classList.remove('show'), 2500); }
    function setGuideSeen() { localStorage.setItem('petWelcomeSeen', 'true'); State.showGuide = false; render(); }
    function renderGuide() { const slide = [{ emoji:'🌱', title:'每天学一点点', text:'每天 5 个新词，配上适量复习，轻松积累 PET 词汇。' }, { emoji:'🧩', title:'三步记得更牢', text:'先认识，再选择，最后拼写。每个单词都要闯过三关才能真正记住。' }, { emoji:'🚀', title:'现在就出发吧', text:'语音、提示和拖拽字母都为小朋友准备好了，学习记录只保存在本机。' }][State.guidePage]; const dots = [0,1,2].map(index => `<span class="dot ${index === State.guidePage ? 'active' : ''}"></span>`).join(''); $('#app').insertAdjacentHTML('beforeend', `<div class="guide-backdrop"><article class="guide"><div class="guide-visual">${slide.emoji}</div><div class="guide-copy"><h2>${slide.title}</h2><p>${slide.text}</p><div class="dots">${dots}</div><div class="row between"><button class="btn btn-ghost" data-action="skip-guide">${State.guidePage < 2 ? '跳过' : '稍后再看'}</button><button class="btn btn-primary" data-action="next-guide">${State.guidePage < 2 ? '下一页 →' : '开始学习 🚀'}</button></div></div></article></div>`); }

    /* ==================== 语音与复习 ==================== */
    const Speaker = {
      speak(text, lang = 'en-US', rate = .8) { if (!State.settings.soundEnabled || !('speechSynthesis' in window) || !text) return; try { speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = lang; utterance.rate = rate; speechSynthesis.speak(utterance); } catch (_) {} },
      speakWord(word) { const rate = { slow: .6, normal: .8, fast: 1 }[State.settings.speechRate] || .8; if (!State.settings.soundEnabled || !('speechSynthesis' in window)) return; this.speak(word.word, 'en-US', rate); setTimeout(() => this.speak(word.exampleEn, 'en-US', rate), 550); setTimeout(() => this.speak(word.meaning, 'zh-CN', rate), 1250); },
      speakCorrect(word) { const rate = { slow: .6, normal: .8, fast: 1 }[State.settings.speechRate] || .8; this.speak(word.word, 'en-US', rate); }
    };
    const Scheduler = {
      /** 根据状态计算下次复习时间；错误只影响优先级，不设置惩罚性文案。 */
      calculateNextReview(word, isCorrect) {
        if (!isCorrect || word.status === 'struggling') return tomorrowStart();
        if (word.status === 'mastered') { const interval = Math.min(14, word.masteredInterval ? word.masteredInterval * 2 : 3); word.masteredInterval = interval; return Date.now() + interval * 86400000; }
        return tomorrowStart();
      },
      async updateWord(word, patch) { const next = { ...word, ...patch }; await DB.put('words', next); const index = State.words.findIndex(item => item.id === next.id); if (index >= 0) State.words[index] = next; return next; }
    };

    /* ==================== 路由与页面 ==================== */
    const Router = {
      navigate(path) { window.location.hash = path; },
      resolve() { const freshToday = todayKey(); if (State.today !== freshToday) { State.today = freshToday; ensureDailyLog().then(() => render()); } const route = window.location.hash.replace('#', '') || '/learn'; State.route = ['/learn','/words','/profile','/admin'].includes(route) ? route : '/learn'; if (State.route === '/admin') { if (!isAdminSession()) { State.currentUser = 'admin'; renderAdminLogin(); return; } State.currentUser = 'admin'; } else State.currentUser = 'child'; render(); }
    };
    function isAdminSession() { const expiry = Number(localStorage.getItem('petAdminSession') || 0); return expiry > Date.now(); }
    function navBar() { const current = State.route; return `<nav class="nav-bar" aria-label="主导航"><button class="nav-item ${current === '/learn' ? 'active' : ''}" data-action="navigate" data-path="/learn"><span class="nav-icon">📖</span><span>学习</span></button><button class="nav-item ${current === '/words' ? 'active' : ''}" data-action="navigate" data-path="/words"><span class="nav-icon">📋</span><span>词库</span></button><button class="nav-item ${current === '/profile' ? 'active' : ''}" data-action="navigate" data-path="/profile"><span class="nav-icon">👤</span><span>我的</span></button></nav>`; }
    function pageTop(title, subtitle = '', backPath = '') { return `<header class="topbar"><div class="brand-lockup">${backPath ? `<button class="icon-btn" data-action="navigate" data-path="${backPath}" aria-label="返回">←</button>` : '<div class="brand-mark">📗</div>'}<div><div class="brand-title">${escapeHtml(title)}</div>${subtitle ? `<div class="brand-subtitle">${escapeHtml(subtitle)}</div>` : ''}</div></div>${State.currentUser === 'child' && !backPath ? `<button class="icon-btn" data-action="navigate" data-path="/admin" aria-label="家长入口">🔒</button>` : ''}</header>`; }
    function render() { const app = $('#app'); if (!app) return; if (State.route === '/learn') app.innerHTML = renderDashboard(); if (State.route === '/words') app.innerHTML = renderWords(); if (State.route === '/profile') app.innerHTML = renderProfile(); if (State.route === '/admin') app.innerHTML = renderAdmin(); if (State.showGuide && State.route !== '/admin') renderGuide(); drawChart(); }

    /** 首页仪表盘：显示固定的今日计划以及周进度。 */
    function renderDashboard() {
      const log = currentLog() || { wordsStudied: [], wordsReviewed: [] };
      const newWords = (log.plannedNew || []).map(id => State.words.find(word => word.id === id)).filter(Boolean);
      const reviewWords = (log.plannedReview || []).map(id => State.words.find(word => word.id === id)).filter(Boolean);
      const newDone = (log.wordsStudied || []).length; const reviewDone = (log.wordsReviewed || []).length;
      const dailyDone = newDone >= newWords.length && reviewDone >= reviewWords.length;
      const week = weekStats(); const percent = Math.min(100, Math.round(week.completed / 30 * 100));
      return `<section class="screen"><header class="topbar"><div class="brand-lockup"><div class="brand-mark">📗</div><div><div class="brand-title">小小词语家</div><div class="brand-subtitle">PET Vocabulary · 今日 ${escapeHtml(State.today.slice(5).replace('-', '月'))} 日</div></div></div><button class="icon-btn" data-action="navigate" data-path="/admin" aria-label="家长入口">🔒</button></header>
        <div class="stack"><section class="card hero-card"><div class="eyebrow">本周学习进度</div><div class="hero-number">${week.completed}<span> / 30 个词</span></div><div>每天一点点，词汇会长大 🌱</div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="progress-meta"><span>${week.completed ? `已经坚持 ${week.days} 天` : '今天也来学一点'}</span><span>${percent}%</span></div></section>
        <section class="stack"><div class="section-heading"><h2>今天学什么</h2><span class="badge ${dailyDone ? 'green' : 'blue'}">${dailyDone ? '全部完成' : `${newDone + reviewDone} / ${newWords.length + reviewWords.length}`}</span></div>
          <article class="card task-card new-task"><div class="row between"><div class="task-icon">📘</div>${newDone >= newWords.length ? '<span class="task-status">已完成 ✅</span>' : '<span class="task-status pending">新词任务</span>'}</div><div><div class="task-title">今日新学 · ${newWords.length} 个</div><div class="task-caption">${newWords.length ? '认识新朋友，慢慢记住它们。' : '词库里暂时没有待学习的新词。'}</div></div>${newWords.length ? `<div class="word-preview">${newWords.map(word => escapeHtml(word.word)).join(' · ')}</div>` : ''}<button class="btn ${newDone >= newWords.length ? 'btn-secondary' : 'btn-primary'} btn-block" data-action="start-task" data-type="new" ${newDone >= newWords.length ? 'disabled' : ''}>${newDone >= newWords.length ? '新词已学完' : '开始新词学习 →'}</button></article>
          <article class="card task-card review-task ${newDone < newWords.length ? 'locked' : ''}"><div class="row between"><div class="task-icon">📙</div>${reviewDone >= reviewWords.length ? '<span class="task-status">已完成 ✅</span>' : newDone < newWords.length ? '<span class="task-status lock">🔒 待解锁</span>' : '<span class="task-status pending">复习任务</span>'}</div><div><div class="task-title">今日复习 · ${reviewWords.length} 个</div><div class="task-caption">${newDone < newWords.length ? '完成今日新词后，就能开始复习啦。' : reviewWords.length ? '把学过的单词再叫醒一次。' : '今天没有到期复习词，轻松完成！'}</div></div><button class="btn ${newDone < newWords.length || reviewDone >= reviewWords.length ? 'btn-secondary' : 'btn-warning'} btn-block" data-action="start-task" data-type="review" ${newDone < newWords.length || reviewDone >= reviewWords.length ? 'disabled' : ''}>${reviewDone >= reviewWords.length ? '复习已完成' : newDone < newWords.length ? '完成新词后解锁' : '开始复习 →'}</button></article></section>
          <section class="card card-pad"><div class="row between"><div><h3>${dailyDone ? '今日完成！明天见 🌟' : '准备好了吗？'}</h3><p class="muted small" style="margin-top:6px">${dailyDone ? '你今天的努力已经被好好记录。' : '每个单词都会经过三步练习，更容易记牢。'}</p></div><div style="font-size:35px">${dailyDone ? '🎉' : '🧠'}</div></div>${dailyDone ? '<button class="btn btn-success btn-block" style="margin-top:15px" disabled>今日任务已完成</button>' : ''}</section>
        </div>${navBar()}</section>`;
    }

    function weekStats() { const now = new Date(); const day = (now.getDay() + 6) % 7; const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day); const keys = []; for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate() + i); keys.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); } const logs = State.logs.filter(log => keys.includes(log.date)); return { completed: Math.min(30, unique(logs.flatMap(log => log.wordsStudied || [])).length), days: logs.filter(log => log.completed || ((log.wordsStudied || []).length + (log.wordsReviewed || []).length > 0)).length, keys, logs }; }
    function renderWords() { const query = State.wordSearch.trim().toLowerCase(); const words = State.words.filter(word => !query || word.word.toLowerCase().includes(query) || word.meaning.includes(query)); return `<section class="screen">${pageTop('词库', `${State.words.length} 个单词`)}<div class="stack"><div class="search-box"><span>⌕</span><input class="input" style="padding-left:42px" data-input="word-search" value="${escapeHtml(State.wordSearch)}" placeholder="搜索英文或中文释义" aria-label="搜索词库"></div><div class="row between"><h2>我的单词本</h2><span class="muted small">${words.length} 个结果</span></div><div class="word-list">${words.length ? words.map(word => `<article class="word-row">${wordVisual(word)}<div style="min-width:0"><div class="row" style="gap:7px;flex-wrap:wrap"><span class="word-name">${escapeHtml(word.word)}</span>${statusBadge(word)}</div><div class="word-meaning">${escapeHtml(word.meaning)}${word.phonetic ? ` · ${escapeHtml(word.phonetic)}` : ''}</div></div><button class="icon-btn" data-action="speak" data-id="${word.id}" aria-label="朗读 ${escapeHtml(word.word)}">🔊</button></article>`).join('') : '<div class="card empty"><div class="empty-icon">🔎</div><p>没有找到相关单词</p><p class="small" style="margin-top:6px">试试搜索另一个词吧。</p></div>'}</div></div>${navBar()}</section>`; }

    function renderProfile() { const stats = profileStats(); const weekly = weekStats(); const ring = Math.min(100, Math.round(weekly.completed / 30 * 100)); return `<section class="screen">${pageTop('我的', '看看自己的成长')}
      <div class="stack"><section class="card card-pad profile-hero"><div class="avatar">🧒</div><div><h2>小小探险家</h2><p class="muted small" style="margin-top:6px">${stats.streak >= 3 ? '连续学习真厉害！' : '今天也要加油呀！'}</p></div><div class="progress-ring" style="--ring:${ring}%"><span>${ring}%</span></div></section>
      <section class="streak-row"><div class="stat"><div class="stat-number">${stats.mastered}</div><div class="stat-label">掌握单词</div></div><div class="stat"><div class="stat-number">${stats.streak}🔥</div><div class="stat-label">连续打卡</div></div><div class="stat"><div class="stat-number">${stats.minutes}</div><div class="stat-label">学习分钟</div></div></section>
      ${stats.streak >= 3 ? '<section class="card card-pad" style="background:linear-gradient(135deg,#fff8df,#fff)"><div class="row"><div style="font-size:42px">🏅</div><div><h3>三日坚持徽章</h3><p class="muted small" style="margin-top:5px">连续三天完成任务，继续保持！</p></div></div></section>' : ''}
      <section class="card card-pad"><div class="section-heading" style="margin:0 0 4px"><h3>学习偏好</h3><span class="badge blue">本机保存</span></div><div class="switch-line"><div><strong>学习语音</strong><div class="muted tiny" style="margin-top:4px">朗读单词、例句和中文释义</div></div><button class="switch ${State.settings.soundEnabled ? 'on' : ''}" data-action="toggle-sound" aria-label="切换语音"><i></i></button></div><div class="switch-line"><div><strong>朗读速度</strong><div class="muted tiny" style="margin-top:4px">选择适合自己的节奏</div></div><select class="select" style="width:130px;min-height:42px" data-input="speech-rate"><option value="slow" ${State.settings.speechRate === 'slow' ? 'selected' : ''}>慢一点</option><option value="normal" ${State.settings.speechRate === 'normal' ? 'selected' : ''}>正常</option><option value="fast" ${State.settings.speechRate === 'fast' ? 'selected' : ''}>快一点</option></select></div></section>
      <section class="card card-pad"><div class="row between"><div><h3>家长管理</h3><p class="muted small" style="margin-top:6px">添加词语、查看报告和备份数据</p></div><button class="btn btn-secondary" data-action="navigate" data-path="/admin">进入后台</button></div></section><p class="privacy-note">所有学习记录都保存在这台设备上。<br>没有网络也可以继续学习。</p></div>${navBar()}</section>`; }
    function profileStats() { const mastered = State.words.filter(word => word.status === 'mastered').length; const minutes = State.logs.reduce((sum, log) => sum + (log.durationMinutes || 0), 0); const sorted = State.logs.map(log => log.date).sort().reverse(); let streak = 0; let cursor = new Date(); for (const key of sorted) { const expected = `${cursor.getFullYear()}-${pad(cursor.getMonth()+1)}-${pad(cursor.getDate())}`; if (key !== expected) { if (streak === 0 && key === todayKey()) { streak++; cursor.setDate(cursor.getDate() - 1); continue; } break; } const log = State.logs.find(item => item.date === key); if (log && ((log.completed) || (log.wordsStudied || []).length)) { streak++; cursor.setDate(cursor.getDate() - 1); } else break; } return { mastered, minutes, streak }; }

    /* ==================== 学习流程 ==================== */
    async function startTask(type) { const tasks = await getTodayTasks(); const ids = type === 'new' ? tasks.log.plannedNew : tasks.log.plannedReview; const done = type === 'new' ? tasks.log.wordsStudied : tasks.log.wordsReviewed; const nextId = ids.find(id => !done.includes(id)); if (!nextId) { showToast('这组任务已经完成啦'); return; } State.currentTask = { type, wordId: nextId, stage: type === 'review' ? 'R' : 'A', startedAt: Date.now(), spellAttempts: 0, hintCount: 0, mode: 'keyboard', selfKnown: true }; State.stageAReadyAt = Date.now() + 5000; State.stageAFlipped = false; State.stageB = null; State.spell = null; renderLearning(); }
    function currentWord() { return State.words.find(word => word.id === State.currentTask?.wordId); }
    function renderLearning() { if (!State.currentTask) return; const word = currentWord(); const app = $('#app'); if (!word) { State.currentTask = null; Router.navigate('/learn'); return; } let html = ''; if (State.currentTask.stage === 'A') html = renderStageA(word); if (State.currentTask.stage === 'R') html = renderReviewSelf(word); if (State.currentTask.stage === 'B') html = renderStageB(word); if (State.currentTask.stage === 'C') html = renderStageC(word); app.innerHTML = `<section class="screen learn-wrap"><div class="learn-top exit-row"><button class="btn btn-ghost" data-action="exit-learning">← 退出</button><span class="step-label">${State.currentTask.type === 'review' ? '今日复习' : '今日新词'} · ${stageName(State.currentTask.stage)}</span><span class="badge blue">${taskProgressText()}</span></div><div class="learning-card">${html}</div><div></div></section>`; bindLearningTimers(); }
    function stageName(stage) { return ({ A:'第 1 步 · 认识', R:'复习自评', B:'第 2 步 · 选择', C:'第 3 步 · 拼写' })[stage] || ''; }
    function taskProgressText() { const log = currentLog() || {}; const ids = State.currentTask?.type === 'review' ? (log.plannedReview || []) : (log.plannedNew || []); const done = State.currentTask?.type === 'review' ? (log.wordsReviewed || []) : (log.wordsStudied || []); const index = Math.max(0, ids.indexOf(State.currentTask?.wordId)); return `${Math.min(index + 1, ids.length)} / ${ids.length}`; }
    function visualBlock(word, className = 'visual-word') { return word.imageUrl ? `<div class="${className}"><img src="${escapeHtml(word.imageUrl)}" alt="${escapeHtml(word.word)}"></div>` : `<div class="${className}">${escapeHtml(word.emoji || getEmoji(word.meaning))}</div>`; }
    function renderStageA(word) { const ready = Date.now() >= State.stageAReadyAt; return `<article class="flip-card ${State.stageAFlipped ? 'flipped' : ''}"><div class="flip-face flip-front">${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '')}</div><button class="btn speak-btn" data-action="speak-current">🔊 听发音</button><div class="flip-action">${ready ? '<span>准备好后翻开卡片</span>' : '<span class="countdown" data-countdown>5秒后可翻转</span>'}<button class="btn ${ready ? 'btn-primary' : 'btn-secondary'} btn-block" style="margin-top:10px" data-action="flip-card" ${ready ? '' : 'disabled'}>↩️ 翻转卡片</button></div></div><div class="flip-face flip-back"><div class="eyebrow">认识这个词</div><div class="meaning-large">${escapeHtml(word.meaning)}</div><div class="example-en">${highlightWord(word.exampleEn, word.word)}</div><div class="example-cn">${escapeHtml(word.exampleCn || '')}</div>${word.hint ? `<div class="hint-box">💡 <strong>记忆小提示</strong><br>${escapeHtml(word.hint)}</div>` : ''}<div class="choice-self"><button class="btn btn-success" data-action="self-known">我认识 😊</button><button class="btn btn-warning" data-action="self-unknown">不认识 🤔</button></div></div></article>`; }
    function highlightWord(sentence = '', word = '') { const safe = escapeHtml(sentence); const escapedWord = escapeHtml(word); return safe.replace(new RegExp(`(${escapedWord})`, 'ig'), '<mark>$1</mark>'); }
    function bindLearningTimers() { if (State.currentTask?.stage === 'A' && !State.stageAFlipped && Date.now() < State.stageAReadyAt) { const tick = () => { if (State.currentTask?.stage !== 'A' || State.stageAFlipped) return; const target = $('[data-countdown]'); if (!target) return; const left = Math.max(0, Math.ceil((State.stageAReadyAt - Date.now()) / 1000)); target.textContent = left ? `${left}秒后可翻转` : '可以翻转啦'; if (left) setTimeout(tick, 250); else renderLearning(); }; tick(); } if (State.currentTask?.stage === 'C' && State.spell?.mode === 'keyboard') setTimeout(() => $('.spell-input')?.focus(), 60); }
    function renderReviewSelf(word) { return `<article class="card review-card"><div class="eyebrow">复习一下</div>${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '')}</div><div class="muted small" style="margin-top:9px">先想一想它是什么意思</div><div class="self-grid"><button class="btn btn-success" data-action="review-self" data-known="true">记得 😊</button><button class="btn btn-warning" data-action="review-self" data-known="false">不太记得 🤔</button></div><button class="btn btn-ghost" style="margin-top:10px" data-action="speak-current">🔊 听一遍</button></article>`; }
    function makeQuiz(word) { const otherMeanings = State.words.filter(item => item.id !== word.id && item.meaning).map(item => item.meaning); const fallback = ['广告', '挑战', '贡献', '庆祝', '住处，住宿', '机会', '环境', '决定']; const choices = unique([word.meaning, ...shuffle([...otherMeanings, ...fallback])]).slice(0, 4); return shuffle(choices); }
    function shuffle(list) { return list.sort(() => Math.random() - .5); }
    function renderStageB(word) { if (!State.stageB) State.stageB = { choices: makeQuiz(word), selected: null, correct: null }; const quiz = State.stageB; return `<article class="card quiz-card"><div class="eyebrow">选一选</div><h2 style="margin-top:8px">这个单词是什么意思？</h2><div class="quiz-visual">${visualBlock(word, 'visual-word')}<div class="quiz-word">${escapeHtml(word.word)}</div></div><div class="quiz-options">${quiz.choices.map((choice, index) => { const isCorrect = choice === word.meaning; const cls = quiz.correct === true && isCorrect ? 'correct' : quiz.correct === false && isCorrect ? 'correct' : quiz.selected === choice && quiz.correct === false ? 'wrong' : ''; return `<button class="quiz-option ${cls}" data-action="quiz-answer" data-choice="${escapeHtml(choice)}" ${quiz.correct === true || quiz.correct === false ? 'disabled' : ''}><span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${escapeHtml(choice)}</span>${cls === 'correct' ? '<span style="margin-left:auto">✓</span>' : ''}</button>`; }).join('')}</div><div class="quiz-feedback ${quiz.correct === true ? 'feedback-good' : quiz.correct === false ? 'feedback-bad' : ''}">${quiz.correct === true ? '对了！🎉 进入拼写挑战…' : quiz.correct === false ? '再想想 💡 看看绿色答案，然后继续。' : '选出你认为正确的中文释义'}</div>${quiz.correct === false ? '<button class="btn btn-primary btn-block" style="margin-top:12px" data-action="quiz-continue">继续拼写 →</button>' : ''}</article>`; }
    function renderStageC(word) { const spell = State.spell || (State.spell = { mode: State.currentTask.mode || 'keyboard', value: '', tiles: shuffle(word.word.toLowerCase().split('').map((letter, index) => ({ letter, key: `${index}-${Math.random()}`, used: false }))), error: false, success: false, compare: '' }); if (spell.success) return `<article class="card spell-card spell-success"><div class="success-icon">🌟</div><h2>拼写正确！</h2><p class="muted">${escapeHtml(word.word)} 已经记住啦</p><button class="btn btn-success btn-block" style="margin-top:28px" data-action="next-word">继续下一个 →</button></article>`; return `<article class="card spell-card"><div class="eyebrow">最后一关</div><h2 style="margin-top:8px;text-align:center">请拼写这个单词</h2><div class="spell-prompt"><div class="meaning-large">${escapeHtml(word.meaning)}</div>${word.exampleEn ? `<div class="spell-example">${highlightBlank(word.exampleEn, word.word)}</div>` : ''}<div class="phonetic" style="margin-top:12px">${escapeHtml(word.phonetic || '')}</div></div><div class="mode-toggle"><button class="mode-btn ${spell.mode === 'keyboard' ? 'active' : ''}" data-action="spell-mode" data-mode="keyboard">⌨️ 键盘输入</button><button class="mode-btn ${spell.mode === 'drag' ? 'active' : ''}" data-action="spell-mode" data-mode="drag">🔤 拖拽字母</button></div>${spell.mode === 'keyboard' ? `<input class="input spell-input ${spell.error ? 'error' : ''}" data-input="spell-value" value="${escapeHtml(spell.value)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词" aria-label="拼写答案">` : `<div class="drag-slots">${word.word.split('').map((_, i) => `<span class="slot ${spell.value[i] ? 'filled' : ''}">${escapeHtml(spell.value[i] || '')}</span>`).join('')}</div><div class="letter-bank">${spell.tiles.map(tile => `<button class="letter-tile ${tile.used ? 'used' : ''}" data-action="pick-letter" data-key="${escapeHtml(tile.key)}" ${tile.used ? 'disabled' : ''}>${escapeHtml(tile.letter)}</button>`).join('')}</div>`}<div class="spell-actions"><button class="btn btn-secondary" data-action="spell-hint" ${State.currentTask.hintCount >= 3 ? 'disabled' : ''}>💡 提示 ${State.currentTask.hintCount ? `(${State.currentTask.hintCount}/3)` : ''}</button><button class="btn btn-primary" data-action="check-spell">检查答案</button></div>${spell.error ? `<div class="compare">${compareSpelling(spell.value, word.word)}</div><div class="feedback-bad" style="text-align:center;margin-top:11px;font-weight:800">再试一次 💪 ${State.currentTask.spellAttempts >= 3 ? '这个单词有点难，我们明天再练。' : ''}</div>` : '<div class="muted tiny" style="text-align:center;margin-top:14px">拼写正确才能过关，可以无限次尝试</div>'}</article>`; }
    function highlightBlank(sentence = '', word = '') { return escapeHtml(sentence).replace(new RegExp(`_{2,}|${escapeHtml(word)}`, 'ig'), '____'); }
    function compareSpelling(answer, correct) { const a = (answer || '').toLowerCase(); return correct.split('').map((letter, i) => a[i] === letter ? `<span class="letter-right">${escapeHtml(letter)}</span>` : `<span class="letter-wrong">${escapeHtml(a[i] || '·')}</span>`).join(''); }
    async function markSelfKnown(known) { const word = currentWord(); const patch = known ? { lastReview: Date.now() } : { status: 'struggling', errorCount: (word.errorCount || 0) + 1, lastReview: Date.now(), nextReview: tomorrowStart() }; if (!known) await Scheduler.updateWord(word, patch); State.currentTask.selfKnown = known; if (State.currentTask.stage === 'R') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } else { State.currentTask.stage = 'B'; State.stageAFlipped = true; State.stageB = null; renderLearning(); } }
    async function finishWord() { const word = currentWord(); const wasReview = State.currentTask.type === 'review'; let patch = { lastReview: Date.now(), reviewCount: (word.reviewCount || 0) + (wasReview ? 1 : 0), nextReview: Scheduler.calculateNextReview(word, true) }; if (!wasReview) patch = { ...patch, status: word.status === 'struggling' || State.currentTask.spellAttempts >= 3 ? 'struggling' : (State.currentTask.selfKnown ? 'learning' : 'struggling'), nextReview: tomorrowStart() }; else if (word.status === 'struggling') { patch = { ...patch, status: (word.successfulReviewStreak || 0) + 1 >= 2 ? 'learning' : 'struggling', successfulReviewStreak: (word.successfulReviewStreak || 0) + 1 }; } else if (word.status === 'learning') { const correctStreak = (word.correctStreak || 0) + 1; patch = { ...patch, correctStreak, status: correctStreak >= 3 ? 'mastered' : 'learning', nextReview: correctStreak >= 3 ? Date.now() + 3 * 86400000 : tomorrowStart(), masteredInterval: 3 }; } else if (word.status === 'mastered') { patch = { ...patch, status: 'mastered' }; }
      await Scheduler.updateWord(word, patch); const log = currentLog() || { date: State.today, wordsStudied: [], wordsReviewed: [], durationMinutes: 0, plannedNew: [], plannedReview: [] }; const key = wasReview ? 'wordsReviewed' : 'wordsStudied'; log[key] = unique([...(log[key] || []), word.id]); log.durationMinutes = Math.max(log.durationMinutes || 0, Math.round((Date.now() - (State.currentTask.startedAt || Date.now())) / 60000)); const complete = (log.wordsStudied || []).length >= (log.plannedNew || []).length && (log.wordsReviewed || []).length >= (log.plannedReview || []).length; log.completed = complete; await DB.put('dailyLog', log); State.logs = await DB.all('dailyLog'); State.spell.success = true; renderLearning(); if (complete) setTimeout(() => { Animations.confetti(); showToast('今日完成！明天见 🌟'); }, 450); }
    function nextWord() { State.currentTask = null; State.stageB = null; State.spell = null; if (State.route !== '/learn') Router.navigate('/learn'); else { render(); } }
    function exitLearning() { if (confirm('确定要退出本轮学习吗？已经完成的单词会被保留。')) { State.currentTask = null; State.stageB = null; State.spell = null; render(); } }

    /* ==================== 家长后台 ==================== */
    function isAdminLocked() { const lock = JSON.parse(localStorage.getItem('petAdminLock') || '{}'); return Number(lock.until || 0) > Date.now() ? lock : null; }
    function renderAdminLogin() { const lock = isAdminLocked(); $('#app').innerHTML = `<section class="login-screen"><article class="card login-card"><div class="login-lock">🔐</div><div class="eyebrow" style="text-align:center">家长专属</div><h1 style="text-align:center;margin-top:8px">进入管理后台</h1><p class="muted" style="text-align:center;margin:11px 0 22px;line-height:1.6">管理词库、查看学习报告<br>和备份这台设备的数据</p>${lock ? `<div class="notice" style="margin-bottom:14px;text-align:center">密码尝试次数过多<br><strong>请 ${Math.ceil((lock.until - Date.now()) / 60000)} 分钟后再试</strong></div>` : '<label class="field"><span>家长密码</span><input class="input" type="password" data-input="admin-password" placeholder="请输入密码" autocomplete="current-password"></label><button class="btn btn-primary btn-block" style="margin-top:14px" data-action="admin-login">解锁后台</button>'}<button class="btn btn-ghost btn-block" style="margin-top:9px" data-action="navigate" data-path="/learn">返回学习</button><p class="privacy-note">首次使用默认密码：pet2024<br>进入后可在设置中修改密码</p></article></section>`; }
    function renderAdmin() { const body = State.adminTab === 'overview' ? renderAdminOverview() : State.adminTab === 'add' ? renderAdminAdd() : State.adminTab === 'manage' ? renderAdminManage() : renderAdminBackup(); return `<section class="screen admin-screen"><header class="topbar"><div class="brand-lockup"><div class="brand-mark">🔐</div><div><div class="brand-title">家长后台</div><div class="brand-subtitle">PET单词 · ${State.words.length} 个单词</div></div></div><button class="icon-btn" data-action="admin-logout" aria-label="退出后台">↗</button></header><nav class="admin-nav"><button class="admin-tab ${State.adminTab === 'overview' ? 'active' : ''}" data-action="admin-tab" data-tab="overview">📊 数据看板</button><button class="admin-tab ${State.adminTab === 'add' ? 'active' : ''}" data-action="admin-tab" data-tab="add">➕ 录入词库</button><button class="admin-tab ${State.adminTab === 'manage' ? 'active' : ''}" data-action="admin-tab" data-tab="manage">📚 管理词库</button><button class="admin-tab ${State.adminTab === 'backup' ? 'active' : ''}" data-action="admin-tab" data-tab="backup">💾 备份恢复</button></nav>${body}${State.importPayload ? renderImportModal() : ''}</section>`; }
    function renderAdminOverview() { const s = profileStats(); const week = weekStats(); const hard = [...State.words].sort((a,b) => (b.errorCount || 0) - (a.errorCount || 0)).slice(0,5); return `<div class="admin-layout"><div class="stack"><section class="card card-pad"><div class="row between"><div><div class="eyebrow">本周表现</div><h1 style="margin-top:7px">${week.completed}<span style="font-size:18px;color:var(--text-secondary)"> / 30 个词</span></h1></div><div style="font-size:43px">🌈</div></div><div class="canvas-wrap" style="margin-top:20px"><canvas id="weeklyChart" width="800" height="360"></canvas></div></section><section class="card card-pad"><div class="row between" style="margin-bottom:13px"><h2>易错词 Top 5</h2><span class="badge orange">只用于排序</span></div>${hard.length ? `<div class="word-list">${hard.map((word, index) => `<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--border)"><div class="row"><span style="width:24px;color:var(--text-secondary);font-weight:800">${index + 1}</span>${wordVisual(word)}<div><strong>${escapeHtml(word.word)}</strong><div class="muted tiny" style="margin-top:3px">${escapeHtml(word.meaning)}</div></div></div><span class="badge orange">${word.errorCount || 0} 次</span></div>`).join('')}</div>` : '<div class="empty">还没有错误记录，继续保持！</div>'}</section></div><div class="stack"><section class="streak-row"><div class="stat"><div class="stat-number">${State.words.length}</div><div class="stat-label">词库总量</div></div><div class="stat"><div class="stat-number">${s.mastered}</div><div class="stat-label">已掌握</div></div><div class="stat"><div class="stat-number">${s.minutes}</div><div class="stat-label">学习分钟</div></div></section><section class="card card-pad"><div class="eyebrow">连续打卡</div><div class="hero-number" style="color:var(--text);font-size:42px;margin-top:9px">${s.streak}<span style="color:var(--text-secondary)"> 天</span></div><p class="muted small" style="margin-top:8px">${s.streak >= 3 ? '太棒了，已经获得三日坚持徽章！' : '完成每     function parseBatch(text) { const lines = String(text || '').split(/\r?\n/); const records = []; let current = null; const flush = () => { if (current?.word) { current.meaning = current.meaning.trim(); current.exampleEn = current.exampleEn.trim(); current.exampleCn = current.exampleCn.trim(); current.emoji = current.emoji || getEmoji(current.meaning); records.push(current); } current = null; }; const splitExample = (value) => { const match = String(value || '').match(/[\u3400-\u9fff]/); if (!match) return { en: String(value || '').trim(), cn: '' }; return { en: String(value).slice(0, match.index).trim(), cn: String(value).slice(match.index).trim() }; }; for (const raw of lines) { const line = raw.trim(); if (!line) continue; const start = line.match(/^([A-Za-z][A-Za-z'-]*)\s+(\/[^/]+\/)\s+(.+)$/); if (start && !line.startsWith('例句')) { flush(); const rest = start[3]; const exampleIndex = rest.indexOf('例句:'); current = { word: start[1], phonetic: start[2], meaning: exampleIndex >= 0 ? rest.slice(0, exampleIndex).trim() : rest.trim(), exampleEn: '', exampleCn: '', emoji: '', hint: '' }; if (exampleIndex >= 0) { const parsed = splitExample(rest.slice(exampleIndex + 3)); current.exampleEn = parsed.en; current.exampleCn = parsed.cn; } continue; } if (!current) continue; if (line.startsWith('例句:')) { const parsed = splitExample(line.slice(3)); current.exampleEn = parsed.en; current.exampleCn = parsed.cn; } else if (current.exampleEn || current.exampleCn) { const parsed = splitExample(`${current.exampleEn} ${line}`); current.exampleEn = parsed.en; current.exampleCn = current.exampleCn || parsed.cn; } else current.meaning += ` ${line}`; } flush(); return records; }
    function renderAdminAdd() { const edit = State.editingWordId ? State.words.find(word => word.id === State.editingWordId) : null; return `<div class="admin-layout"><div class="stack"><section class="card card-pad"><div class="row between"><div><div class="eyebrow">批量录入</div><h2 style="margin-top:7px">每行一个单词</h2></div><span class="badge blue">自动解析</span></div><textarea class="textarea" style="margin-top:15px" data-input="batch-text" placeholder="accommodation /əˌkɒməˈdeɪʃn/ 住处，住宿 例句:The hotel provides accommodation for guests. 这家酒店为客人提供住宿。\nadvertisement /ədˈvɜːtɪsmənt/ 广告"></textarea><div class="row" style="margin-top:12px"><button class="btn btn-secondary" data-action="parse-batch">解析并预览</button>${State.batchPreview.length ? `<button class="btn btn-primary" data-action="save-batch">确认录入 ${State.batchPreview.length} 个</button>` : ''}</div>${State.batchPreview.length ? `<div class="preview-list" style="margin-top:15px">${State.batchPreview.map(item => `<div class="preview-item"><div class="row between"><strong>${escapeHtml(item.emoji)} ${escapeHtml(item.word)}</strong>${statusBadge({ status:'new' })}</div><div class="muted small" style="margin-top:5px">${escapeHtml(item.meaning)}</div>${item.exampleEn ? `<div class="tiny" style="margin-top:5px">例句：${escapeHtml(item.exampleEn)} ${escapeHtml(item.exampleCn)}</div>` : ''}</div>`).join('')}</div>` : ''}</section></div><section class="card card-pad"><div class="eyebrow">${edit ? '编辑单词' : '逐条添加'}</div><h2 style="margin-top:7px">${edit ? `编辑 ${escapeHtml(edit.word)}` : '手动录入'}</h2><form id="wordForm" class="field-grid" style="margin-top:16px"><input type="hidden" name="id" value="${edit?.id || ''}"><label class="field"><span>英文单词 *</span><input class="input" name="word" required value="${escapeHtml(edit?.word || '')}" placeholder="例如 celebrate"></label><div class="field-grid two"><label class="field"><span>音标</span><input class="input" name="phonetic" value="${escapeHtml(edit?.phonetic || '')}" placeholder="/ˈselɪbreɪt/"></label><label class="field"><span>中文释义 *</span><input class="input" name="meaning" required value="${escapeHtml(edit?.meaning || '')}" placeholder="庆祝"></label></div><label class="field"><span>英文例句</span><textarea class="textarea" style="min-height:90px" name="exampleEn" placeholder="We celebrate Christmas every year.">${escapeHtml(edit?.exampleEn || '')}</textarea></label><label class="field"><span>中文翻译</span><input class="input" name="exampleCn" value="${escapeHtml(edit?.exampleCn || '')}" placeholder="我们每年都庆祝圣诞节。"></label><div class="field-grid two"><label class="field"><span>图片 URL（可选）</span><input class="input" name="imageUrl" value="${escapeHtml(edit?.imageUrl || '')}" placeholder="https://..."></label><label class="field"><span>Emoji</span><input class="input" name="emoji" value="${escapeHtml(edit?.emoji || '')}" placeholder="自动匹配"></label></div><label class="field"><span>记忆提示</span><textarea class="textarea" style="min-height:80px" name="hint" placeholder="词根拆解或联想故事">${escapeHtml(edit?.hint || '')}</textarea></label><div class="row"><button class="btn btn-primary" type="submit">${edit ? '保存修改' : '加入词库'}</button>${edit ? '<button class="btn btn-secondary" type="button" data-action="cancel-edit">取消</button>' : ''}</div></form></section></div>`; }
    function renderAdminManage() { const query = State.adminSearch.toLowerCase(); const filtered = State.words.filter(word => !query || word.word.toLowerCase().includes(query) || word.meaning.includes(query)); const totalPages = Math.max(1, Math.ceil(filtered.length / 20)); State.adminPage = Math.min(State.adminPage, totalPages); const page = filtered.slice((State.adminPage - 1) * 20, State.adminPage * 20); return `<section class="card card-pad"><div class="row between wrap"><div><div class="eyebrow">词库管理</div><h2 style="margin-top:7px">全部单词</h2></div><span class="badge blue">${filtered.length} 个</span></div><div class="search-box" style="margin-top:17px"><span>⌕</span><input class="input" style="padding-left:42px" data-input="admin-search" value="${escapeHtml(State.adminSearch)}" placeholder="按英文或中文搜索"></div><div class="admin-table-wrap" style="margin-top:13px"><table class="admin-table"><thead><tr><th>词语</th><th>音标</th><th>释义</th><th>状态</th><th>错误次数</th><th>操作</th></tr></thead><tbody>${page.length ? page.map(word => `<tr><td><div class="row"><span style="font-size:23px">${escapeHtml(word.emoji || getEmoji(word.meaning))}</span><strong>${escapeHtml(word.word)}</strong></div></td><td class="muted">${escapeHtml(word.phonetic || '—')}</td><td>${escapeHtml(word.meaning)}</td><td>${statusBadge(word)}</td><td>${word.errorCount || 0}</td><td><div class="table-actions"><button class="mini-btn blue" data-action="edit-word" data-id="${word.id}">编辑</button><button class="mini-btn" data-action="reset-word" data-id="${word.id}">重置</button><button class="mini-btn red" data-action="delete-word" data-id="${word.id}">删除</button></div></td></tr>`).join('') : '<tr><td colspan="6" class="empty">没有找到单词</td></tr>'}</tbody></table></div><div class="row between" style="margin-top:15px"><span class="muted small">第 ${State.adminPage} / ${totalPages} 页</span><div class="row"><button class="mini-btn" data-action="admin-page" data-delta="-1" ${State.adminPage <= 1 ? 'disabled' : ''}>上一页</button><button class="mini-btn" data-action="admin-page" data-delta="1" ${State.adminPage >= totalPages ? 'disabled' : ''}>下一页</button></div></div></section>`; }
    function renderAdminBackup() { return `<div class="admin-layout"><section class="card card-pad"><div class="eyebrow">数据备份</div><h2 style="margin-top:7px">带走你的学习记录</h2><p class="muted" style="line-height:1.7;margin-top:10px">导出文件包含词库、学习设置和每日记录。建议每隔一段时间备份一次。</p><button class="btn btn-primary btn-block" style="margin-top:18px" data-action="export-data">⬇️ 导出 JSON 备份</button></section><section class="card card-pad"><div class="eyebrow">数据恢复</div><h2 style="margin-top:7px">从备份继续</h2><p class="muted" style="line-height:1.7;margin-top:10px">选择之前导出的 JSON 文件，然后选择覆盖、跳过重复或合并更新。</p><label class="btn btn-secondary btn-block" style="margin-top:18px">⬆️ 选择 JSON 文件<input type="file" accept=".json,application/json" data-input="import-file" hidden></label><div class="notice" style="margin-top:14px">小提示：恢复数据会影响本机当前词库，操作前可以先导出一份当前备份。</div></section><section class="card card-pad"><div class="eyebrow">后台设置</div><h2 style="margin-top:7px">修改家长密码</h2><form id="passwordForm" class="field-grid" style="margin-top:15px"><label class="field"><span>新密码</span><input class="input" type="password" name="password" minlength="4" required placeholder="至少4位"></label><button class="btn btn-secondary" type="submit">保存新密码</button></form></section></div>`; }
    function renderImportModal() { return `<div class="modal-backdrop"><article class="modal"><div class="eyebrow">发现备份文件</div><h2>选择导入方式</h2><p class="muted" style="line-height:1.6;margin-top:8px">${State.importPayload.words?.length || 0} 个单词 · ${State.importPayload.dailyLog?.length || 0} 条学习记录</p><div class="import-options"><button class="btn btn-primary btn-block" data-action="import-mode" data-mode="merge">合并更新（推荐）<span class="tiny">相同单词用备份内容更新</span></button><button class="btn btn-secondary btn-block" data-action="import-mode" data-mode="skip">跳过重复</button><button class="btn btn-warning btn-block" data-action="import-mode" data-mode="overwrite">覆盖全部本机数据</button><button class="btn btn-ghost btn-block" data-action="close-import">取消</button></div></article></div>`; }

    /* ==================== 交互事件 ==================== */
    document.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]'); if (!target) return; const action = target.dataset.action;
      if (action === 'navigate') { Router.navigate(target.dataset.path); return; }
      if (action === 'skip-guide') { setGuideSeen(); return; }
      if (action === 'next-guide') { if (State.guidePage < 2) { State.guidePage++; render(); } else setGuideSeen(); return; }
      if (action === 'start-task') { await startTask(target.dataset.type); return; }
      if (action === 'speak' || action === 'speak-current') { const word = action === 'speak' ? State.words.find(item => item.id === Number(target.dataset.id)) : currentWord(); if (word) Speaker.speakWord(word); return; }
      if (action === 'exit-learning') { exitLearning(); return; }
      if (action === 'flip-card') { State.stageAFlipped = true; renderLearning(); return; }
      if (action === 'self-known' || action === 'self-unknown') { await markSelfKnown(action === 'self-known'); return; }
      if (action === 'review-self') { const known = target.dataset.known === 'true'; const word = currentWord(); State.currentTask.selfKnown = known; if (!known) await Scheduler.updateWord(word, { status:'struggling', errorCount:(word.errorCount || 0) + 1, nextReview: tomorrowStart() }); State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'quiz-answer') { const choice = target.dataset.choice; const correct = choice === currentWord().meaning; State.stageB.selected = choice; State.stageB.correct = correct; if (correct) { renderLearning(); setTimeout(() => { if (State.currentTask?.stage === 'B') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } }, 1500); } else { renderLearning(); } return; }
      if (action === 'quiz-continue') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'spell-mode') { State.currentTask.mode = target.dataset.mode; State.spell = { mode: target.dataset.mode, value: '', tiles: shuffle(currentWord().word.toLowerCase().split('').map((letter, index) => ({ letter, key: `${index}-${Math.random()}`, used: false }))), error: false, success: false }; renderLearning(); return; }
      if (action === 'pick-letter') { const tile = State.spell.tiles.find(item => item.key === target.dataset.key); if (!tile || tile.used) return; const max = currentWord().word.length; if (State.spell.value.length >= max) return; tile.used = true; State.spell.value += tile.letter; State.spell.error = false; renderLearning(); return; }
      if (action === 'spell-hint') { const word = currentWord(); const hintIndex = Math.min(State.currentTask.hintCount, word.word.length - 1); State.currentTask.hintCount++; if (State.spell.mode === 'keyboard') { const current = State.spell.value; State.spell.value = word.word.slice(0, Math.max(current.length, hintIndex + 1)); } else { const expected = word.word[hintIndex].toLowerCase(); const index = State.spell.tiles.findIndex(tile => !tile.used && tile.letter === expected); if (index >= 0) { State.spell.tiles[index].used = true; State.spell.value = (State.spell.value + expected).slice(0, word.word.length); } } State.spell.error = false; renderLearning(); return; }
      if (action === 'check-spell') { const word = currentWord(); const answer = normalizeWord(State.spell.value); const correct = normalizeWord(word.word); if (answer === correct) { State.spell.error = false; State.spell.success = true; await finishWord(); Speaker.speakCorrect(currentWord()); } else { State.currentTask.spellAttempts++; State.spell.error = true; State.spell.compare = answer; await Scheduler.updateWord(word, { errorCount: (word.errorCount || 0) + 1, status: State.currentTask.spellAttempts >= 3 ? 'struggling' : word.status, nextReview: tomorrowStart() }); renderLearning(); Speaker.speakCorrect(currentWord()); } return; }
      if (action === 'next-word') { const tasks = await getTodayTasks(); const log = tasks.log; const ids = State.currentTask.type === 'review' ? log.plannedReview : log.plannedNew; const done = State.currentTask.type === 'review' ? log.wordsReviewed : log.wordsStudied; const next = ids.find(id => !done.includes(id)); State.currentTask = next ? { type: State.currentTask.type, wordId: next, stage: State.currentTask.type === 'review' ? 'R' : 'A', startedAt: Date.now(), spellAttempts: 0, hintCount: 0, mode: 'keyboard', selfKnown: true } : null; State.stageAReadyAt = Date.now() + 5000; State.stageAFlipped = false; State.stageB = null; State.spell = null; if (State.currentTask) renderLearning(); else { render(); if (log.completed) { Animations.confetti(); showToast('今日完成！明天见 🌟'); } } return; }
      if (action === 'toggle-sound') { State.settings.soundEnabled = !State.settings.soundEnabled; await DB.put('settings', State.settings); render(); return; }
      if (action === 'admin-login') { await adminLogin(); return; }
      if (action === 'admin-logout') { localStorage.removeItem('petAdminSession'); Router.navigate('/learn'); return; }
      if (action === 'admin-tab') { State.adminTab = target.dataset.tab; if (State.adminTab !== 'manage') State.adminSearch = ''; render(); return; }
      if (action === 'parse-batch') { State.batchPreview = parseBatch($('[data-input="batch-text"]')?.value || ''); render(); if (!State.batchPreview.length) showToast('没有识别到单词，请检查格式'); return; }
      if (action === 'save-batch') { await saveBatch(); return; }
      if (action === 'cancel-edit') { State.editingWordId = null; render(); return; }
      if (action === 'edit-word') { State.editingWordId = Number(target.dataset.id); State.adminTab = 'add'; render(); return; }
      if (action === 'delete-word') { const word = State.words.find(item => item.id === Number(target.dataset.id)); if (word && confirm(`确定删除 “${word.word}” 吗？`)) { await DB.delete('words', word.id); State.words = await DB.all('words'); showToast('单词已删除'); render(); } return; }
      if (action === 'reset-word') { const word = State.words.find(item => item.id === Number(target.dataset.id)); if (word) { await Scheduler.updateWord(word, { status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, correctStreak:0, successfulReviewStreak:0 }); showToast('学习进度已重置'); render(); } return; }
      if (action === 'admin-page') { State.adminPage += Number(target.dataset.delta); render(); return; }
      if (action === 'export-data') { exportData(); return; }
      if (action === 'import-mode') { await importData(target.dataset.mode); return; }
      if (action === 'close-import') { State.importPayload = null; render(); return; }
    });
    document.addEventListener('input', (event) => { const input = event.target; if (input.dataset.input === 'word-search') { State.wordSearch = input.value; render(); const box = $('[data-input="word-search"]'); box?.focus(); box?.setSelectionRange(box.value.length, box.value.length); } if (input.dataset.input === 'admin-search') { State.adminSearch = input.value; State.adminPage = 1; render(); const box = $('[data-input="admin-search"]'); box?.focus(); box?.setSelectionRange(box.value.length, box.value.length); } if (input.dataset.input === 'spell-value') { State.spell.value = input.value.toLowerCase().replace(/[^a-z']/g, ''); State.spell.error = false; } });
    document.addEventListener('change', async (event) => { const input = event.target; if (input.dataset.input === 'speech-rate') { State.settings.speechRate = input.value; await DB.put('settings', State.settings); showToast('朗读速度已更新'); } if (input.dataset.input === 'import-file' && input.files?.[0]) { const reader = new FileReader(); reader.onload = () => { try { const payload = JSON.parse(reader.result); if (!payload || !Array.isArray(payload.words)) throw new Error('bad backup'); State.importPayload = payload; render(); } catch { showToast('这个文件不是有效的备份'); } }; reader.readAsText(input.files[0]); } });
    document.addEventListener('submit', async (event) => { event.preventDefault(); if (event.target.id === 'wordForm') await saveWordForm(event.target); if (event.target.id === 'passwordForm') { const password = new FormData(event.target).get('password'); if (String(password).length >= 4) { State.settings.adminPassword = String(password); await DB.put('settings', State.settings); showToast('家长密码已更新'); event.target.reset(); } } });
    async function adminLogin() { const input = $('[data-input="admin-password"]'); const password = input?.value || ''; const lock = isAdminLocked(); if (lock) return; if (password === State.settings.adminPassword) { localStorage.setItem('petAdminSession', String(Date.now() + 86400000)); localStorage.removeItem('petAdminLock'); State.adminTab = 'overview'; Router.resolve(); } else { const current = JSON.parse(localStorage.getItem('petAdminLock') || '{"count":0}'); current.count = (current.count || 0) + 1; if (current.count >= 3) current.until = Date.now() + 300000; localStorage.setItem('petAdminLock', JSON.stringify(current)); renderAdminLogin(); showToast(current.until ? '请5分钟后再试' : `密码不正确，还可以尝试 ${3 - current.count} 次`); } }
    async function saveWordForm(form) { const data = Object.fromEntries(new FormData(form).entries()); const existing = data.id ? State.words.find(word => word.id === Number(data.id)) : null; const next = { ...(existing || { status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, createdAt:Date.now() }), word:data.word.trim(), phonetic:data.phonetic.trim(), meaning:data.meaning.trim(), exampleEn:data.exampleEn.trim(), exampleCn:data.exampleCn.trim(), imageUrl:data.imageUrl.trim(), emoji:data.emoji.trim() || getEmoji(data.meaning), hint:data.hint.trim() }; if (!next.word || !next.meaning) { showToast('请填写英文单词和中文释义'); return; } const duplicate = State.words.find(word => word.word.toLowerCase() === next.word.toLowerCase() && word.id !== next.id); if (duplicate) { showToast('词库里已经有这个单词啦'); return; } await DB.put('words', next); State.words = await DB.all('words'); State.editingWordId = null; showToast(existing ? '单词已更新' : '单词已加入词库'); render(); }
    async function saveBatch() { const existingWords = new Set(State.words.map(word => word.word.toLowerCase())); let added = 0; for (const item of State.batchPreview) { if (existingWords.has(item.word.toLowerCase())) continue; await DB.put('words', { ...item, status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, createdAt:Date.now() + added }); added++; } State.words = await DB.all('words'); State.batchPreview = []; showToast(added ? `已录入 ${added} 个单词` : '重复单词已跳过'); render(); }
    function exportData() { const payload = { exportedAt: new Date().toISOString(), words: State.words, settings: State.settings, dailyLog: State.logs }; const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `pet-word-backup-${todayKey()}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); showToast('备份文件已下载'); }
    async function importData(mode) { const payload = State.importPayload; if (!payload) return; if (mode === 'overwrite') { await DB.clear('words'); await DB.clear('dailyLog'); await DB.bulkPut('words', payload.words || []); await DB.bulkPut('dailyLog', payload.dailyLog || []); if (payload.settings) await DB.put('settings', { ...DEFAULT_SETTINGS, ...payload.settings }); } else { const currentByWord = new Map(State.words.map(word => [word.word.toLowerCase(), word])); for (const incoming of payload.words || []) { const existing = currentByWord.get(String(incoming.word || '').toLowerCase()); if (existing && mode === 'skip') continue; await DB.put('words', existing ? { ...existing, ...incoming, id: existing.id } : { ...incoming, id: undefined }); } if (payload.settings && mode === 'merge') await DB.put('settings', { ...State.settings, ...payload.settings, key:'config' }); if (mode === 'merge') for (const incoming of payload.dailyLog || []) { const existing = State.logs.find(log => log.date === incoming.date); await DB.put('dailyLog', existing ? { ...existing, ...incoming, id:existing.id } : { ...incoming, id:undefined }); } } State.words = await DB.all('words'); State.logs = await DB.all('dailyLog'); const saved = await DB.get('settings','config'); State.settings = { ...DEFAULT_SETTINGS, ...(saved || {}) }; State.importPayload = null; showToast('数据恢复完成'); render(); }

    /* ==================== 动画与启动 ==================== */
    const Animations = { confetti() { const canvas = $('#confetti'); if (!canvas) return; canvas.hidden = false; canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; const ctx = canvas.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio); const colors = ['#007aff','#34c759','#ff9500','#ff3b30','#7c5cff','#ffd60a']; const pieces = Array.from({ length: 110 }, (_, i) => ({ x: Math.random()*innerWidth, y: -20-Math.random()*innerHeight*.3, size: 5+Math.random()*7, color:colors[i%colors.length], speed: 2+Math.random()*4, drift: -1+Math.random()*2, angle:Math.random()*6 })); const started = performance.now(); const draw = (time) => { ctx.clearRect(0,0,innerWidth,innerHeight); for (const p of pieces) { p.y += p.speed; p.x += p.drift; p.angle += .08; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6); ctx.restore(); } if (time-started < 3000) requestAnimationFrame(draw); else { ctx.clearRect(0,0,innerWidth,innerHeight); canvas.hidden = true; } }; requestAnimationFrame(draw); } };
    function drawChart() { const canvas = $('#weeklyChart'); if (!canvas) return; const rect = canvas.getBoundingClientRect(); const ratio = devicePixelRatio || 1; canvas.width = Math.max(1, rect.width * ratio); canvas.height = Math.max(1, rect.height * ratio); const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio); const width = rect.width, height = rect.height; ctx.clearRect(0,0,width,height); const week = weekStats(); const data = week.keys.map(key => { const log = week.logs.find(item => item.date === key); return log ? (log.wordsStudied || []).length : 0; }); const max = Math.max(5, ...data); const left=28, right=12, top=15, bottom=32; ctx.strokeStyle='#e6eaf0'; ctx.lineWidth=1; for (let i=0;i<=5;i++) { const y=top+(height-top-bottom)*i/5; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(width-right,y); ctx.stroke(); } const labels=['一','二','三','四','五','六','日']; const xStep=(width-left-right)/6; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center'; data.forEach((value,i)=>{ const x=left+xStep*i; const y=top+(height-top-bottom)*(1-value/max); ctx.fillStyle='#858b98'; ctx.fillText(labels[i],x,height-8); ctx.fillStyle='#007aff'; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); if(i>0){ const previous = top+(height-top-bottom)*(1-data[i-1]/max); ctx.strokeStyle='#007aff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-xStep,previous); ctx.lineTo(x,y); ctx.stroke(); } }); }
    async function init() { try { await DB.init(); await hydrate(); await ensureDailyLog(); window.addEventListener('hashchange', () => { State.currentTask = null; Router.resolve(); }); window.addEventListener('resize', drawChart); Router.resolve(); } catch (error) { console.error('PET init failed', error); $('#app').innerHTML = `<section class="login-screen"><article class="card login-card"><div class="login-lock">⚠️</div><h2 style="text-align:center">应用暂时无法启动</h2><p class="muted" style="text-align:center;line-height:1.7;margin-top:10px">请刷新页面再试一次。如果仍然出现问题，检查浏览器是否允许本地存储。</p><p class="tiny muted" style="text-align:center;margin-top:9px">${escapeHtml(error?.message || '未知启动错误')}</p><button class="btn btn-primary btn-block" style="margin-top:17px" onclick="location.reload()">重新打开</button></article></section>`; } }
    init();
  </script>
</body>
