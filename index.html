  <title>希希词语家</title>
  <style>
    :root {

  <script>
    'use strict';

    /* ==================== 数据与工具 ==================== */
    const SAMPLE_WORDS = [
      { word: 'accommodation', phonetic: '/əˌkɒməˈdeɪʃn/', meaning: '住处，住宿', exampleEn: 'The hotel provides accommodation for up to 500 guests.', exampleCn: '这家酒店可为多达500位客人提供住宿。', emoji: '🏨', hint: 'ac-（朝向）+ commod（方便）+ -ation（名词后缀）→ 提供方便之处 → 住处' },

      { word: 'celebrate', phonetic: '/ˈselɪbreɪt/', meaning: '庆祝', exampleEn: 'We celebrate Christmas every year.', exampleCn: '我们每年都庆祝圣诞节。', emoji: '🎉', hint: 'celebr（著名的）+ -ate（使）→ 使著名 → 庆祝' }
    ];
    const DEFAULT_SETTINGS = { key: 'config', adminPassword: 'pet2024', dailyNew: 6, dailyReview: 6, soundEnabled: true, speechRate: 'normal', coins: 0, coinAwardedWordIds: [] };
    const EMOJI_MAP = {
      '住':'🏨','房':'🏠','家':'🏡','店':'🏪','宿':'🛏️','吃':'🍽️','食':'🍎','喝':'🥤','餐':'🍽️','饿':'😋','学':'📚','校':'🏫','书':'📖','读':'📖','教':'👨‍🏫','车':'🚗','路':'🛣️','走':'🚶','跑':'🏃','飞':'✈️','说':'💬','话':'🗣️','聊':'💭','讲':'🎤','喊':'📢','钱':'💰','买':'🛒','卖':'🏷️','付':'💳','贵':'💎','乐':'🎉','庆':'🎊','喜':'😊','笑':'😄','哭':'😢','工':'💼','作':'📝','业':'📋','职':'💼','忙':'⏰','医':'🏥','病':'🤒','药':'💊','痛':'😣','健':'💪','旅':'✈️','游':'🏖️','行':'🧳','景':'🏞️','玩':'🎮','爱':'❤️','情':'💕','友':'👫','亲':'👨‍👩‍👧','冷':'❄️','热':'☀️','雨':'🌧️','雪':'❄️','风':'💨','大':'⬆️','小':'⬇️','高':'📈','低':'📉','新':'✨','老':'👴','好':'👍','坏':'👎','美':'💄','丑':'🤡','快':'⚡','慢':'🐢','早':'🌅','晚':'🌙','default':'📌'
    };
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const pad = (n) => String(n).padStart(2, '0');
    const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
    const dateStart = (key = todayKey()) => new Date(`${key}T00:00:00`).getTime();
    const tomorrowStart = () => dateStart() + 86400000;
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const getEmoji = (meaning = '') => { for (const char of meaning.slice(0, 3)) if (EMOJI_MAP[char]) return EMOJI_MAP[char]; return EMOJI_MAP.default; };
    const statusLabel = { new: '未学习', learning: '学习中', mastered: '已掌握', struggling: '需要再练' };
    const statusClass = { new: '', learning: 'blue', mastered: 'green', struggling: 'orange' };
    const normalizeWord = (value = '') => value.trim().toLowerCase().replace(/[^a-z']/g, '');
    const COGNITION_SECONDS = 5;
    const unique = (list) => [...new Set(list)];

    /** 轻量本地数据层：优先 IndexedDB，遇到 Safari 隐私模式或数据库异常时自动降级。 */
    class PETDatabase {
      constructor() { this.db = null; this.fallback = false; this.DB_NAME = 'PETWordDB'; this.DB_VERSION = 1; this.fallbackKey = 'PETWordDB_FALLBACK'; }
      async init() {
        if (!('indexedDB' in window)) { this.fallback = true; return this.loadFallback(); }
        try {
          await new Promise((resolve, reject) => {
            const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
            request.onupgradeneeded = () => {
              const db = request.result;
              if (!db.objectStoreNames.contains('words')) { const store = db.createObjectStore('words', { keyPath: 'id', autoIncrement: true }); store.createIndex('word', 'word', { unique: false }); store.createIndex('nextReview', 'nextReview', { unique: false }); }
              if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
              if (!db.objectStoreNames.contains('dailyLog')) { const log = db.createObjectStore('dailyLog', { keyPath: 'id', autoIncrement: true }); log.createIndex('date', 'date', { unique: false }); }
            };
            request.onsuccess = () => { this.db = request.result; resolve(); };
            request.onerror = () => reject(request.error || new Error('IndexedDB unavailable'));
          });
        } catch (error) { this.fallback = true; this.loadFallback(); }
      }
      loadFallback() { try { this.fallbackData = JSON.parse(localStorage.getItem(this.fallbackKey) || '{"words":[],"settings":[],"dailyLog":[]}'); } catch { this.fallbackData = { words: [], settings: [], dailyLog: [] }; } }
      saveFallback() { localStorage.setItem(this.fallbackKey, JSON.stringify(this.fallbackData)); }
      async all(storeName) { if (this.fallback) return [...(this.fallbackData[storeName] || [])]; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error); }); }
      async get(storeName, key) { if (this.fallback) return (this.fallbackData[storeName] || []).find(item => item.id === key || item.key === key) || null; return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readonly').objectStore(storeName).get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); }); }
      async put(storeName, value) {
        if (this.fallback) {
          const list = this.fallbackData[storeName] || (this.fallbackData[storeName] = []);
          if (storeName === 'words' || storeName === 'dailyLog') {
            if (!value.id) value.id = list.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
          }
          const index = list.findIndex(item => (storeName === 'settings' ? item.key === value.key : item.id === value.id));
          if (index >= 0) list[index] = value; else list.push(value);
          this.saveFallback(); return value;
        }
        /* IndexedDB 的 keyPath 不接受 id: undefined，因此新增记录时移除该属性。 */
        const record = { ...value };
        if (storeName !== 'settings' && record.id === undefined) delete record.id;
        return new Promise((resolve, reject) => {
          const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).put(record);
          req.onsuccess = () => { if (!record.id && storeName !== 'settings') record.id = req.result; Object.assign(value, record); resolve(value); };
          req.onerror = () => reject(req.error);
        });
      }
      async add(storeName, value) { return this.put(storeName, value); }
      async delete(storeName, key) { if (this.fallback) { this.fallbackData[storeName] = (this.fallbackData[storeName] || []).filter(item => item.id !== key && item.key !== key); this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).delete(key); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async clear(storeName) { if (this.fallback) { this.fallbackData[storeName] = []; this.saveFallback(); return; } return new Promise((resolve, reject) => { const req = this.db.transaction(storeName, 'readwrite').objectStore(storeName).clear(); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
      async bulkPut(storeName, values) { for (const value of values) await this.put(storeName, value); }
    }

    const DB = new PETDatabase();
    const State = {
      route: '/learn', currentUser: 'child', today: todayKey(), settings: { ...DEFAULT_SETTINGS }, words: [], logs: [],
      currentTask: null, guidePage: 0, showGuide: false, stageAReadyAt: 0, stageAFlipped: false, stageB: null, spell: null, weeklyTest: null,
      adminTab: 'overview', adminLoggedIn: false, adminSearch: '', adminPage: 1, editingWordId: null, batchPreview: [], importPayload: null,
      wordSearch: '', batchText: '', batchLookupRunning: false, ocrStatus: '', selectedWordId: null, toastTimer: null, wordImageDraft: null, wordImageSource: null, wordImageTitle: '', imageStatus: ''
    };

    /** 读取本地数据，并在首次启动时写入示例词。 */
    async function hydrate() {
      State.words = await DB.all('words');
      if (!State.words.length) {
        const now = Date.now();
        await DB.bulkPut('words', SAMPLE_WORDS.map((word, index) => ({ ...word, status: 'new', reviewCount: 0, lastReview: 0, nextReview: 0, errorCount: 0, createdAt: now + index })));
        State.words = await DB.all('words');
        localStorage.setItem('petWelcomeSeen', 'false');
      }
      const savedSettings = await DB.get('settings', 'config');
      State.settings = { ...DEFAULT_SETTINGS, ...(savedSettings || {}) };
      // 旧版本默认是 5+5；首次升级到本版本时迁移到新的 6+6 默认值。
      if (savedSettings && savedSettings.dailyNew === 5 && savedSettings.dailyReview === 5 && localStorage.getItem('petSixTaskDefaultsApplied') !== 'true') {
        State.settings.dailyNew = 6;
        State.settings.dailyReview = 6;
        await DB.put('settings', State.settings);
      }
      localStorage.setItem('petSixTaskDefaultsApplied', 'true');
      if (!savedSettings) await DB.put('settings', State.settings);
      State.logs = await DB.all('dailyLog');
      /* 旧版本没有希币字段：已完成过的新词按“每词1希币”初始化一次，避免升级后积分丢失。 */
      const savedCoinIds = Array.isArray(State.settings.coinAwardedWordIds) ? State.settings.coinAwardedWordIds : [];
      const historicalIds = unique(State.logs.flatMap(log => log.wordsStudied || [])).filter(id => State.words.some(word => word.id === id));
      const mergedCoinIds = unique([...savedCoinIds, ...historicalIds]);
      const expectedCoins = Math.max(Number(State.settings.coins) || 0, mergedCoinIds.length);
      if (mergedCoinIds.length !== savedCoinIds.length || expectedCoins !== Number(State.settings.coins || 0)) {
        State.settings.coinAwardedWordIds = mergedCoinIds;
        State.settings.coins = expectedCoins;
        await DB.put('settings', State.settings);
      } else {
        State.settings.coinAwardedWordIds = mergedCoinIds;
        State.settings.coins = expectedCoins;
      }
      State.showGuide = localStorage.getItem('petWelcomeSeen') !== 'true';
    }

    /** 将日期对应的学习计划固定下来，避免完成一词后任务顺序漂移。 */
    async function ensureDailyLog() {
      let log = State.logs.find(item => item.date === State.today);
      if (log && Array.isArray(log.plannedNew) && Array.isArray(log.plannedReview) && log.dailyNew === State.settings.dailyNew && log.dailyReview === State.settings.dailyReview) return log;
      const completedNew = log?.wordsStudied || [];
      const completedReview = log?.wordsReviewed || [];
      const tomorrow = dateStart(State.today) + 86400000;
      const newPool = State.words.filter(word => word.status === 'new' && !completedNew.includes(word.id)).sort((a,b) => a.createdAt - b.createdAt);
      const due = State.words.filter(word => word.status !== 'new' && (word.nextReview || 0) <= dateStart(State.today) && !completedReview.includes(word.id))
        .sort((a,b) => (a.status === 'struggling' ? -1 : 1) - (b.status === 'struggling' ? -1 : 1) || (b.errorCount || 0) - (a.errorCount || 0) || (a.nextReview || 0) - (b.nextReview || 0));
      const masteredFallback = State.words.filter(word => word.status === 'mastered' && !due.some(item => item.id === word.id) && !completedReview.includes(word.id)).sort((a,b) => (a.lastReview || 0) - (b.lastReview || 0));
      const plannedNew = log?.plannedNew || newPool.slice(0, State.settings.dailyNew).map(word => word.id);
      const plannedReview = log?.plannedReview || [...due, ...masteredFallback].slice(0, State.settings.dailyReview).map(word => word.id);
      const nextLog = { date: State.today, wordsStudied: completedNew, wordsReviewed: completedReview, coinsEarned: log?.coinsEarned || 0, durationMinutes: log?.durationMinutes || 0, completed: log?.completed || false, plannedNew, plannedReview, dailyNew: State.settings.dailyNew, dailyReview: State.settings.dailyReview, weeklyTestCompleted: log?.weeklyTestCompleted || false, weeklyTestMeaningScore: log?.weeklyTestMeaningScore || 0, weeklyTestSpellingScore: log?.weeklyTestSpellingScore || 0 };
      if (log?.id !== undefined) nextLog.id = log.id;
      await DB.put('dailyLog', nextLog); State.logs = await DB.all('dailyLog'); return nextLog;
    }

    /** 修复旧版本留下的空任务计划：没有实际任务时不能显示“今日完成”。 */
    async function ensureDailyLog() {
      const log = State.logs.find(item => item.date === State.today);
      const settingsMatch = Boolean(log && log.dailyNew === State.settings.dailyNew && log.dailyReview === State.settings.dailyReview);
      const live = (id) => State.words.some(word => word.id === id);
      const completedNew = unique((log?.wordsStudied || []).filter(live));
      const completedReview = unique((log?.wordsReviewed || []).filter(live));
      const currentNew = unique((Array.isArray(log?.plannedNew) ? log.plannedNew : []).filter(live));
      const currentReview = unique((Array.isArray(log?.plannedReview) ? log.plannedReview : []).filter(live));
      const usedNew = new Set([...completedNew, ...currentNew]);
      const availableNew = State.words.filter(word => word.status === 'new' && !usedNew.has(word.id)).sort((a, b) => a.createdAt - b.createdAt);
      const usedReview = new Set([...completedReview, ...currentReview]);
      const due = State.words.filter(word => word.status !== 'new' && (word.nextReview || 0) <= dateStart(State.today) && !usedReview.has(word.id))
        .sort((a,b) => (a.status === 'struggling' ? -1 : 1) - (b.status === 'struggling' ? -1 : 1) || (b.errorCount || 0) - (a.errorCount || 0) || (a.nextReview || 0) - (b.nextReview || 0));
      const masteredFallback = State.words.filter(word => word.status === 'mastered' && !usedReview.has(word.id) && !due.some(item => item.id === word.id)).sort((a,b) => (a.lastReview || 0) - (b.lastReview || 0));
      let plannedNew = settingsMatch ? currentNew : unique([...completedNew, ...currentNew]);
      let plannedReview = settingsMatch ? currentReview : unique([...completedReview, ...currentReview]);
      const emptyPlanNeedsRepair = !plannedNew.length && !completedNew.length && availableNew.length;
      if (!log || !settingsMatch || emptyPlanNeedsRepair) plannedNew = unique([...plannedNew, ...availableNew.slice(0, Math.max(0, State.settings.dailyNew - plannedNew.length)).map(word => word.id)]);
      const emptyReviewNeedsRepair = !plannedReview.length && !completedReview.length && (due.length || masteredFallback.length);
      if (!log || !settingsMatch || emptyReviewNeedsRepair) plannedReview = unique([...plannedReview, ...[...due, ...masteredFallback].slice(0, Math.max(0, State.settings.dailyReview - plannedReview.length)).map(word => word.id)]);
      const nextLog = { date: State.today, wordsStudied: completedNew, wordsReviewed: completedReview, coinsEarned: log?.coinsEarned || 0, durationMinutes: log?.durationMinutes || 0, completed: (plannedNew.length + plannedReview.length > 0) && completedNew.length >= plannedNew.length && completedReview.length >= plannedReview.length, plannedNew, plannedReview, dailyNew: State.settings.dailyNew, dailyReview: State.settings.dailyReview, weeklyTestCompleted: log?.weeklyTestCompleted || false, weeklyTestMeaningScore: log?.weeklyTestMeaningScore || 0, weeklyTestSpellingScore: log?.weeklyTestSpellingScore || 0 };
      if (log?.id !== undefined) nextLog.id = log.id;
      await DB.put('dailyLog', nextLog); State.logs = await DB.all('dailyLog'); return nextLog;
    }

    async function getTodayTasks() {
      const log = await ensureDailyLog();
      return { log, newWords: log.plannedNew.map(id => State.words.find(word => word.id === id)).filter(Boolean), reviewWords: log.plannedReview.map(id => State.words.find(word => word.id === id)).filter(Boolean) };
    }
    function currentLog() { return State.logs.find(item => item.date === State.today); }
    function wordVisual(word, className = '') { return word.imageUrl ? `<div class="${className || 'word-emoji'}"><img src="${escapeHtml(word.imageUrl)}" alt="${escapeHtml(word.word)}" loading="lazy" onerror="this.closest('div').classList.add('image-failed');this.remove()"></div>` : `<div class="${className || 'word-emoji'}">${escapeHtml(word.emoji || getEmoji(word.meaning))}</div>`; }
    /** 返回当前表单中的图片草稿；本地图片会压缩成 data URL，能在 iPad 离线学习。 */
    function imageDraftFor(edit) { return State.wordImageDraft !== null ? State.wordImageDraft : (edit?.imageUrl || ''); }
    /** 将相机或相册图片缩小后保存，避免原图过大导致本机词库超出存储空间。 */
    function prepareWordImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !String(file.type || '').startsWith('image/')) { reject(new Error('请选择图片文件')); return; }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('图片读取失败'));
        reader.onload = () => {
          const source = String(reader.result || ''); const image = new Image();
          image.onerror = () => reject(new Error('图片无法读取'));
          image.onload = () => {

    const Speaker = {
      /** 选择本机较自然的本地语音；不同设备可用的声音名称不同，因此保留语言前缀兜底。 */
      voiceFor(lang) {
        const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
        const prefix = lang.toLowerCase().split('-')[0];
        const candidates = voices.filter(voice => voice.lang.toLowerCase().startsWith(prefix));
        const preferred = prefix === 'en'
          ? /samantha|karen|moira|siri|ava|susan|female/i
          : /ting-ting|meijia|sin-ji|siri|female/i;
        return candidates.find(voice => preferred.test(voice.name)) || candidates.find(voice => voice.localService) || candidates[0] || null;
      },
      speak(text, lang = 'en-US', rate = .8, cancel = true) {
        if (!State.settings.soundEnabled || !('speechSynthesis' in window) || !text) return;
        try {
          if (cancel) speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(String(text));
          utterance.lang = lang;
          utterance.rate = rate;
          utterance.pitch = 1;
          const voice = this.voiceFor(lang);
          if (voice) utterance.voice = voice;
          speechSynthesis.speak(utterance);
        } catch (_) {}
      },
      speakSequence(items, rate) {
        if (!State.settings.soundEnabled || !('speechSynthesis' in window)) return;
        const queue = items.filter(item => item.text);
        if (!queue.length) return;
        try {
          speechSynthesis.cancel();
          const play = (index) => {
            const item = queue[index];
            if (!item) return;
            const utterance = new SpeechSynthesisUtterance(String(item.text));
            utterance.lang = item.lang;
            utterance.rate = rate;
            utterance.pitch = 1;
            const voice = this.voiceFor(item.lang);
            if (voice) utterance.voice = voice;
            utterance.onend = () => setTimeout(() => play(index + 1), 450);
            utterance.onerror = () => {};
            speechSynthesis.speak(utterance);
          };
          play(0);
        } catch (_) {}
      },
      speakWord(word) {
        const rate = { slow: .6, normal: .8, fast: 1 }[State.settings.speechRate] || .8;
        this.speakSequence([
          { text: word.word, lang: 'en-US' },
          { text: word.exampleEn, lang: 'en-US' },
          { text: word.meaning, lang: 'zh-CN' }
        ], rate);
      },
      speakCorrect(word) {

    function visualBlock(word, className = 'visual-word') { return word.imageUrl ? `<div class="${className}"><img src="${escapeHtml(word.imageUrl)}" alt="${escapeHtml(word.word)}"></div>` : `<div class="${className}">${escapeHtml(word.emoji || getEmoji(word.meaning))}</div>`; }
    function renderStageA(word) { const ready = Date.now() >= State.stageAReadyAt; return `<article class="flip-card ${State.stageAFlipped ? 'flipped' : ''}"><div class="flip-face flip-front">${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '')}</div><button class="btn speak-btn" data-action="speak-current">🔊 听发音</button><div class="flip-action">${ready ? '<span>准备好后翻开卡片</span>' : `<span class="countdown" data-countdown>${COGNITION_SECONDS}秒后可翻转</span>`}<button class="btn ${ready ? 'btn-primary' : 'btn-secondary'} btn-block" style="margin-top:10px" data-action="flip-card" ${ready ? '' : 'disabled'}>↩️ 翻转卡片</button></div></div><div class="flip-face flip-back"><div class="eyebrow">认识这个词</div><div class="meaning-large">${escapeHtml(word.meaning)}</div><div class="example-en">${highlightWord(word.exampleEn, word.word)}</div><div class="example-cn">${escapeHtml(word.exampleCn || '')}</div>${word.hint ? `<div class="hint-box">💡 <strong>记忆小提示</strong><br>${escapeHtml(word.hint)}</div>` : ''}<div class="choice-self"><button class="btn btn-success" data-action="self-known">我认识 😊</button><button class="btn btn-warning" data-action="self-unknown">不认识 🤔</button></div></div></article>`; }

    function renderReviewSelf(word) { return `<article class="card review-card"><div class="eyebrow">复习一下</div>${visualBlock(word)}<div class="word-big">${escapeHtml(word.word)}</div><div class="phonetic">${escapeHtml(word.phonetic || '')}</div><div class="muted small" style="margin-top:9px">先想一想它是什么意思</div><div class="self-grid"><button class="btn btn-success" data-action="review-self" data-known="true">记得 😊</button><button class="btn btn-warning" data-action="review-self" data-known="false">不太记得 🤔</button></div><button class="btn btn-ghost" style="margin-top:10px" data-action="speak-current">🔊 听一遍</button></article>`; }
    function makeQuiz(word) { const otherMeanings = State.words.filter(item => item.id !== word.id && item.meaning).map(item => item.meaning); const fallback = ['广告', '挑战', '贡献', '庆祝', '住处，住宿', '机会', '环境', '决定']; const choices = unique([word.meaning, ...shuffle([...otherMeanings, ...fallback])]).slice(0, 4); return shuffle(choices); }

    function renderStageC(word) { const spell = State.spell || (State.spell = { mode: State.currentTask.mode || 'keyboard', value: '', tiles: shuffle(word.word.toLowerCase().split('').map((letter, index) => ({ letter, key: `${index}-${Math.random()}`, used: false }))), error: false, success: false, compare: '' }); if (spell.success) return `<article class="card spell-card spell-success"><div class="success-icon">🌟</div><h2>拼写正确！</h2><p class="muted">${escapeHtml(word.word)} 已经记住啦</p><button class="btn btn-success btn-block" style="margin-top:28px" data-action="next-word">继续下一个 →</button></article>`; return `<article class="card spell-card"><div class="eyebrow">最后一关</div><h2 style="margin-top:8px;text-align:center">请拼写这个单词</h2><div class="spell-prompt"><div class="meaning-large">${escapeHtml(word.meaning)}</div>${word.exampleEn ? `<div class="spell-example">${highlightBlank(word.exampleEn, word.word)}</div>` : ''}<div class="phonetic" style="margin-top:12px">${escapeHtml(word.phonetic || '')}</div></div><div class="mode-toggle"><button class="mode-btn ${spell.mode === 'keyboard' ? 'active' : ''}" data-action="spell-mode" data-mode="keyboard">⌨️ 键盘输入</button><button class="mode-btn ${spell.mode === 'drag' ? 'active' : ''}" data-action="spell-mode" data-mode="drag">🔤 拖拽字母</button></div>${spell.mode === 'keyboard' ? `<input class="input spell-input ${spell.error ? 'error' : ''}" data-input="spell-value" value="${escapeHtml(spell.value)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词" aria-label="拼写答案">` : `<div class="drag-slots">${word.word.split('').map((_, i) => `<span class="slot ${spell.value[i] ? 'filled' : ''}">${escapeHtml(spell.value[i] || '')}</span>`).join('')}</div><div class="letter-bank">${spell.tiles.map(tile => `<button class="letter-tile ${tile.used ? 'used' : ''}" data-action="pick-letter" data-key="${escapeHtml(tile.key)}" ${tile.used ? 'disabled' : ''}>${escapeHtml(tile.letter)}</button>`).join('')}</div>`}<div class="spell-actions"><button class="btn btn-secondary" data-action="spell-hint" ${State.currentTask.hintCount >= 3 ? 'disabled' : ''}>💡 提示 ${State.currentTask.hintCount ? `(${State.currentTask.hintCount}/3)` : ''}</button><button class="btn btn-primary" data-action="check-spell">检查答案</button></div>${spell.error ? `<div class="compare">${compareSpelling(spell.value, word.word)}</div><div class="feedback-bad" style="text-align:center;margin-top:11px;font-weight:800">再试一次 💪 ${State.currentTask.spellAttempts >= 3 ? '这个单词有点难，我们明天再练。' : ''}</div>` : '<div class="muted tiny" style="text-align:center;margin-top:14px">拼写正确才能过关，可以无限次尝试</div>'}</article>`; }
    function highlightBlank(sentence = '', word = '') { return escapeHtml(sentence).replace(new RegExp(`_{2,}|${escapeHtml(word)}`, 'ig'), '____'); }
    function compareSpelling(answer, correct) { const raw = String(answer || ''); const a = raw.toLowerCase(); const letters = correct.split('').map((letter, i) => a[i] === letter ? `<span class="letter-right">${escapeHtml(letter)}</span>` : `<span class="letter-wrong">${escapeHtml(a[i] || '·')}</span>`).join(''); return `<div class="compare-label">你的输入：<strong>${escapeHtml(raw || '（未输入）')}</strong><br>正确拼写：<strong>${escapeHtml(correct)}</strong></div><div>${letters}</div>`; }

    async function markSelfKnown(known) { const word = currentWord(); const patch = known ? { lastReview: Date.now() } : { status: 'struggling', errorCount: (word.errorCount || 0) + 1, lastReview: Date.now(), nextReview: tomorrowStart() }; if (!known) await Scheduler.updateWord(word, patch); State.currentTask.selfKnown = known; if (State.currentTask.stage === 'R') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } else { State.currentTask.stage = 'B'; State.stageAFlipped = true; State.stageB = null; renderLearning(); } }

    function renderAdminOverview() { const s = profileStats(); const week = weekStats(); const hard = [...State.words].sort((a,b) => (b.errorCount || 0) - (a.errorCount || 0)).slice(0,5); return `<div class="admin-layout"><div class="stack"><section class="card card-pad"><div class="row between"><div><div class="eyebrow">本周表现</div><h1 style="margin-top:7px">${week.completed}<span style="font-size:18px;color:var(--text-secondary)"> / 30 个词</span></h1></div><div style="font-size:43px">🌈</div></div><div class="canvas-wrap" style="margin-top:20px"><canvas id="weeklyChart" width="800" height="360"></canvas></div></section><section class="card card-pad"><div class="row between" style="margin-bottom:13px"><h2>易错词 Top 5</h2><span class="badge orange">只用于排序</span></div>${hard.length ? `<div class="word-list">${hard.map((word, index) => `<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--border)"><div class="row"><span style="width:24px;color:var(--text-secondary);font-weight:800">${index + 1}</span>${wordVisual(word)}<div><strong>${escapeHtml(word.word)}</strong><div class="muted tiny" style="margin-top:3px">${escapeHtml(word.meaning)}</div></div></div><span class="badge orange">${word.errorCount || 0} 次</span></div>`).join('')}</div>` : '<div class="empty">还没有错误记录，继续保持！</div>'}</section></div><div class="stack"><section class="streak-row"><div class="stat"><div class="stat-number">${State.words.length}</div><div class="stat-label">词库总量</div></div><div class="stat"><div class="stat-number">${s.mastered}</div><div class="stat-label">已掌握</div></div><div class="stat"><div class="stat-number">${s.minutes}</div><div class="stat-label">学习分钟</div></div></section><section class="card card-pad"><div class="eyebrow">连续打卡</div><div class="hero-number" style="color:var(--text);font-size:42px;margin-top:9px">${s.streak}<span style="color:var(--text-secondary)"> 天</span></div><p class="muted small" style="margin-top:8px">${s.streak >= 3 ? '太棒了，已经获得三日坚持徽章！' : '完成每     function parseBatch(text) { const lines = String(text || '').split(/\r?\n/); const records = []; let current = null; const flush = () => { if (current?.word) { current.meaning = current.meaning.trim(); current.exampleEn = current.exampleEn.trim(); current.exampleCn = current.exampleCn.trim(); current.emoji = current.emoji || getEmoji(current.meaning); records.push(current); } current = null; }; const splitExample = (value) => { const match = String(value || '').match(/[\u3400-\u9fff]/); if (!match) return { en: String(value || '').trim(), cn: '' }; return { en: String(value).slice(0, match.index).trim(), cn: String(value).slice(match.index).trim() }; }; for (const raw of lines) { const line = raw.trim(); if (!line) continue; const start = line.match(/^([A-Za-z][A-Za-z'-]*)\s+(\/[^/]+\/)\s+(.+)$/); if (start && !line.startsWith('例句')) { flush(); const rest = start[3]; const exampleIndex = rest.indexOf('例句:'); current = { word: start[1], phonetic: start[2], meaning: exampleIndex >= 0 ? rest.slice(0, exampleIndex).trim() : rest.trim(), exampleEn: '', exampleCn: '', emoji: '', hint: '' }; if (exampleIndex >= 0) { const parsed = splitExample(rest.slice(exampleIndex + 3)); current.exampleEn = parsed.en; current.exampleCn = parsed.cn; } continue; } if (!current) continue; if (line.startsWith('例句:')) { const parsed = splitExample(line.slice(3)); current.exampleEn = parsed.en; current.exampleCn = parsed.cn; } else if (current.exampleEn || current.exampleCn) { const parsed = splitExample(`${current.exampleEn} ${line}`); current.exampleEn = parsed.en; current.exampleCn = current.exampleCn || parsed.cn; } else current.meaning += ` ${line}`; } flush(); return records; }

    /**
     * 解析批量词库输入：支持“单词 /音标/ 释义”、 “单词 释义”以及只有英文单词的写法。
     * 只有英文单词时先识别出来，但不会凭空生成中文释义，避免孩子学到错误内容。
     */
    function parseBatchInput(text) {
      const lines = String(text || '').split(/\r?\n/);
      const records = [];
      let current = null;
      const makeRecord = (word, phonetic = '', meaning = '') => ({ word, phonetic, meaning, exampleEn: '', exampleCn: '', emoji: '', hint: '' });
      const splitExample = (value) => {
        const input = String(value || '');
        const match = input.match(/[\u3400-\u9fff]/);
        return match ? { en: input.slice(0, match.index).trim(), cn: input.slice(match.index).trim() } : { en: input.trim(), cn: '' };
      };
      const flush = () => {
        if (!current?.word) return;
        current.meaning = current.meaning.trim();
        current.exampleEn = current.exampleEn.trim();
        current.exampleCn = current.exampleCn.trim();
        current.emoji = current.emoji || getEmoji(current.meaning);
        records.push(current);
        current = null;
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        const formal = line.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)\s+(\/[^/]+\/)(?:\s+(.+))?$/);
        if (formal && !line.startsWith('例句:')) {
          flush();
          const rest = formal[3] || '';
          const exampleIndex = rest.indexOf('例句:');
          current = makeRecord(formal[1], formal[2], exampleIndex >= 0 ? rest.slice(0, exampleIndex) : rest);
          if (exampleIndex >= 0) {
            const parsed = splitExample(rest.slice(exampleIndex + 3));
            current.exampleEn = parsed.en;
            current.exampleCn = parsed.cn;
          }
          continue;
        }
        const wordWithChinese = line.match(/^([a-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)\s+(.+[\u3400-\u9fff].*)$/);
        if (wordWithChinese && !line.startsWith('例句:')) {
          flush();
          const rest = wordWithChinese[2];
          const exampleIndex = rest.indexOf('例句:');
          current = makeRecord(wordWithChinese[1], '', exampleIndex >= 0 ? rest.slice(0, exampleIndex) : rest);
          if (exampleIndex >= 0) {
            const parsed = splitExample(rest.slice(exampleIndex + 3));
            current.exampleEn = parsed.en;
            current.exampleCn = parsed.cn;
          }
          continue;
        }
        if (current && (current.exampleEn || current.exampleCn)) {
          const parsed = splitExample(`${current.exampleEn} ${line}`);
          current.exampleEn = parsed.en;
          current.exampleCn = current.exampleCn || parsed.cn;
          continue;
        }
        const wordOnly = line.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)$/);
        if (wordOnly) {
          flush();
          current = makeRecord(wordOnly[1]);
          continue;
        }
        if (!current) continue;
        if (line.startsWith('例句:')) {
          const parsed = splitExample(line.slice(3));
          current.exampleEn = parsed.en;
          current.exampleCn = parsed.cn;
        } else if (current.exampleEn || current.exampleCn) {
          const parsed = splitExample(`${current.exampleEn} ${line}`);
          current.exampleEn = parsed.en;
          current.exampleCn = current.exampleCn || parsed.cn;
        } else {
          current.meaning += ` ${line}`;
        }
      }
      flush();
      return records;
    }

    async function saveBatchInput() {
      const incomplete = State.batchPreview.filter(item => !item.meaning.trim());
      if (incomplete.length) {
        showToast(`${incomplete.length} 个单词已识别，但缺少中文释义，请补充后再录入`);
        return;
      }
      await saveBatch();
    }

    /* ==================== 每周五检测 ==================== */
    const DAY_MS = 86400000;
    function isFriday() { return new Date(`${State.today}T12:00:00`).getDay() === 5; }
    /** 取最近已经学习过的 30 个词；周五优先使用上一自然周，不足时再用更早记录补齐。 */
    function getWeeklyTestWords() {
      const today = dateStart(State.today);
      const currentDay = (new Date(`${State.today}T12:00:00`).getDay() + 6) % 7;
      const currentWeekStart = today - currentDay * DAY_MS;
      const previousWeekStart = currentWeekStart - 7 * DAY_MS;
      const previousWeekIds = State.logs.filter(log => { const stamp = dateStart(log.date); return stamp >= previousWeekStart && stamp < currentWeekStart; }).flatMap(log => [...(log.wordsStudied || []), ...(log.wordsReviewed || [])]);
      const olderIds = State.logs.filter(log => dateStart(log.date) < today).sort((a, b) => dateStart(b.date) - dateStart(a.date)).flatMap(log => [...(log.wordsStudied || []), ...(log.wordsReviewed || [])]);
      const ids = unique([...previousWeekIds, ...olderIds]).slice(0, 30);
      return ids.map(id => State.words.find(word => word.id === id)).filter(Boolean);
    }
    function renderWeeklyTestCard(words) {
      if (!isFriday()) return '';
      const log = currentLog();
      if (log?.weeklyTestCompleted) return `<section class="card card-pad" style="background:linear-gradient(135deg,#ebfff0,#fff)"><div class="row between"><div><div class="eyebrow" style="color:var(--success)">周五检测</div><h3 style="margin-top:7px">本周检测已完成 ✅</h3><p class="muted small" style="margin-top:6px">意思 ${log.weeklyTestMeaningScore || 0}/${words.length} · 首次拼写正确 ${log.weeklyTestSpellingScore || 0}/${words.length}</p></div><div style="font-size:36px">🏆</div></div></section>`;
      if (!words.length) return `<section class="card card-pad"><div class="eyebrow">周五检测</div><h3 style="margin-top:7px">还没有可检测的词</h3><p class="muted small" style="margin-top:6px">先学习一些单词，下周五就可以参加检测啦。</p></section>`;
      return `<section class="card card-pad weekly-test-card"><div class="row between"><div><div class="eyebrow" style="color:var(--warning)">周五检测</div><h3 style="margin-top:7px">检测前面学过的 ${words.length} 个词</h3><p class="muted small" style="margin-top:6px">每个词都要答出中文意思，并完成拼写。</p></div><div style="font-size:38px">📝</div></div><button class="btn btn-warning btn-block" style="margin-top:16px" data-action="start-weekly-test">开始周测 →</button></section>`;
    }
    function weeklyCurrentWord() { return State.words.find(word => word.id === State.weeklyTest?.ids[State.weeklyTest?.index]); }
    function startWeeklyTest() {
      const words = getWeeklyTestWords();
      if (!words.length) { showToast('还没有足够的学习记录'); return; }
      State.weeklyTest = { ids: words.map(word => word.id), index: 0, stage: 'meaning', choices: null, selected: null, correct: null, meaningScore: 0, spellingScore: 0, spellingAttempts: 0, spellValue: '', spellError: false, spellCorrect: false };
      Router.navigate('/test');
    }
    function renderWeeklyTest() {
      const test = State.weeklyTest;
      const word = weeklyCurrentWord();
      if (!test || !word) return `<section class="screen"><div class="card card-pad" style="margin-top:25vh;text-align:center"><div style="font-size:54px">📝</div><h2 style="margin-top:13px">周五单词检测</h2><p class="muted" style="margin-top:9px">请从首页进入本周检测。</p><button class="btn btn-primary btn-block" style="margin-top:18px" data-action="navigate" data-path="/learn">返回首页</button></div></section>`;
      const progress = `${test.index + 1} / ${test.ids.length}`;
      if (test.stage === 'meaning') {
        if (!test.choices) test.choices = makeQuiz(word);
        return `<section class="screen"><div class="learn-top exit-row"><button class="btn btn-ghost" data-action="exit-weekly-test">← 退出</button><span class="step-label">周五检测 · 意思</span><span class="badge orange">${progress}</span></div><article class="card quiz-card"><div class="eyebrow">第一项：知道意思</div><h2 style="margin-top:8px">${escapeHtml(word.word)} 是什么意思？</h2><div class="quiz-visual">${visualBlock(word, 'visual-word')}<div class="quiz-word">${escapeHtml(word.word)}</div></div><div class="quiz-options">${test.choices.map((choice, index) => { const isCorrect = choice === word.meaning; const cls = test.correct !== null && isCorrect ? 'correct' : test.selected === choice && test.correct === false ? 'wrong' : ''; return `<button class="quiz-option ${cls}" data-action="weekly-meaning-answer" data-choice="${escapeHtml(choice)}" ${test.correct !== null ? 'disabled' : ''}><span class="option-letter">${String.fromCharCode(65 + index)}</span><span>${escapeHtml(choice)}</span>${isCorrect && test.correct !== null ? '<span style="margin-left:auto">✓</span>' : ''}</button>`; }).join('')}</div><div class="quiz-feedback ${test.correct === true ? 'feedback-good' : test.correct === false ? 'feedback-bad' : ''}">${test.correct === true ? '回答正确！进入拼写检测。' : test.correct === false ? `正确答案是“${escapeHtml(word.meaning)}”，记住它，再进入拼写。` : '请选择一个答案'}</div>${test.correct !== null ? '<button class="btn btn-primary btn-block" style="margin-top:12px" data-action="weekly-meaning-continue">进入拼写 →</button>' : ''}</article></section>`;
      }
      return `<section class="screen"><div class="learn-top exit-row"><button class="btn btn-ghost" data-action="exit-weekly-test">← 退出</button><span class="step-label">周五检测 · 拼写</span><span class="badge orange">${progress}</span></div><article class="card spell-card"><div class="eyebrow">第二项：完成拼写</div><h2 style="margin-top:8px;text-align:center">请拼写这个单词</h2><div class="spell-prompt"><div class="meaning-large">${escapeHtml(word.meaning)}</div>${word.exampleEn ? `<div class="spell-example">${highlightBlank(word.exampleEn, word.word)}</div>` : ''}<div class="phonetic" style="margin-top:12px">${escapeHtml(word.phonetic || '')}</div></div>${test.spellCorrect ? '<div class="success-icon" style="font-size:55px">✅</div><h3 style="text-align:center;color:var(--success);margin-top:8px">拼写正确</h3><button class="btn btn-success btn-block" style="margin-top:20px" data-action="weekly-next-word">下一个 →</button>' : `<input class="input spell-input ${test.spellError ? 'error' : ''}" data-input="weekly-spell" value="${escapeHtml(test.spellValue)}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词" aria-label="周测拼写答案"><button class="btn btn-primary btn-block" style="margin-top:14px" data-action="weekly-check-spell">检查拼写</button>${test.spellError ? `<div class="compare">${compareSpelling(test.spellValue, word.word)}</div><div class="feedback-bad" style="text-align:center;margin-top:11px;font-weight:800">还差一点，再试一次。</div>` : '<div class="muted tiny" style="text-align:center;margin-top:13px">必须拼写正确才能通过这个词。</div>'}`}</article></section>`;
    }
    async function completeWeeklyTest() {
      const test = State.weeklyTest;
      const log = currentLog() || { date: State.today, wordsStudied: [], wordsReviewed: [], durationMinutes: 0, plannedNew: [], plannedReview: [] };
      log.weeklyTestCompleted = true;
      log.weeklyTestMeaningScore = test.meaningScore;
      log.weeklyTestSpellingScore = test.spellingScore;
      await DB.put('dailyLog', log);
      State.logs = await DB.all('dailyLog');
      State.weeklyTest = null;
      Router.navigate('/learn');
      setTimeout(() => { Animations.confetti(); showToast('周五检测完成！下周继续加油 🌟'); }, 350);
    }
    async function advanceWeeklyTest() {
      const test = State.weeklyTest;
      if (!test) return;
      if (test.index + 1 >= test.ids.length) { await completeWeeklyTest(); return; }
      test.index++;
      test.stage = 'meaning';
      test.choices = null;
      test.selected = null;
      test.correct = null;
      test.spellingAttempts = 0;
      test.spellValue = '';
      test.spellError = false;
      test.spellCorrect = false;
      renderWeeklyTest();
    }

gle-sound" aria-label="切换语音"><i></i></button></div><div class="switch-line"><div><strong>朗读速度</strong><div class="muted tiny" style="margin-top:4px">选择适合自己的节奏</div></div><select class="select" style="width:130px;min-height:42px" data-input="speech-rate"><option value="slow" ${State.settings.speechRate === 'slow' ? 'selected' : ''}>慢一点</option><option value="normal" ${State.settings.speechRate === 'normal' ? 'selected' : ''}>正常</option><option value="fast" ${State.settings.speechRate === 'fast' ? 'selected' : ''}>快一点</option></select></div></section><section class="card card-pad"><div class="row between"><div><h3>学习工具</h3><p class="muted small" style="margin-top:6px">录入词库、查看看板和备份数据</p></div><button class="btn btn-secondary" data-action="open-admin-tab" data-tab="overview">打开工具</button></div></section><p class="privacy-note">学习记录保存在这台设备上。在线补全、拍照识别和正规词典参考需要联网。</p></div>${navBar()}</section>`;
    }

    /* ==================== 在线补全与拍照识别 ==================== */
    const DICTIONARY_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
    const TRANSLATION_API = 'https://api.mymemory.translated.net/get';
    const OCR_API = 'https://api.ocr.space/parse/image';
    const WIKIMEDIA_IMAGE_API = 'https://commons.wikimedia.org/w/api.php';
    const ONLINE_CACHE_KEY = 'PETOnlineLookupCacheV2';
    const CAMBRIDGE_REFERENCE = 'https://dictionary.cambridge.org/dictionary/english/';
    // OCR.Space 的公开测试额度只适合个人试用；正式长期使用建议换成自己的服务端代理。
    const OCR_TEST_KEY = 'helloworld';

    function readOnlineCache() { try { return JSON.parse(localStorage.getItem(ONLINE_CACHE_KEY) || '{"translations":{},"dictionary":{}}'); } catch (_) { return { translations: {}, dictionary: {} }; } }
    function writeOnlineCache(cache) { try { localStorage.setItem(ONLINE_CACHE_KEY, JSON.stringify(cache)); } catch (_) {} }
    const ONLINE_CACHE = readOnlineCache();

    /** 调用在线翻译服务并缓存结果，重复录入相同词语时不再重新请求。 */
    async function translateOnline(text) {
      const value = String(text || '').trim();
      if (!value || navigator.onLine === false) return '';
      const cache = ONLINE_CACHE;
      const cacheKey = `en-zh:${value.toLowerCase()}`;
      if (cache.translations?.[cacheKey]) return cache.translations[cacheKey];
      try {
        const response = await fetch(`${TRANSLATION_API}?q=${encodeURIComponent(value)}&langpair=en|zh-CN`);
        if (!response.ok) return '';
        const payload = await response.json();
        const translated = String(payload?.responseData?.translatedText || '').trim();
        if (translated) { cache.translations = cache.translations || {}; cache.translations[cacheKey] = translated; writeOnlineCache(cache); }
        return translated;
      } catch (_) { return ''; }
    }

    /** 在线词典没有提供例句时，生成一个明确标注为辅助用法的英文例句。 */
    function fallbackExampleEn(term, definition = '') { const cleanDefinition = String(definition || '').replace(/[.。]+$/, '').trim(); return cleanDefinition ? `The word "${term}" means ${cleanDefinition}.` : `I learned how to use "${term}" in an English sentence today.`; }
    function fallbackExampleCn(item) { return item.meaning ? `这个例句帮助理解“${item.meaning}”的用法。` : `今天我学习了“${item.word}”这个英语表达。`; }

    /** 从词典读取英文语境资料；中文释义优先翻译词典定义，减少孤立机器翻译造成的歧义。 */
    async function lookupWordOnline(item) {
      const term = String(item.word || '').trim();
      if (!term) return item;
      let entry = null;
      const isSingleWord = /^[A-Za-z]+(?:['-][A-Za-z]+)?$/.test(term);
      if (isSingleWord && navigator.onLine !== false) {
        try {
          const cache = ONLINE_CACHE;
          const cacheKey = term.toLowerCase();
          if (cache.dictionary?.[cacheKey]) entry = cache.dictionary[cacheKey];
          else {
            const response = await fetch(`${DICTIONARY_API}${encodeURIComponent(term)}`);
            if (response.ok) {
              const payload = await response.json();
              entry = Array.isArray(payload) ? payload[0] : null;
              if (entry) { cache.dictionary = cache.dictionary || {}; cache.dictionary[cacheKey] = entry; writeOnlineCache(cache); }
            }
          }
        } catch (_) {}
      }
      const phonetic = entry?.phonetic || entry?.phonetics?.find(item => item.text)?.text || '';
      const definitions = entry?.meanings?.flatMap(meaning => meaning.definitions || []) || [];
      const definition = definitions.find(item => item.definition)?.definition || '';
      const example = definitions.find(item => item.example)?.example || '';
      if (!item.phonetic && phonetic) item.phonetic = phonetic;
      if (!item.exampleEn) item.exampleEn = example || fallbackExampleEn(term, definition);
      if (!item.meaning) item.meaning = definition ? await translateOnline(definition) : await translateOnline(term);
      if (!item.exampleCn && item.exampleEn) item.exampleCn = await translateOnline(item.exampleEn);
      if (!item.exampleCn) item.exampleCn = fallbackExampleCn(item);
      item.emoji = item.emoji || getEmoji(item.meaning);
      item.referenceUrl = `${CAMBRIDGE_REFERENCE}${encodeURIComponent(term.toLowerCase().replace(/\s+/g, '-'))}`;
      return item;
    }

    /** 以固定并发数批量查询，避免 17 个词逐个排队等待。 */
    async function mapOnlineWithConcurrency(items, worker, limit = 6) {
      let cursor = 0;
      const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (cursor < items.length) {
          const index = cursor++;
          await worker(items[index], index);
        }
      });
      await Promise.all(workers);
    }

    /** 批量为识别出的单词或词组自动补全资料；缓存加并发后通常可在十秒左右完成一批。 */
    async function lookupBatchOnline() {
      if (!State.batchPreview.length || State.batchLookupRunning) return;
      State.batchLookupRunning = true;
      render();
      const status = $('[data-online-status]');
      if (status) status.textContent = '正在联网补全中文释义、音标和例句，请稍候…';
      let filled = 0;
      try {
        let completed = 0;
        await mapOnlineWithConcurrency(State.batchPreview, async (item) => {
          const before = `${item.meaning}|${item.phonetic}|${item.exampleEn}|${item.exampleCn}`;
          await lookupWordOnline(item);
          if (before !== `${item.meaning}|${item.phonetic}|${item.exampleEn}|${item.exampleCn}`) filled++;
          completed++;
          const progress = $('[data-online-status]');
          if (progress) progress.textContent = `正在补全 ${completed}/${State.batchPreview.length}，完成后可直接确认录入…`;
        }, 6);
        render();
        showToast(filled ? `在线补全完成：更新了 ${filled} 个词` : '暂时没有找到更多资料，请检查网络或手动补充');
      } catch (_) {
        showToast('在线补全失败，请检查网络后重试');
      } finally {
        State.batchLookupRunning = false;
        render();
        const nextStatus = $('[data-online-status]');
        if (nextStatus) nextStatus.textContent = '在线资料仅作辅助，请录入前快速确认释义。';
      }
    }

    /** 为逐条录入表单自动填充资料。 */
    async function lookupFormOnline(form) {
      const wordInput = form?.querySelector('[name="word"]');
      if (!wordInput?.value.trim()) { showToast('请先输入英文单词或词组'); return; }
      const button = form.querySelector('[data-action="lookup-form"]');
      if (button) { button.disabled = true; button.textContent = '正在查找…'; }
      const item = { word: wordInput.value.trim(), phonetic: form.querySelector('[name="phonetic"]')?.value.trim() || '', meaning: form.querySelector('[name="meaning"]')?.value.trim() || '', exampleEn: form.querySelector('[name="exampleEn"]')?.value.trim() || '', exampleCn: form.querySelector('[name="exampleCn"]')?.value.trim() || '', emoji: form.querySelector('[name="emoji"]')?.value.trim() || '', hint: form.querySelector('[name="hint"]')?.value.trim() || '' };
      await lookupWordOnline(item);
      for (const name of ['phonetic', 'meaning', 'exampleEn', 'exampleCn', 'emoji']) { const input = form.querySelector(`[name="${name}"]`); if (input && item[name]) input.value = item[name]; }
      if (button) { button.disabled = false; button.textContent = '🌐 在线补全'; }
      showToast(item.meaning ? '在线资料已填入，请确认后保存' : '没有找到中文释义，请检查拼写');
    }

    /** 将照片上传到 OCR 服务并把识别结果放入批量输入框。上传前必须由使用者确认。 */
    async function recognizeVocabularyPhoto(file) {
      if (!file || !file.type.startsWith('image/')) { showToast('请选择一张图片'); return; }
      if (!confirm('这张照片会上传到在线 OCR 服务，仅用于识别图片中的英文。是否继续？')) return;
      State.ocrStatus = '正在识别照片，请保持网络连接…';
      render();
      try {
        const form = new FormData();
        form.append('file', file, file.name || 'vocabulary.jpg');
        form.append('language', 'eng');
        form.append('OCREngine', '2');
        form.append('isOverlayRequired', 'false');
        const response = await fetch(OCR_API, { method: 'POST', headers: { apikey: OCR_TEST_KEY }, body: form });
        if (!response.ok) throw new Error(`OCR ${response.status}`);
        const payload = await response.json();
        const text = (payload?.ParsedResults || []).map(result => result.ParsedText || '').join('\n').replace(/\r/g, '').split('\n').map(line => line.replace(/^\s*(?:\d+[.)、]|[-•])\s*/, '').trim()).filter(Boolean).join('\n');
        if (!text) throw new Error(payload?.ErrorMessage || '没有识别到文字');
        State.batchText = [State.batchText.trim(), text].filter(Boolean).join('\n');
        State.ocrStatus = `已识别 ${text.split(/\s+/).filter(Boolean).length} 个文字片段，请点击“解析并预览”，再自动补全中文资料。`;
        render();
        showToast('照片识别完成');
      } catch (error) {
        State.ocrStatus = '照片识别失败。请换一张清晰、光线均匀的英文词表照片，或使用 iPad 的“实况文本”复制。';
        render();
        showToast('在线 OCR 暂时不可用');
      }
    }

    /** 录入页同时支持拍照、批量粘贴和逐条在线补全。 */
    function renderAdminAdd() {
      const edit = State.editingWordId ? State.words.find(word => word.id === State.editingWordId) : null;
      const preview = State.batchPreview.length ? `<div class="preview-list" style="margin-top:15px">${State.batchPreview.map(item => `<div class="preview-item"><div class="row between"><strong>${escapeHtml(item.emoji || getEmoji(item.meaning))} ${escapeHtml(item.word)}</strong>${statusBadge({ status:'new' })}</div><div class="muted small" style="margin-top:5px">${escapeHtml(item.meaning)}</div>${item.phonetic ? `<div class="tiny" style="margin-top:5px">音标：${escapeHtml(item.phonetic)}</div>` : ''}${item.exampleEn ? `<div class="tiny" style="margin-top:5px">例句：${escapeHtml(item.exampleEn)}${item.exampleCn ? ` · ${escapeHtml(item.exampleCn)}` : ''}</div>` : '<div class="tiny" style="margin-top:5px;color:var(--warning)">暂未找到例句</div>'}${item.referenceUrl ? `<a class="tiny" href="${escapeHtml(item.referenceUrl)}" target="_blank" rel="noopener">📖 Cambridge 词典参考</a>` : ''}</div>`).join('')}</div>` : '';
      return `<div class="admin-layout"><div class="stack"><section class="card card-pad"><div class="eyebrow">📷 拍照识别</div><h2 style="margin-top:7px">拍下英文词表</h2><p class="muted small" style="line-height:1.65;margin-top:9px">可以拍照或从相册选择，识别出的英文单词和词组会放入下面的批量输入框。</p><label class="btn btn-primary btn-block" style="margin-top:15px">📷 拍照 / 选择图片<input type="file" accept="image/*" capture="environment" data-input="ocr-file" hidden></label><div class="tiny muted" data-ocr-status style="margin-top:11px">${escapeHtml(State.ocrStatus || '上传前会先询问你是否同意，照片不会自动上传。')}</div></section><section class="card card-pad"><div class="row between"><div><div class="eyebrow">批量录入</div><h2 style="margin-top:7px">每行一个单词或词组</h2></div><span class="badge blue">在线补全</span></div><textarea class="textarea" style="margin-top:15px" data-input="batch-text" placeholder="a variety of\npublic transport\naccommodation /əˌkɒməˈdeɪʃn/ 住处，住宿\n例句: The hotel provides accommodation. 这家酒店提供住宿。">${escapeHtml(State.batchText)}</textarea><div class="row wrap" style="margin-top:12px"><button class="btn btn-secondary" data-action="parse-batch">解析并预览</button>${State.batchPreview.length ? `<button class="btn btn-primary" data-action="lookup-batch" ${State.batchLookupRunning ? 'disabled' : ''}>${State.batchLookupRunning ? '补全中…' : '🌐 在线补全'}</button><button class="btn btn-success" data-action="save-batch" ${State.batchLookupRunning ? 'disabled' : ''}>确认录入 ${State.batchPreview.length} 个</button>` : ''}</div>${State.batchPreview.length ? `<div class="tiny muted" data-online-status style="margin-top:10px">会通过网络查询资料，请录入前快速确认释义。</div>` : ''}${preview}</section></div><section class="card card-pad"><div class="eyebrow">${edit ? '编辑单词' : '逐条添加'}</div><h2 style="margin-top:7px">${edit ? `编辑 ${escapeHtml(edit.word)}` : '手动录入'}</h2><form id="wordForm" class="field-grid" style="margin-top:16px"><input type="hidden" name="id" value="${edit?.id || ''}"><label class="field"><span>英文单词或词组 *</span><input class="input" name="word" required value="${escapeHtml(edit?.word || '')}" placeholder="例如 a variety of"></label><div class="field-grid two"><label class="field"><span>音标</span><input class="input" name="phonetic" value="${escapeHtml(edit?.phonetic || '')}" placeholder="自动补全"></label><label class="field"><span>中文释义 *</span><input class="input" name="meaning" required value="${escapeHtml(edit?.meaning || '')}" placeholder="点击在线补全"></label></div><label class="field"><span>英文例句</span><textarea class="textarea" style="min-height:90px" name="exampleEn" placeholder="在线词典有例句时会自动填入">${escapeHtml(edit?.exampleEn || '')}</textarea></label><label class="field"><span>中文翻译</span><input class="input" name="exampleCn" value="${escapeHtml(edit?.exampleCn || '')}" placeholder="自动翻译"></label><div class="field-grid two"><label class="field"><span>图片 URL（可选）</span><input class="input" name="imageUrl" value="${escapeHtml(edit?.imageUrl || '')}" placeholder="https://..."></label><label class="field"><span>Emoji</span><input class="input" name="emoji" value="${escapeHtml(edit?.emoji || '')}" placeholder="自动匹配"></label></div><label class="field"><span>记忆提示</span><textarea class="textarea" style="min-height:80px" name="hint" placeholder="词根拆解或联想故事">${escapeHtml(edit?.hint || '')}</textarea></label><div class="row wrap"><button class="btn btn-secondary" type="button" data-action="lookup-form">🌐 在线补全</button><button class="btn btn-primary" type="submit">${edit ? '保存修改' : '加入词库'}</button>${edit ? '<button class="btn btn-secondary" type="button" data-action="cancel-edit">取消</button>' : ''}</div></form></section></div>`;
    }

    /** 新增图片入口：本地相册/相机图片保存在词条中，在线图片链接仍可继续使用。 */
    function renderAdminAdd() {
      const edit = State.editingWordId ? State.words.find(word => word.id === State.editingWordId) : null;
      const preview = State.batchPreview.length ? `<div class="preview-list" style="margin-top:15px">${State.batchPreview.map(item => `<div class="preview-item"><div class="row between"><strong>${escapeHtml(item.emoji || getEmoji(item.meaning))} ${escapeHtml(item.word)}</strong>${statusBadge({ status:'new' })}</div><div class="muted small" style="margin-top:5px">${escapeHtml(item.meaning)}</div>${item.phonetic ? `<div class="tiny" style="margin-top:5px">音标：${escapeHtml(item.phonetic)}</div>` : ''}${item.exampleEn ? `<div class="tiny" style="margin-top:5px">例句：${escapeHtml(item.exampleEn)}${item.exampleCn ? ` · ${escapeHtml(item.exampleCn)}` : ''}</div>` : '<div class="tiny" style="margin-top:5px;color:var(--warning)">暂未找到例句</div>'}${item.referenceUrl ? `<a class="tiny" href="${escapeHtml(item.referenceUrl)}" target="_blank" rel="noopener">📖 Cambridge 词典参考</a>` : ''}<div class="tiny muted" style="margin-top:7px">录入后可在“编辑”中添加专属学习图片。</div></div>`).join('')}</div>` : '';

    function renderAdminBackup() { return `<div class="admin-layout"><section class="card card-pad"><div class="eyebrow">数据备份</div><h2 style="margin-top:7px">带走你的学习记录</h2><p class="muted" style="line-height:1.7;margin-top:10px">导出文件包含词库、学习设置和每日记录。建议每隔一段时间备份一次。</p><button class="btn btn-primary btn-block" style="margin-top:18px" data-action="export-data">⬇️ 导出 JSON 备份</button></section><section class="card card-pad"><div class="eyebrow">数据恢复</div><h2 style="margin-top:7px">从备份继续</h2><p class="muted" style="line-height:1.7;margin-top:10px">选择之前导出的 JSON 文件，然后选择覆盖、跳过重复或合并更新。</p><label class="btn btn-secondary btn-block" style="margin-top:18px">⬆️ 选择 JSON 文件<input type="file" accept=".json,application/json" data-input="import-file" hidden></label><div class="notice" style="margin-top:14px">小提示：恢复数据会影响本机当前词库，操作前可以先导出一份当前备份。</div></section></div>`; }

      if (action === 'review-self') { const known = target.dataset.known === 'true'; const word = currentWord(); State.currentTask.selfKnown = known; if (!known) await Scheduler.updateWord(word, { status:'struggling', errorCount:(word.errorCount || 0) + 1, nextReview: tomorrowStart() }); State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'quiz-answer') { const choice = target.dataset.choice; const correct = choice === currentWord().meaning; State.stageB.selected = choice; State.stageB.correct = correct; if (correct) { renderLearning(); setTimeout(() => { if (State.currentTask?.stage === 'B') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } }, 1500); } else { renderLearning(); } return; }

    });
    document.addEventListener('input', (event) => { const input = event.target; if (input.dataset.input === 'word-search') { State.wordSearch = input.value; render(); const box = $('[data-input="word-search"]'); box?.focus(); box?.setSelectionRange(box.value.length, box.value.length); } if (input.dataset.input === 'admin-search') { State.adminSearch = input.value; State.adminPage = 1; render(); const box = $('[data-input="admin-search"]'); box?.focus(); box?.setSelectionRange(box.value.length, box.value.length); } if (input.dataset.input === 'batch-text') State.batchText = input.value; if (input.dataset.input === 'weekly-spell' && State.weeklyTest) { State.weeklyTest.spellValue = input.value; State.weeklyTest.spellError = false; } if (input.dataset.input === 'spell-value' && State.spell) { State.spell.value = input.value; State.spell.error = false; } });

    /** 返回一个可用于成长统计的日期键集合；只把真正学习过的日期算作打卡日。 */
    function studyDaySet() {
      return new Set(State.logs.filter(log => log.completed || (log.wordsStudied || []).length || (log.wordsReviewed || []).length || (log.coinsEarned || 0) > 0).map(log => log.date));
    }
    function dateKeyFromDate(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
    function streakInfo() {
      const days = studyDaySet();
      let current = 0;
      const cursor = new Date(`${State.today}T12:00:00`);
      while (days.has(dateKeyFromDate(cursor))) { current++; cursor.setDate(cursor.getDate() - 1); }
      const ordered = [...days].sort();
      let longest = 0; let run = 0; let previous = null;
      for (const key of ordered) {
        const stamp = dateStart(key);
        if (previous !== null && stamp - previous === 86400000) run++;
        else run = 1;
        longest = Math.max(longest, run); previous = stamp;
      }
      return { current, longest, days };
    }
    /** 本周统计同时服务于首页、成长页和图表。 */
    function weekStats() {
      const now = new Date(`${State.today}T12:00:00`);
      const day = (now.getDay() + 6) % 7;
      const start = new Date(now); start.setDate(now.getDate() - day); start.setHours(0, 0, 0, 0);
      const keys = []; for (let i = 0; i < 7; i++) { const date = new Date(start); date.setDate(start.getDate() + i); keys.push(dateKeyFromDate(date)); }
      const logs = State.logs.filter(log => keys.includes(log.date));
      const studied = unique(logs.flatMap(log => log.wordsStudied || []));
      return { completed: Math.min(30, studied.length), days: logs.filter(log => log.completed || (log.wordsStudied || []).length || (log.wordsReviewed || []).length).length, keys, logs, coins: logs.reduce((sum, log) => sum + (log.coinsEarned || 0), 0) };
    }
    function growthStats() {

      return { coins: Number(State.settings.coins || 0), todayCoins: currentLog()?.coinsEarned || 0, weekCoins: week.coins, studied: unique(State.logs.flatMap(log => log.wordsStudied || [])).length, streak: streak.current, longestStreak: streak.longest, week };

      const wasReview = task.type === 'review';
      let patch = { lastReview: Date.now(), reviewCount: (word.reviewCount || 0) + (wasReview ? 1 : 0), nextReview: Scheduler.calculateNextReview(word, true) };
      if (!wasReview) patch = { ...patch, status: word.status === 'struggling' || task.spellAttempts >= 3 ? 'struggling' : (task.selfKnown ? 'learning' : 'struggling'), nextReview: tomorrowStart() };
      else if (word.status === 'struggling') patch = { ...patch, status: (word.successfulReviewStreak || 0) + 1 >= 2 ? 'learning' : 'struggling', successfulReviewStreak: (word.successfulReviewStreak || 0) + 1 };
      else if (word.status === 'learning') { const correctStreak = (word.correctStreak || 0) + 1; patch = { ...patch, correctStreak, status: correctStreak >= 3 ? 'mastered' : 'learning', nextReview: correctStreak >= 3 ? Date.now() + 3 * 86400000 : tomorrowStart(), masteredInterval: 3 }; }
      await Scheduler.updateWord(word, patch);
      let coinEarned = false;
      if (!wasReview) {
        const awarded = new Set(Array.isArray(State.settings.coinAwardedWordIds) ? State.settings.coinAwardedWordIds : []);
        if (!awarded.has(word.id)) { awarded.add(word.id); State.settings.coinAwardedWordIds = [...awarded]; State.settings.coins = Number(State.settings.coins || 0) + 1; await DB.put('settings', State.settings); coinEarned = true; }
      }
      const log = currentLog() || { date: State.today, wordsStudied: [], wordsReviewed: [], durationMinutes: 0, plannedNew: [], plannedReview: [], coinsEarned: 0 };
      const key = wasReview ? 'wordsReviewed' : 'wordsStudied'; log[key] = unique([...(log[key] || []), word.id]); log.coinsEarned = (log.coinsEarned || 0) + (coinEarned ? 1 : 0);

      log.completed = (log.wordsStudied || []).length >= (log.plannedNew || []).length && (log.wordsReviewed || []).length >= (log.plannedReview || []).length;

      const wasAwarded = awarded.has(id);
      await DB.delete('words', id);
      for (const log of State.logs) {
        const studied = log.wordsStudied || []; const reviewed = log.wordsReviewed || [];
        const next = { ...log, wordsStudied: studied.filter(item => item !== id), wordsReviewed: reviewed.filter(item => item !== id), plannedNew: (log.plannedNew || []).filter(item => item !== id), plannedReview: (log.plannedReview || []).filter(item => item !== id) };

      const newButton = newWords.length ? `<button class="btn ${newComplete ? 'btn-secondary' : 'btn-primary'} btn-block" data-action="start-task" data-type="new" ${newComplete ? 'disabled' : ''}>${newComplete ? '新词已学完' : '开始新词学习 →'}</button>` : `<button class="btn ${State.words.length ? 'btn-secondary' : 'btn-primary'} btn-block" data-action="open-admin-tab" data-tab="add">${State.words.length ? '今天没有待学新词' : '先添加学习单词 →'}</button>`;
      const reviewButton = reviewWords.length ? `<button class="btn ${!newComplete || reviewComplete ? 'btn-secondary' : 'btn-warning'} btn-block" data-action="start-task" data-type="review" ${!newComplete || reviewComplete ? 'disabled' : ''}>${reviewComplete ? '复习已完成' : !newComplete ? '完成新词后解锁' : '开始复习 →'}</button>` : '<button class="btn btn-secondary btn-block" disabled>今天没有到期复习词</button>';
      return `<section class="screen"><header class="topbar"><div class="brand-lockup"><div class="brand-mark">📗</div><div><div class="brand-title">希希词语家</div><div class="brand-subtitle">PET Vocabulary · 今日 ${escapeHtml(State.today.slice(5).replace('-', '月'))} 日</div></div></div></header><div class="stack"><section class="card hero-card"><div class="eyebrow">本周学习进度</div><div class="hero-number">${week.completed}<span> / 30 个词</span></div><div>每天一点点，词汇会长大 🌱</div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="progress-meta"><span>${week.completed ? `已经坚持 ${week.days} 天` : '今天也来学一点'}</span><span>${percent}%</span></div></section><section class="card coin-hero"><div class="eyebrow">个人打卡榜 · 我的希币</div><div class="coin-number">${growth.coins}<span> 希币</span></div><div>积分 ${growth.coins} 分 · 今天 +${growth.todayCoins} 希币</div><button class="btn" style="margin-top:15px;color:#9a5600;background:#fff" data-action="open-admin-tab" data-tab="overview">查看成长榜 →</button></section><section class="stack"><div class="section-heading"><h2>今天学什么</h2><span class="badge ${dailyDone ? 'green' : total ? 'blue' : 'orange'}">${dailyDone ? '全部完成' : total ? `${newDone + reviewDone} / ${total}` : '先添加单词'}</span></div><article class="card task-card new-task"><div class="row between"><div class="task-icon">📘</div>${newStatus}</div><div><div class="task-title">今日新学 · ${newWords.length} 个</div><div class="task-caption">${newWords.length ? '认识新朋友，完成拼写就能获得希币。' : State.words.length ? '今天没有安排新的学习词条，可以先添加新词。' : '词库里还没有单词，添加后就可以开始学习。'}</div></div>${newWords.length ? `<div class="word-preview">${newWords.map(word => escapeHtml(word.word)).join(' · ')}</div>` : ''}${newButton}</article><article class="card task-card review-task ${!newComplete ? 'locked' : ''}"><div class="row between"><div class="task-icon">📙</div>${reviewStatus}</div><div><div class="task-title">今日复习 · ${reviewWords.length} 个</div><div class="task-caption">${!newComplete ? '完成今日新词后，就能开始复习啦。' : reviewWords.length ? '把学过的单词再叫醒一次。' : '今天没有到期复习词，轻松完成！'}</div></div>${reviewButton}</article></section>${renderWeeklyTestCard(getWeeklyTestWords())}<section class="card card-pad"><div class="row between"><div><h3>${dailyDone ? '今日完成！明天见 🌟' : total ? '准备好了吗？' : '先准备学习内容吧'}</h3><p class="muted small" style="margin-top:6px">${dailyDone ? '你的学习和希币都已经被记录下来。' : total ? '每个新词完成拼写后，会获得1枚希币。' : '录入单词并配上图片后，就可以开始三步学习。'}</p></div><div style="font-size:35px">${dailyDone ? '🎉' : total ? '🧠' : '🖼️'}</div></div>${!dailyDone && total === 0 ? '<button class="btn btn-primary btn-block" style="margin-top:15px" data-action="open-admin-tab" data-tab="add">去录入词库 →</button>' : ''}</section></div>${navBar()}</section>`;
    }

    /**
     * 标准示例库：词典没有提供短语例句时，使用经过人工整理的常用表达。
     * 这些内容只作为在线词典无结果时的兜底，不会覆盖用户自己填写的例句。
     */
    const STANDARD_PHRASE_EXAMPLES = {
      'a variety of': { en: 'The library has a variety of books for children.', cn: '这家图书馆有各种各样的儿童读物。' },
      'public transport': { en: 'Many people use public transport to travel around the city.', cn: '许多人乘坐公共交通在城市里出行。' },
      'publick transport': { en: 'Many people use public transport to travel around the city.', cn: '许多人乘坐公共交通在城市里出行。' }
    };
    function standardPhraseExample(term) { return STANDARD_PHRASE_EXAMPLES[String(term || '').toLowerCase().replace(/\s+/g, ' ').trim()] || null; }
    function fallbackExampleEn(term, definition = '') {
      const phrase = standardPhraseExample(term);
      if (phrase) return phrase.en;
      const cleanDefinition = String(definition || '').replace(/[.。]+$/, '').trim();
      return cleanDefinition ? `The word "${term}" means ${cleanDefinition}.` : `I learned how to use "${term}" in an English sentence today.`;
    }
    function fallbackExampleCn(item) {
      const phrase = standardPhraseExample(item?.word);
      if (phrase) return phrase.cn;
      return item?.meaning ? `这个例句帮助理解“${item.meaning}”的用法。` : `今天我学习了“${item?.word || ''}”这个英语表达。`;
    }
    /** 保存前统一补齐截图标准中的：音标、中文释义、英文例句、中文翻译和 Emoji。 */
    function ensureBilingualExample(item) {
      item.exampleEn = String(item.exampleEn || '').trim() || fallbackExampleEn(item.word);
      item.exampleCn = String(item.exampleCn || '').trim() || fallbackExampleCn(item);
      item.emoji = String(item.emoji || '').trim() || getEmoji(item.meaning);
      return item;
    }
    /** 新词只需输入英文；保存时按截图标准自动查资料并写入完整词条。 */
    async function saveWordForm(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      const existing = data.id ? State.words.find(word => word.id === Number(data.id)) : null;
      const suppliedEmoji = String(data.emoji || '').trim();
      const imageUrl = State.wordImageDraft !== null ? State.wordImageDraft : String(data.imageUrl || '').trim();
      const imageSource = State.wordImageSource !== null ? State.wordImageSource : String(existing?.imageSource || '').trim();
      const imageTitle = State.wordImageTitle || String(existing?.imageTitle || '').trim();
      const next = {
        ...(existing || { status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, createdAt:Date.now() }),
        word: String(data.word || '').trim(),
        phonetic: String(data.phonetic || '').trim(),
        meaning: String(data.meaning || '').trim(),
        exampleEn: String(data.exampleEn || '').trim(),
        exampleCn: String(data.exampleCn || '').trim(),
        imageUrl, imageSource, imageTitle,
        // 先保持空值，等在线释义返回后再根据最终中文释义匹配 Emoji。
        emoji: suppliedEmoji,
        hint: String(data.hint || '').trim()
      };
      if (!next.word) { showToast('请先填写英文单词或词组'); return; }
      const duplicate = State.words.find(word => word.word.toLowerCase() === next.word.toLowerCase() && word.id !== next.id);
      if (duplicate) { showToast('词库里已经有这个单词啦'); return; }
      if (!next.meaning || !next.exampleEn || !next.exampleCn || !next.phonetic) {
        showToast('正在自动补全释义、音标和中英文例句…');
        await lookupWordOnline(next);
      }
      if (!next.meaning) { showToast('暂时没有查到中文释义，请检查单词拼写'); return; }
      ensureBilingualExample(next);
      if (!suppliedEmoji) next.emoji = getEmoji(next.meaning);
      await DB.put('words', next);
      State.words = await DB.all('words');
      State.editingWordId = null; State.wordImageDraft = null; State.wordImageSource = null; State.wordImageTitle = ''; State.imageStatus = '';
      await ensureDailyLog();
      showToast(existing ? '单词已更新' : '单词已加入词库');
      render();
    }
    /** 批量录入同样走统一标准，防止只识别出英文却保存出不完整词条。 */
    async function saveBatch() {
      const existingWords = new Set(State.words.map(word => word.word.toLowerCase()));
      const items = State.batchPreview;
      if (items.some(item => !item.meaning || !item.phonetic || !item.exampleEn || !item.exampleCn)) {
        showToast('正在准备每个词的释义、音标和中英文例句…');
        await mapOnlineWithConcurrency(items, async item => { await lookupWordOnline(item); ensureBilingualExample(item); }, 6);
      }
      const incomplete = items.filter(item => !String(item.meaning || '').trim());
      if (incomplete.length) {
        showToast(`${incomplete.length} 个词没有查到中文释义，暂不录入，请检查拼写或手动补充。`);
        render();
        return;
      }
      let added = 0;
      for (const item of items) {
        ensureBilingualExample(item);
        if (existingWords.has(item.word.toLowerCase())) continue;
        await DB.put('words', { ...item, status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, createdAt:Date.now() + added });
        added++;
      }
      State.words = await DB.all('words'); State.batchPreview = []; await ensureDailyLog();
      showToast(added ? `已录入 ${added} 个单词` : '没有新增词条，请检查释义或重复项'); render();
    }
    init();
  </script>
</body>
