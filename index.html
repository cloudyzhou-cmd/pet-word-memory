    /* ==================== 交互事件 ==================== */
    document.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]'); if (!target) return; const action = target.dataset.action;
      if (action === 'navigate') { Router.navigate(target.dataset.path); return; }
      if (action === 'open-word-card') { const word = State.words.find(item => item.id === Number(target.dataset.id)); if (word) { State.selectedWordId = word.id; render(); } return; }
      if (action === 'close-word-card') { State.selectedWordId = null; render(); return; }
      if (action === 'modal-noop') return;
      if (action === 'open-admin-tab') { State.adminTab = target.dataset.tab || 'overview'; if (State.route === '/admin') render(); else Router.navigate('/admin'); return; }
      if (action === 'skip-guide') { setGuideSeen(); return; }
      if (action === 'next-guide') { if (State.guidePage < 2) { State.guidePage++; render(); } else setGuideSeen(); return; }
      if (action === 'start-task') { await startTask(target.dataset.type); return; }
      if (action === 'add-extra-study') { await addExtraStudy(target.dataset.count); return; }
      if (action === 'start-weekly-test') { startWeeklyTest(); return; }
      if (action === 'exit-weekly-test') { if (confirm('确定退出本次周测吗？已完成的项目会在本次检测结束后记录。')) { State.weeklyTest = null; Router.navigate('/learn'); } return; }
      if (action === 'weekly-meaning-answer') { const test = State.weeklyTest; const word = weeklyCurrentWord(); if (!test || test.correct !== null || !word) return; test.selected = target.dataset.choice; test.correct = target.dataset.choice === quizMeaning(word); if (test.correct) test.meaningScore++; renderWeeklyTest(); return; }
      if (action === 'weekly-meaning-continue') { if (State.weeklyTest) { State.weeklyTest.stage = 'spelling'; State.weeklyTest.spellValue = ''; State.weeklyTest.spellError = false; State.weeklyTest.spellCorrect = false; renderWeeklyTest(); setTimeout(() => $('[data-input="weekly-spell"]')?.focus(), 60); } return; }
      if (action === 'weekly-check-spell') { const test = State.weeklyTest; const word = weeklyCurrentWord(); if (!test || !word) return; const answer = normalizeWord(test.spellValue || ''); if (answer === normalizeWord(word.word)) { test.spellCorrect = true; if (test.spellingAttempts === 0) test.spellingScore++; Speaker.speakCorrect(word); } else { test.spellingAttempts++; test.spellError = true; } renderWeeklyTest(); return; }
      if (action === 'weekly-next-word') { await advanceWeeklyTest(); return; }
      if (action === 'speak' || action === 'speak-current') { const word = action === 'speak' ? State.words.find(item => item.id === Number(target.dataset.id)) : currentWord(); if (word) { Speaker.speakWord(word); if (action === 'speak-current' && State.currentTask?.stage === 'A' && !State.stageAFlipped) { State.stageAReadyAt = Date.now() + COGNITION_SECONDS * 1000; renderLearning(); } } return; }
      if (action === 'exit-learning') { exitLearning(); return; }
      if (action === 'flip-card') { State.stageAFlipped = true; renderLearning(); return; }
      if (action === 'self-known' || action === 'self-unknown') { await markSelfKnown(action === 'self-known'); return; }
      if (action === 'review-self') { const known = target.dataset.known === 'true'; const word = currentWord(); State.currentTask.selfKnown = known; if (!known) { await Scheduler.updateWord(word, { status:'struggling', errorCount:(word.errorCount || 0) + 1, nextReview: tomorrowStart() }); State.currentTask.stage = 'R-card'; } else State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'review-card-continue') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'quiz-answer') { const choice = target.dataset.choice; const correct = choice === quizMeaning(currentWord()); State.stageB.selected = choice; State.stageB.correct = correct; if (correct) { renderLearning(); setTimeout(() => { if (State.currentTask?.stage === 'B') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); } }, 1500); } else { renderLearning(); } return; }
      if (action === 'quiz-continue') { State.currentTask.stage = 'C'; State.spell = null; renderLearning(); return; }
      if (action === 'spell-mode') { State.currentTask.mode = target.dataset.mode; State.spell = { mode: target.dataset.mode, value: '', tiles: shuffle(currentWord().word.toLowerCase().split('').map((letter, index) => ({ letter, key: `${index}-${Math.random()}`, used: false }))), error: false, success: false }; renderLearning(); return; }
      if (action === 'pick-letter') { const tile = State.spell.tiles.find(item => item.key === target.dataset.key); if (!tile || tile.used) return; const max = currentWord().word.length; if (State.spell.value.length >= max) return; tile.used = true; State.spell.value += tile.letter; State.spell.error = false; renderLearning(); return; }
      if (action === 'spell-hint') { const word = currentWord(); const hintIndex = Math.min(State.currentTask.hintCount, word.word.length - 1); State.currentTask.hintCount++; if (State.spell.mode === 'keyboard') { const current = State.spell.value; State.spell.value = word.word.slice(0, Math.max(current.length, hintIndex + 1)); } else { const expected = word.word[hintIndex].toLowerCase(); const index = State.spell.tiles.findIndex(tile => !tile.used && tile.letter === expected); if (index >= 0) { State.spell.tiles[index].used = true; State.spell.value = (State.spell.value + expected).slice(0, word.word.length); } } State.spell.error = false; renderLearning(); return; }
      if (action === 'check-spell') { const word = currentWord(); if (State.spell?.mode === 'keyboard') readKeyboardSpellValue(); const answer = normalizeWord(State.spell?.value || ''); const correct = normalizeWord(word.word); if (answer === correct) { State.spell.error = false; State.spell.success = true; await finishWord(); Speaker.speakCorrect(currentWord()); } else { State.currentTask.spellAttempts++; State.spell.error = true; State.spell.compare = State.spell.value || ''; await Scheduler.updateWord(word, { errorCount: (word.errorCount || 0) + 1, status: State.currentTask.spellAttempts >= 3 ? 'struggling' : word.status, nextReview: tomorrowStart() }); renderLearning(); Speaker.speakCorrect(currentWord()); } return; }
      if (action === 'next-word') {
        const tasks = await getTodayTasks();
        const log = tasks.log;
        const ids = State.currentTask.type === 'review' ? log.plannedReview : log.plannedNew;
        const done = State.currentTask.type === 'review' ? log.wordsReviewed : log.wordsStudied;
        const next = ids.find(id => !done.includes(id));
        State.currentTask = next ? { type: State.currentTask.type, wordId: next, stage: State.currentTask.type === 'review' ? 'R' : 'A', startedAt: Date.now(), spellAttempts: 0, hintCount: 0, mode: 'keyboard', selfKnown: true } : null;
        State.stageAReadyAt = Date.now() + COGNITION_SECONDS * 1000;
        State.stageAFlipped = false;
        State.stageB = null;
        State.spell = null;
        if (State.currentTask) renderLearning(); else { render(); if (log.completed) { Animations.confetti(); showToast('今日完成！明天见 🌟'); } }
        return;
      }
      if (action === 'toggle-sound') { State.settings.soundEnabled = !State.settings.soundEnabled; await DB.put('settings', State.settings); render(); return; }
      if (action === 'admin-login') { await adminLogin(); return; }
      if (action === 'admin-logout') { localStorage.removeItem('petAdminSession'); Router.navigate('/learn'); return; }
      if (action === 'admin-tab') { State.adminTab = target.dataset.tab; if (State.adminTab !== 'manage') State.adminSearch = ''; render(); return; }
      if (action === 'lookup-batch') { await lookupBatchOnline(); return; }
      if (action === 'lookup-form') { await lookupFormOnline(target.closest('form')); return; }
      if (action === 'parse-batch') { State.batchText = $('[data-input="batch-text"]')?.value || State.batchText; State.batchPreview = parseBatchInput(State.batchText); render(); if (!State.batchPreview.length) showToast('没有识别到单词，请检查格式'); else lookupBatchOnline(); return; }
      if (action === 'save-batch') { await saveBatchInput(); return; }
      if (action === 'cancel-edit') { State.editingWordId = null; render(); return; }
      if (action === 'edit-word') { State.editingWordId = Number(target.dataset.id); State.selectedWordId = null; State.adminTab = 'add'; if (State.route === '/admin') render(); else Router.navigate('/admin'); return; }
      if (action === 'delete-word') { await removeWord(Number(target.dataset.id)); return; }
      if (action === 'reset-word') { const word = State.words.find(item => item.id === Number(target.dataset.id)); if (word) { await Scheduler.updateWord(word, { status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, correctStreak:0, successfulReviewStreak:0 }); showToast('学习进度已重置'); render(); } return; }
      if (action === 'admin-page') { State.adminPage += Number(target.dataset.delta); render(); return; }
      if (action === 'export-data') { exportData(); return; }
      if (action === 'import-mode') { await importData(target.dataset.mode); return; }

    /* ==================== 希币成长、单词卡与儿童界面增强 ==================== */
    /** 返回一个可用于成长统计的日期键集合；只把真正学习过的日期算作打卡日。 */
    function studyDaySet() {
      return new Set(State.logs.filter(log => log.completed || (log.wordsStudied || []).length || (log.wordsReviewed || []).length || (log.coinsEarned || 0) > 0).map(log => log.date));
    }
    function dateKeyFromDate(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
    function streakInfo() {
      const days = studyDaySet();
      let current = 0;
      const cursor = new Date(`${State.today}T12:00:00`);
      while (days.has(dateKeyFromDate(cursor))) { current++; cursor.setDate(cursor.getDate() - 1); }
      const ordered = [...days].sort();
      let longest = 0; let run = 0; let previous = null;
      for (const key of ordered) {
        const stamp = dateStart(key);
        if (previous !== null && stamp - previous === 86400000) run++;
        else run = 1;
        longest = Math.max(longest, run); previous = stamp;
      }
      return { current, longest, days };
    }
    /** 本周统计同时服务于首页、成长页和图表。 */
    function weekStats() {
      const now = new Date(`${State.today}T12:00:00`);
      const day = (now.getDay() + 6) % 7;
      const start = new Date(now); start.setDate(now.getDate() - day); start.setHours(0, 0, 0, 0);
      const keys = []; for (let i = 0; i < 7; i++) { const date = new Date(start); date.setDate(start.getDate() + i); keys.push(dateKeyFromDate(date)); }
      const logs = State.logs.filter(log => keys.includes(log.date));
      const studied = unique(logs.flatMap(log => log.wordsStudied || []));
      return { completed: Math.min(30, studied.length), days: logs.filter(log => log.completed || (log.wordsStudied || []).length || (log.wordsReviewed || []).length).length, keys, logs, coins: logs.reduce((sum, log) => sum + (log.coinsEarned || 0), 0) };
    }
    function growthStats() {
      const streak = streakInfo(); const week = weekStats();
      return { coins: Number(State.settings.coins || 0), todayCoins: currentLog()?.coinsEarned || 0, weekCoins: week.coins, studied: unique(State.logs.flatMap(log => log.wordsStudied || [])).length, streak: streak.current, longestStreak: streak.longest, week };
    }

      const wasReview = task.type === 'review';
      let patch = { lastReview: Date.now(), reviewCount: (word.reviewCount || 0) + (wasReview ? 1 : 0), nextReview: Scheduler.calculateNextReview(word, true) };
      if (!wasReview) patch = { ...patch, status: word.status === 'struggling' || task.spellAttempts >= 3 ? 'struggling' : (task.selfKnown ? 'learning' : 'struggling'), nextReview: tomorrowStart() };
      else if (word.status === 'struggling') patch = { ...patch, status: (word.successfulReviewStreak || 0) + 1 >= 2 ? 'learning' : 'struggling', successfulReviewStreak: (word.successfulReviewStreak || 0) + 1 };
      else if (word.status === 'learning') { const correctStreak = (word.correctStreak || 0) + 1; patch = { ...patch, correctStreak, status: correctStreak >= 3 ? 'mastered' : 'learning', nextReview: correctStreak >= 3 ? Date.now() + 3 * 86400000 : tomorrowStart(), masteredInterval: 3 }; }
      await Scheduler.updateWord(word, patch);
      let coinEarned = false;
      if (!wasReview) {
        const awarded = new Set(Array.isArray(State.settings.coinAwardedWordIds) ? State.settings.coinAwardedWordIds : []);
        if (!awarded.has(word.id)) { awarded.add(word.id); State.settings.coinAwardedWordIds = [...awarded]; State.settings.coins = Number(State.settings.coins || 0) + 1; await DB.put('settings', State.settings); coinEarned = true; }

      const key = wasReview ? 'wordsReviewed' : 'wordsStudied'; log[key] = unique([...(log[key] || []), word.id]); log.coinsEarned = (log.coinsEarned || 0) + (coinEarned ? 1 : 0);

      log.completed = (log.wordsStudied || []).length >= (log.plannedNew || []).length && (log.wordsReviewed || []).length >= (log.plannedReview || []).length;

      const wasAwarded = awarded.has(id);

    const Animations = { confetti() { const canvas = $('#confetti'); if (!canvas) return; canvas.hidden = false; canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; const ctx = canvas.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio); const colors = ['#007aff','#34c759','#ff9500','#ff3b30','#7c5cff','#ffd60a']; const pieces = Array.from({ length: 110 }, (_, i) => ({ x: Math.random()*innerWidth, y: -20-Math.random()*innerHeight*.3, size: 5+Math.random()*7, color:colors[i%colors.length], speed: 2+Math.random()*4, drift: -1+Math.random()*2, angle:Math.random()*6 })); const started = performance.now(); const draw = (time) => { ctx.clearRect(0,0,innerWidth,innerHeight); for (const p of pieces) { p.y += p.speed; p.x += p.drift; p.angle += .08; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6); ctx.restore(); } if (time-started < 3000) requestAnimationFrame(draw); else { ctx.clearRect(0,0,innerWidth,innerHeight); canvas.hidden = true; } }; requestAnimationFrame(draw); } };
    function drawChart() { const canvas = $('#weeklyChart'); if (!canvas) return; const rect = canvas.getBoundingClientRect(); const ratio = devicePixelRatio || 1; canvas.width = Math.max(1, rect.width * ratio); canvas.height = Math.max(1, rect.height * ratio); const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio); const width = rect.width, height = rect.height; ctx.clearRect(0,0,width,height); const week = weekStats(); const data = week.keys.map(key => { const log = week.logs.find(item => item.date === key); return log ? (log.wordsStudied || []).length : 0; }); const max = Math.max(5, ...data); const left=28, right=12, top=15, bottom=32; ctx.strokeStyle='#e6eaf0'; ctx.lineWidth=1; for (let i=0;i<=5;i++) { const y=top+(height-top-bottom)*i/5; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(width-right,y); ctx.stroke(); } const labels=['一','二','三','四','五','六','日']; const xStep=(width-left-right)/6; ctx.font='12px -apple-system, sans-serif'; ctx.textAlign='center'; data.forEach((value,i)=>{ const x=left+xStep*i; const y=top+(height-top-bottom)*(1-value/max); ctx.fillStyle='#858b98'; ctx.fillText(labels[i],x,height-8); ctx.fillStyle='#007aff'; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); if(i>0){ const previous = top+(height-top-bottom)*(1-data[i-1]/max); ctx.strokeStyle='#007aff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-xStep,previous); ctx.lineTo(x,y); ctx.stroke(); } }); }

    /** 清理早期版本写入的模板例句，并为旧词条重新匹配本地 Emoji。 */
    async function cleanStoredWordData(words) {
      const fakeEn = [/^The word ".+" means .+\.$/i, /^I learned how to use ".+" in an English sentence today\.$/i];
      const fakeCn = [/^这个例句帮助理解“.*”的用法。$/, /^今天我学习了“.*”这个英语表达。$/];
      const repairCurated = localStorage.getItem('petCuratedRepairV2') !== 'true';
      const cleaned = [];
      for (const word of words || []) {
        const next = { ...word };
        let changed = false;
        if (fakeEn.some(pattern => pattern.test(String(next.exampleEn || '').trim()))) { next.exampleEn = ''; changed = true; }
        if (fakeCn.some(pattern => pattern.test(String(next.exampleCn || '').trim()))) { next.exampleCn = ''; changed = true; }
        const curated = repairCurated ? referenceDataFor(next.word) : null;
        if (curated) {
          /* 这次迁移只修复已知旧版错配词；以后家长手动编辑的内容不会被覆盖。 */
          next.phonetic = curated.phonetic || next.phonetic;
          next.meaning = curated.meaning || next.meaning;
          /* V2 迁移会把已知测试词的旧错配例句一并替换；之后不再覆盖家长手动修改的内容。 */
          if (repairCurated && curated.en) next.exampleEn = curated.en;
          if (repairCurated && curated.cn) next.exampleCn = curated.cn;
          if (!next.hint && curated.hint) next.hint = curated.hint;
          changed = true;
        }
        const expectedEmoji = getEmoji(next.meaning, next.word);
        if (!next.emoji || next.emoji === EMOJI_MAP.default) { next.emoji = expectedEmoji; changed = true; }
        if (changed && next.id !== undefined) await DB.put('words', next);
        cleaned.push(next);
      }
      if (repairCurated) localStorage.setItem('petCuratedRepairV2', 'true');
      return cleaned;
    }

    /** 批量录入同样走统一标准，防止只识别出英文却保存出不完整词条。 */
    async function saveBatch() {
      const existingWords = new Set(State.words.map(word => word.word.toLowerCase()));
      const items = State.batchPreview;
      if (items.some(item => !item.meaning || !item.phonetic || !item.exampleEn || !item.exampleCn)) {
        showToast('正在准备每个词的释义、音标和中英文例句…');
        await mapOnlineWithConcurrency(items, async item => { await lookupWordOnline(item); ensureBilingualExample(item); }, 6);
      }
      const incomplete = items.filter(item => !String(item.meaning || '').trim());
      if (incomplete.length) {
        showToast(`${incomplete.length} 个词没有查到中文释义，暂不录入，请检查拼写或手动补充。`);
        render();
        return;
      }
      let added = 0;
      for (const item of items) {
        ensureBilingualExample(item);
        if (existingWords.has(item.word.toLowerCase())) continue;
        await DB.put('words', { ...item, status:'new', reviewCount:0, lastReview:0, nextReview:0, errorCount:0, createdAt:Date.now() + added });

      const book = State.notebooks.find(item => item.name === PET_STRENGTH_BOOK_NAME);
      if (!book || !BUILTIN_PET_STRENGTH_DATA.length) return;
      const seedTermKey = value => String(value || '').toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
      const existingByWord = new Map();
      for (const item of notebookWords(book.id)) {
        /* 同时兼容旧版本已经去掉短语标点的词条，升级时不会重复生成。 */
        existingByWord.set(seedTermKey(item.word), item);
        existingByWord.set(normalizeLookupTerm(item.word), item);
      }
      const now = Date.now();
      let added = 0;
      for (const source of BUILTIN_PET_STRENGTH_DATA) {
        const wordText = seedTermKey(source.term);
        if (!wordText || !source.meaning || !source.exampleEn || !source.exampleCn) continue;
        const builtinEmoji = getEmoji(source.meaning, wordText);
        const builtin = {
          word: wordText,
          phonetic: String(source.phonetic || '').trim(),
          meaning: String(source.meaning || '').trim(),
          exampleEn: String(source.exampleEn || '').trim(),
          exampleCn: String(source.exampleCn || '').trim(),
          /* 每次内置资料升级都重新计算 Emoji，修复旧版大量遗留的 📌。 */
          emoji: builtinEmoji,
          hint: String(source.hint || '').trim(),
          pos: String(source.pos || '').trim(),
          synonym: String(source.synonym || '').trim(),
          sourceUnit: source.unit,

          sourceLabel: String(source.label || '').trim(),
          notebookId: book.id,
          builtinKey: 'pet-strength:' + wordText,
          builtinVersion: PET_STRENGTH_DATA_VERSION
        };
        const existing = existingByWord.get(wordText) || existingByWord.get(normalizeLookupTerm(wordText));
        if (existing) {
          /* 同词已存在时，只替换资料字段；学习进度和用户上传的图片全部保留。 */
          const next = {
            ...existing,
            ...builtin,
            imageUrl: existing.imageUrl || '',
            imageSource: existing.imageSource || '',
            imageTitle: existing.imageTitle || '',
            hint: existing.hint || builtin.hint || ''
          };
          const fields = ['word', 'phonetic', 'meaning', 'exampleEn', 'exampleCn', 'emoji', 'hint', 'pos', 'synonym', 'sourceUnit', 'sourceLesson', 'sourceLabel', 'notebookId', 'builtinKey', 'builtinVersion'];

      let log = State.logs.find(item => item.date === State.today && Number(item.notebookId) === bookId);
      const live = id => State.words.some(word => word.id === id && Number(word.notebookId) === bookId);
      const completedNew = unique((log?.wordsStudied || []).filter(live));
      const completedReview = unique((log?.wordsReviewed || []).filter(live));
      const currentNew = unique((log?.plannedNew || []).filter(live));
      const currentReview = unique((log?.plannedReview || []).filter(live));
      const usedNew = new Set([...completedNew, ...currentNew]);
      const availableNew = notebookWords(bookId).filter(word => word.status === 'new' && !usedNew.has(word.id)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const usedReview = new Set([...completedReview, ...currentReview]);
      const due = notebookWords(bookId).filter(word => word.status !== 'new' && (word.nextReview || 0) <= dateStart(State.today) && !usedReview.has(word.id))
        .sort((a, b) => (a.status === 'struggling' ? -1 : 1) - (b.status === 'struggling' ? -1 : 1) || (b.errorCount || 0) - (a.errorCount || 0) || (a.nextReview || 0) - (b.nextReview || 0));
      const masteredFallback = notebookWords(bookId).filter(word => word.status === 'mastered' && !usedReview.has(word.id) && !due.some(item => item.id === word.id)).sort((a, b) => (a.lastReview || 0) - (b.lastReview || 0));
      const settingsMatch = Boolean(log && log.dailyNew === State.settings.dailyNew && log.dailyReview === State.settings.dailyReview);

      let plannedReview = settingsMatch ? currentReview : unique([...completedReview, ...currentReview]);

      if (plannedReview.length < State.settings.dailyReview) plannedReview = unique([...plannedReview, ...[...due, ...masteredFallback].slice(0, State.settings.dailyReview - plannedReview.length).map(word => word.id)]);

      await DB.put('words', { ...word, notebookId: book.id });
      for (const log of State.logs) {
        const next = { ...log, plannedNew: (log.plannedNew || []).filter(id => id !== word.id), plannedReview: (log.plannedReview || []).filter(id => id !== word.id) };
        if (JSON.stringify(next) !== JSON.stringify(log)) await DB.put('dailyLog', next);
      }
      State.words = await DB.all('words'); State.logs = await DB.all('dailyLog'); await ensureDailyLog(); render(); showToast('已移动到“' + book.name + '”');
    }

      }
      let entry = null;
      const isSingleWord = /^[A-Za-z]+(?:['-][A-Za-z]+)?$/.test(term);
      if (isSingleWord && navigator.onLine !== false) {
        try {
          const cacheKey = term.toLowerCase();
          if (ONLINE_CACHE.dictionary?.[cacheKey]) entry = ONLINE_CACHE.dictionary[cacheKey];
          else {
            const response = await fetchWithTimeout(`${DICTIONARY_API}${encodeURIComponent(term)}`, {}, 2800);
            if (response.ok) {
              const payload = await response.json();
              entry = Array.isArray(payload) ? payload[0] : null;
              if (entry) { ONLINE_CACHE.dictionary = ONLINE_CACHE.dictionary || {}; ONLINE_CACHE.dictionary[cacheKey] = entry; writeOnlineCache(ONLINE_CACHE); }
            }
          }
        } catch (_) {}
      }
      const phonetic = entry?.phonetic || entry?.phonetics?.find(value => value.text)?.text || '';
      const definitions = entry?.meanings?.flatMap(value => value.definitions || []) || [];
      const definition = definitions.find(value => value.definition)?.definition || '';
      const example = definitions.find(value => isUsableEnglishExample(value.example))?.example || '';
      if (!item.phonetic && phonetic) item.phonetic = phonetic;
      if (!isUsableEnglishExample(item.exampleEn) && example) item.exampleEn = example;
      if (!isUsableMeaning(item.meaning)) {
        const translated = await translateOnline(definition || term);
        if (translated) item.meaning = translated;
      }
      if (!isUsableChineseExample(item.exampleCn) && isUsableEnglishExample(item.exampleEn)) {
        const translated = await translateOnline(item.exampleEn);
        if (translated) item.exampleCn = translated;
      }
      item.emoji = String(item.emoji || '').trim() || getEmoji(item.meaning, term);
      item.referenceUrl = `${CAMBRIDGE_REFERENCE}${encodeURIComponent(term.replace(/\s+/g, '-'))}`;
      return item;
    }

    /** 启动时修复旧版留下的默认图标、英文伪释义和模板句，但不覆盖家长已有的真实内容。 */
    async function cleanStoredWordData(words) {
      const fakeEn = [/^The word ".+" means .+\.$/i, /^I learned how to use ".+" in an English sentence today\.$/i];
      const fakeCn = [/^这个例句帮助理解“.*”的用法。$/, /^今天我学习了“.*”这个英语表达。$/];
      const cleaned = [];
      for (const word of words || []) {
        const next = { ...word };
        const curated = referenceDataFor(next.word);
        let changed = false;
        if (fakeEn.some(pattern => pattern.test(String(next.exampleEn || '').trim()))) { next.exampleEn = ''; changed = true; }
        if (fakeCn.some(pattern => pattern.test(String(next.exampleCn || '').trim()))) { next.exampleCn = ''; changed = true; }
        if (curated) {
          if (!isUsableMeaning(next.meaning)) { next.meaning = curated.meaning || next.meaning; changed = true; }
          if (!next.phonetic && curated.phonetic) { next.phonetic = curated.phonetic; changed = true; }
          if (!isUsableEnglishExample(next.exampleEn) && curated.en) { next.exampleEn = curated.en; changed = true; }
          if (!isUsableChineseExample(next.exampleCn) && curated.cn) { next.exampleCn = curated.cn; changed = true; }
          if ((!next.emoji || next.emoji === EMOJI_MAP.default) && (curated.emoji || next.meaning)) { next.emoji = curated.emoji || getEmoji(next.meaning, next.word); changed = true; }
        } else if (!next.emoji || next.emoji === EMOJI_MAP.default) {
          const expected = getEmoji(next.meaning, next.word);
          if (expected !== EMOJI_MAP.default && next.emoji !== expected) { next.emoji = expected; changed = true; }
        }
        if (changed && next.id !== undefined) await DB.put('words', next);
        cleaned.push(next);
      }
      return cleaned;
    }

    /** 保存批量预览时只保存资料完整的条目，其余条目留在预览中逐条处理。 */
    async function saveBatch() {
      const items = State.batchPreview;
      if (!items.length || State.batchLookupRunning) return;
      const pending = items.filter(item => missingBatchFields(item).length);
      if (pending.length) {
        showToast(`正在补全 ${pending.length} 个资料不完整的词…`);
        await mapOnlineWithConcurrency(pending, async item => { await lookupWordOnline(item); }, 6);
      }
      const ready = items.filter(item => !missingBatchFields(item).length);
      const incomplete = items.filter(item => missingBatchFields(item).length);
      if (!ready.length) {
        State.batchPreview = items;
        render();
        showToast('这批词还没有完整资料，请按每条提示逐个补充。');
        return;
      }
      const bookId = Number(State.batchNotebookId || State.activeNotebookId);
      const existingByWord = new Map(State.words.map(word => [normalizeLookupTerm(word.word), word]));
      let added = 0;
      let updated = 0;
      for (const item of ready) {
        ensureBilingualExample(item);
        if (!item.emoji || item.emoji === EMOJI_MAP.default) item.emoji = getEmoji(item.meaning, item.word);
        const existing = existingByWord.get(normalizeLookupTerm(item.word));
        if (existing) {
          // 旧版本可能已经保存了同名单词，但资料是残缺的。再次录入时补齐资料，
          // 同时保留孩子的学习状态、希币记录、错误次数和所属单词本。
          await DB.put('words', {
            ...existing,
            phonetic: item.phonetic || existing.phonetic || '',
            meaning: item.meaning || existing.meaning || '',
            exampleEn: item.exampleEn || existing.exampleEn || '',
            exampleCn: item.exampleCn || existing.exampleCn || '',
            emoji: item.emoji || existing.emoji || getEmoji(item.meaning, item.word),
            hint: item.hint || existing.hint || '',
            imageUrl: item.imageUrl || existing.imageUrl || '',
            imageSource: item.imageSource || existing.imageSource || '',
            imageTitle: item.imageTitle || existing.imageTitle || ''
          });
          updated++;
          continue;
        }
        await DB.put('words', { ...item, notebookId: bookId, status: 'new', reviewCount: 0, lastReview: 0, nextReview: 0, errorCount: 0, createdAt: Date.now() + added });
        added++;
      }
      State.words = await DB.all('words');
      State.batchPreview = incomplete;
      State.batchText = incomplete.map(item => item.word).join('\n');
      State.batchEditIndex = null;
      await ensureDailyLog();
      render();
      const savedText = added && updated
        ? `新增 ${added} 个，并补齐 ${updated} 个已有词`
        : added
          ? `已录入 ${added} 个单词到“${notebookName(bookId)}”`
          : `已补齐 ${updated} 个已有词`;
      showToast(incomplete.length ? `${savedText}；还有 ${incomplete.length} 个待补充` : savedText);
    }

      const extraBlock = `<article class="card extra-study-card"><div class="row between"><div class="task-icon">🌟</div><span class="task-status pending">不影响基础任务</span></div><div><div class="task-title">今天多学一点${extraWords.length ? ` · 已安排 ${extraWords.length} 个` : ''}</div><div class="task-caption">基础任务完成后还想继续？可以临时增加学习量，额外词也会获得希币。</div></div>${extraWords.length ? `<div class="word-preview">${extraWords.map(word => escapeHtml(word.word)).join(' · ')}</div><button class="btn ${extraDone >= extraWords.length ? 'btn-secondary' : 'btn-warning'} btn-block" data-action="start-task" data-type="extra" ${extraDone >= extraWords.length ? 'disabled' : ''}>${extraDone >= extraWords.length ? '额外词已学完' : `开始额外学习（${extraDone}/${extraWords.length}） →`}</button>` : ''}<div class="extra-study-actions"><button class="btn btn-secondary" data-action="add-extra-study" data-count="2" onclick="event.preventDefault();event.stopPropagation();window.__XIXI_ADD_EXTRA_STUDY__('2')" ${extraAvailable < 1 ? 'disabled' : ''}>+2 个</button><button class="btn btn-secondary" data-action="add-extra-study" data-count="4" onclick="event.preventDefault();event.stopPropagation();window.__XIXI_ADD_EXTRA_STUDY__('4')" ${extraAvailable < 1 ? 'disabled' : ''}>+4 个</button><button class="btn btn-secondary" data-action="add-extra-study" data-count="6" onclick="event.preventDefault();event.stopPropagation();window.__XIXI_ADD_EXTRA_STUDY__('6')" ${extraAvailable < 1 ? 'disabled' : ''}>+6 个</button></div><div class="tiny muted" style="text-align:center">${extraAvailable ? `还可从课程顺序继续学习 ${extraAvailable} 个词` : '这个单词本的未学习词条已经学完啦'}</div></article>`;
      return `<section class="screen"><header class="topbar"><div class="brand-lockup"><div class="brand-mark">${escapeHtml(book?.icon || '📚')}</div><div><div class="brand-title">希希词语家</div><div class="brand-subtitle">当前学习：${escapeHtml(book?.name || '单词本')} · V${APP_VERSION}</div></div></div></header><div class="stack">${notebookSelector()}<section class="card hero-card"><div class="eyebrow">本周学习进度</div><div class="hero-number">${week.completed}<span> / 30 个词</span></div><div>每天一点点，词汇会长大 🌱</div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="progress-meta"><span>${week.extraCompleted ? `基础 ${week.completed} 个 · 额外 ${week.extraCompleted} 个` : week.completed ? `已经坚持 ${week.days} 天` : '今天也来学一点'}</span><span>${percent}%</span></div></section><section class="card coin-hero"><div class="eyebrow">个人打卡榜 · 我的希币</div><div class="coin-number">${growth.coins}<span> 希币</span></div><div>积分 ${growth.coins} 分 · 今天 +${growth.todayCoins} 希币</div><button class="btn" style="margin-top:15px;color:#9a5600;background:#fff" data-action="open-admin-tab" data-tab="overview">查看成长榜 →</button></section><section class="stack"><div class="section-heading"><h2>今天学什么</h2><span class="badge ${dailyDone ? 'green' : 'blue'}">${dailyDone ? '基础任务完成' : `${newDone + reviewDone} / ${newWords.length + reviewWords.length}`}</span></div><article class="card task-card new-task"><div class="row between"><div class="task-icon">📘</div><span class="task-status ${newComplete ? '' : 'pending'}">${newComplete ? '已完成 ✅' : '新词任务'}</span></div><div><div class="task-title">今日新学 · ${newWords.length} 个</div><div class="task-caption">${newWords.length ? '按 Unit → Lesson 顺序学习，完成拼写就能获得希币。' : '这个单词本今天没有安排新的学习词条。'}</div></div>${newWords.length ? `<div class="word-preview">${newWords.map(word => escapeHtml(word.word)).join(' · ')}</div>` : ''}${newButton}</article><article class="card task-card review-task ${!newComplete && reviewWords.length ? 'locked' : ''}"><div class="row between"><div class="task-icon">📙</div><span class="task-status ${reviewComplete ? '' : newComplete ? 'pending' : 'lock'}">${reviewComplete ? '已完成 ✅' : !newComplete ? '🔒 待解锁' : '复习任务'}</span></div><div><div class="task-title">今日复习 · ${reviewWords.length} 个</div><div class="task-caption">${!newComplete ? '完成今日新词后，就能开始复习啦。' : reviewWords.length ? '把学过的单词再叫醒一次。' : '今天没有到期复习词，轻松完成！'}</div></div>${reviewButton}</article>${extraBlock}</section>${renderWeeklyTestCard(getWeeklyTestWords())}<section class="card card-pad"><div class="row between"><div><h3>${dailyDone ? '基础任务完成！还可以继续加学 🌟' : '准备好了吗？'}</h3><p class="muted small" style="margin-top:6px">${dailyDone ? '今日新词和复习已经记录下来，额外学习不会改变明天的计划。' : `当前学习单词本：${escapeHtml(book?.name || '')}。`}</p></div><div style="font-size:35px">${dailyDone ? '🎉' : '🧠'}</div></div></section></div>${navBar()}</section>`;
    }
    function renderWords() {
      const query = State.wordSearch.trim().toLowerCase(); const words = notebookWords().filter(word => !query || word.word.toLowerCase().includes(query) || String(word.meaning || '').toLowerCase().includes(query));
      return `<section class="screen">${pageTop('词库', `${activeNotebook()?.name || '单词本'} · ${words.length} 个`)}<div class="stack">${notebookSelector('当前查看单词本')}<div class="search-box"><span>⌕</span><input class="input" style="padding-left:42px" data-input="word-search" value="${escapeHtml(State.wordSearch)}" placeholder="搜索英文、短语或中文释义" aria-label="搜索词库"></div><div class="row between"><div><h2>${escapeHtml(activeNotebook()?.name || '我的单词本')}</h2><p class="muted tiny" style="margin-top:5px">按 Unit → Lesson 排列；点击单词查看完整单词卡</p></div><span class="muted small">${words.length} 个结果</span></div>${words.length ? renderCourseWordRows(words) : '<div class="card empty"><div class="empty-icon">📚</div><p>这个单词本还没有词条</p><button class="btn btn-primary" style="margin-top:14px" data-action="open-admin-tab" data-tab="add">添加第一个单词</button></div>'}</div>${navBar()}</section>`;
    }
    function renderAdminManage() {
      const bookId = Number(State.activeNotebookId); const query = State.adminSearch.toLowerCase(); const filtered = notebookWords(bookId).filter(word => !query || word.word.toLowerCase().includes(query) || String(word.meaning || '').includes(query)).sort(compareCourseOrder); const totalPages = Math.max(1, Math.ceil(filtered.length / 20)); State.adminPage = Math.min(State.adminPage, totalPages); const page = filtered.slice((State.adminPage - 1) * 20, State.adminPage * 20);
      return `<section class="card card-pad"><div class="row between wrap"><div><div class="eyebrow">词库管理</div><h2 style="margin-top:7px">${escapeHtml(notebookName(bookId))}</h2><p class="muted tiny" style="margin-top:5px">按 Unit → Lesson 排列；可以编辑、删除或移动单词</p></div><span class="badge blue">${filtered.length} 个</span></div>${notebookSelector('当前管理单词本')}<div class="search-box" style="margin-top:17px"><span>⌕</span><input class="input" style="padding-left:42px" data-input="admin-search" value="${escapeHtml(State.adminSearch)}" placeholder="按英文或中文搜索"></div><div class="admin-table-wrap" style="margin-top:13px"><table class="admin-table"><thead><tr><th>词语</th><th>音标</th><th>释义</th><th>移动到</th><th>状态</th><th>操作</th></tr></thead><tbody>${page.length ? page.map(word => `<tr><td><div class="row">${wordVisual({ ...word, emoji: displayEmoji(word) })}<div><strong>${escapeHtml(word.word)}</strong><div class="tiny muted">${escapeHtml(courseGroupLabel(word))}</div></div></div></td><td class="muted">${escapeHtml(word.phonetic || '—')}</td><td>${escapeHtml(word.meaning || '中文释义待补充')}</td><td><select class="move-select" data-input="move-word" data-id="${word.id}" aria-label="移动 ${escapeHtml(word.word)}">${notebookOptionsHtml('move-' + word.id, word.notebookId)}</select></td><td>${statusBadge(word)}</td><td><div class="table-actions"><button class="mini-btn blue" data-action="edit-word" data-id="${word.id}">编辑</button><button class="mini-btn red" data-action="delete-word" data-id="${word.id}">删除</button></div></td></tr>`).join('') : '<tr><td colspan="6" class="empty">这个单词本还没有词条</td></tr>'}</tbody></table></div><div class="row between" style="margin-top:15px"><span class="muted small">第 ${State.adminPage} / ${totalPages} 页</span><div class="row"><button class="mini-btn" data-action="admin-page" data-delta="-1" ${State.adminPage <= 1 ? 'disabled' : ''}>上一页</button><button class="mini-btn" data-action="admin-page" data-delta="1" ${State.adminPage >= totalPages ? 'disabled' : ''}>下一页</button></div></div></section>`;
    }
    /* 删除、移动词条时同步清理额外学习计划，避免留下无效任务。 */
    const previousRemoveWordV11 = removeWord;
    async function removeWord(id) {
      const word = State.words.find(item => item.id === id); if (!word) return;
      if (!confirm(`确定删除“${word.word}”吗？这会同时移除它的学习记录。`)) return;
      const awarded = new Set(Array.isArray(State.settings.coinAwardedWordIds) ? State.settings.coinAwardedWordIds : []); const wasAwarded = awarded.has(id); await DB.delete('words', id);
      for (const log of State.logs) { const next = { ...log, wordsStudied: (log.wordsStudied || []).filter(item => item !== id), wordsReviewed: (log.wordsReviewed || []).filter(item => item !== id), extraWordsStudied: (log.extraWordsStudied || []).filter(item => item !== id), plannedNew: (log.plannedNew || []).filter(item => item !== id), plannedReview: (log.plannedReview || []).filter(item => item !== id), plannedExtraNew: (log.plannedExtraNew || []).filter(item => item !== id) }; if (wasAwarded && (log.wordsStudied || []).includes(id)) next.coinsEarned = Math.max(0, (log.coinsEarned || 0) - 1); if (JSON.stringify(next) !== JSON.stringify(log)) await DB.put('dailyLog', next); }
      if (wasAwarded) { State.settings.coinAwardedWordIds = [...awarded].filter(item => item !== id); State.settings.coins = Math.max(0, Number(State.settings.coins || 0) - 1); await DB.put('settings', State.settings); }
      State.words = await DB.all('words'); State.logs = await DB.all('dailyLog'); State.selectedWordId = null; State.editingWordId = null; if (State.currentTask?.wordId === id) { State.currentTask = null; State.spell = null; } showToast('单词和相关记录已删除'); render();
    }
    /* 额外任务完成后的“继续下一个”不能走旧版基础任务分支。 */
    window.__XIXI_ADD_EXTRA_STUDY__ = count => addExtraStudy(count);
    document.addEventListener('click', async event => {
      const target = event.target.closest('[data-action="next-word"]'); if (!target || State.currentTask?.type !== 'extra') return;
      event.preventDefault(); event.stopImmediatePropagation(); const tasks = await getTodayTasks(); const ids = tasks.log.plannedExtraNew || []; const done = tasks.log.extraWordsStudied || []; const nextId = ids.find(id => !done.includes(id));
      if (nextId) { State.currentTask = { type:'extra', wordId:nextId, stage:'A', startedAt:Date.now(), spellAttempts:0, hintCount:0, mode:'keyboard', selfKnown:true }; State.stageAReadyAt = Date.now() + COGNITION_SECONDS * 1000; State.stageAFlipped = false; State.stageB = null; State.spell = null; renderLearning(); } else { State.currentTask = null; State.spell = null; render(); showToast('额外学习完成啦 🌟'); }
    }, true);
    window.__XIXI_IMPORT_ENGINE__={version:IMPORT_ENGINE_VERSION,appVersion:APP_VERSION,parseBatchInput,extractVocabularyFromOcr,missingBatchFields,referenceDataFor,compareCourseOrder};

    init();
  </script>
